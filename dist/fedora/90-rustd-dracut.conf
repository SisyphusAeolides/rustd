# SPDX-License-Identifier: LGPL-2.1-or-later
# Build Fedora initramfs images around the shell/base dracut path and RustD's
# udev implementation. Compatibility pathnames may remain, but systemd's
# initramfs implementation modules must not be selected.
force_add_dracutmodules+=" base udev-rules selinux "
install_items+=" /usr/bin/rustudevadm "
omit_dracutmodules+=" systemd systemd-network-management systemd-ac-power systemd-ask-password systemd-battery-check systemd-bsod systemd-coredump systemd-creds systemd-hostnamed systemd-initrd systemd-integritysetup systemd-journald systemd-ldconfig systemd-modules-load systemd-networkd systemd-pcrextend systemd-portabled systemd-pstore systemd-repart systemd-resolved systemd-sysctl systemd-sysext systemd-sysusers-service systemd-timedated systemd-timesyncd systemd-tmpfiles systemd-udevd systemd-veritysetup systemd-import systemd-cryptsetup systemd-emergency dracut-systemd systemd-sysusers rngd memstrack "
