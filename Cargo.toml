# RustD exposes only native executable names.

[dependencies]
# libc: C type definitions only (pid_t, c_int, etc.) for FFI boundaries.
# No syscalls are called through libc — those live in ffi/*.c.
libc = "0.2"
anyhow = "1"
bitflags = "2"
bytes = "1"
crossbeam-queue = "0.3"
memmap2 = "0.9"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# zbus: D-Bus protocol implementation for the RustD manager control plane.
zbus = { version = "=4.0.1", default-features = false, features = ["tokio"] }
# Keep the wire-format crate aligned with zbus 4.0 so the Rust 1.75 MSRV
# cannot drift through newer procedural-macro dependencies.
zvariant = { version = "=4.0.0", default-features = false }
# toml_edit 0.19 accepts any indexmap 2.x. Newer indexmap releases require a
# newer compiler, so retain the Rust 1.75-compatible dependency branch.
indexmap = "=2.2.6"
# tokio: required by zbus for async D-Bus I/O only.
# The main event loop is the native epoll loop in src/event/; tokio is not
# used by PID 1 itself.
tokio = { version = "=1.35.1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
clap = { version = "=4.5.50", features = ["derive"] }
clap_builder = "=4.5.50"
clap_derive = "=4.5.49"
clap_lex = "=0.7.6"
anstream = "=0.6.21"

[features]
default = ["supremacy"]
chaos = []
ml-weave = []
fortran-sched = []
beast-wire = []
kalman = []
formal-crosscheck = []
obs = []
supremacy = ["obs"]

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# RustD's public domain types intentionally use explicit component names such
# as UnitState, JobQueue, JournalWriter, and CgroupManager.
module_name_repetitions = "allow"
# Transitional allowances while native components are being normalized.
too_many_lines = "allow"
struct_excessive_bools = "allow"
single_match_else = "allow"
match_single_binding = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
unnecessary_wraps = "allow"
needless_pass_by_value = "allow"
manual_strip = "allow"
similar_names = "allow"
match_same_arms = "allow"
if_not_else = "allow"
unreadable_literal = "allow"
manual_range_contains = "allow"
collapsible_if = "allow"
needless_borrow = "allow"
case_sensitive_file_extension_comparisons = "allow"
wildcard_in_or_patterns = "allow"
format_collect = "allow"
struct_field_names = "allow"
manual_let_else = "allow"
op_ref = "allow"
items_after_statements = "allow"
never_loop = "allow"
manual_flatten = "allow"
option_option = "allow"
field_reassign_with_default = "allow"
fn_params_excessive_bools = "allow"
collapsible_match = "allow"
cast_ptr_alignment = "allow"
ptr_as_ptr = "allow"
match_on_vec_items = "allow"

[dev-dependencies]
tempfile = "=3.10.1"
