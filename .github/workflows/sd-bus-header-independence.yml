name: sd-bus header independence certification

on:
  push:
    branches: [main]
    paths:
      - libs/compat/sd_bus_abi.h
      - libs/compat/sd_bus_impl.c
      - libs/tests/test_sd_bus_impl.c
      - .github/workflows/sd-bus-header-independence.yml

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Build without systemd development headers
        id: test
        shell: bash
        run: |
          set -o pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libdbus-1-dev dbus
          sudo apt-get remove -y libsystemd-dev || true
          python3 - <<'PY'
          from pathlib import Path
          for name in ('libs/compat/sd_bus_impl.c', 'libs/tests/test_sd_bus_impl.c'):
              p=Path(name)
              s=p.read_text()
              s=s.replace('#include <systemd/sd-bus.h>', '#include "sd_bus_abi.h"')
              p.write_text(s)
          PY
          cc -std=c17 -Wall -Wextra -Werror -fPIC -Ilibs/compat $(pkg-config --cflags dbus-1) \
             -c libs/compat/sd_bus_impl.c -o /tmp/sd_bus_impl.o 2>&1 | tee /tmp/sd-bus-header.log
          cc -std=c17 -Wall -Wextra -Werror -Ilibs/compat $(pkg-config --cflags dbus-1) \
             libs/tests/test_sd_bus_impl.c libs/compat/sd_bus_impl.c $(pkg-config --libs dbus-1) \
             -o /tmp/test-sd-bus-impl 2>&1 | tee -a /tmp/sd-bus-header.log
          dbus-run-session -- /tmp/test-sd-bus-impl 2>&1 | tee -a /tmp/sd-bus-header.log
      - name: Publish and land include independence
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.test.outcome }}
        run: |
          set -euo pipefail
          status=failure
          [ "$OUTCOME" = success ] && status=pass
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p certification
          printf 'schema=rustd-sd-bus-header-independence-v1\nstatus=%s\ntested_sha=%s\nbehavior_outcome=%s\nbackend=libdbus-1\nsystemd_headers=none\n' "$status" "$GITHUB_SHA" "$OUTCOME" > certification/sd-bus-header-independence-latest.txt
          if [ "$status" = failure ]; then
            tail -n 180 /tmp/sd-bus-header.log > certification/sd-bus-header-independence-diagnostic.txt 2>/dev/null || true
          else
            rm -f certification/sd-bus-header-independence-diagnostic.txt
            python3 - <<'PY'
          from pathlib import Path
          for name in ('libs/compat/sd_bus_impl.c', 'libs/tests/test_sd_bus_impl.c'):
              p=Path(name)
              s=p.read_text().replace('#include <systemd/sd-bus.h>', '#include "sd_bus_abi.h"')
              p.write_text(s)
          PY
          fi
          git add -A certification/sd-bus-header-independence-latest.txt certification/sd-bus-header-independence-diagnostic.txt libs/compat/sd_bus_impl.c libs/tests/test_sd_bus_impl.c
          if ! git diff --cached --quiet; then
            git config user.name 'Kenny Glowner'
            git config user.email 'SisyphusAeolides@pm.me'
            git commit -m "Record sd-bus header independence $status"
            git push origin HEAD:main
          fi
          [ "$status" = pass ]
