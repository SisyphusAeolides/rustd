name: Repair event workflow warning
# trigger

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-event-workflow.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Fix misleading indentation in generated event C
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/land-compat-event-engine-v2.yml')
          s=p.read_text()
          old='''    if (ret) *ret = source; return 0;\\n'''
          new='''    if (ret)\\n        *ret = source;\\n    return 0;\\n'''
          if old not in s:
              raise SystemExit('event workflow warning preimage missing')
          p.write_text(s.replace(old,new,1))
          PY
          rm -f .github/workflows/repair-event-workflow.yml
          git add -A .github/workflows/land-compat-event-engine-v2.yml .github/workflows/repair-event-workflow.yml
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Fix event engine generated C warning'
          git push origin HEAD:main
