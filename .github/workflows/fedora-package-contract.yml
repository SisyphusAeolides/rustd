name: Fedora package and SELinux contract
# Validate package ownership, replacement EVRs, and the fail-closed two-phase cutover.

on:
  push:
    branches: [main]
    paths:
      - dist/fedora/**
      - scripts/build-fedora-rpms.sh
      - scripts/check-fedora-package-contract.sh
      - scripts/fedora-vm-guest-cutover.sh
      - scripts/rustd-resolved-revision.txt
      - .github/workflows/fedora-package-contract.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fedora-package-contract
  cancel-in-progress: true

jobs:
  package-contract:
    runs-on: ubuntu-24.04
    container: fedora:rawhide
    steps:
      - name: Install checkout and packaging tools
        shell: bash
        run: |
          set -euo pipefail
          dnf -y install git-core findutils make rpm-build rpmdevtools \
            selinux-policy selinux-policy-devel policycoreutils-devel bzip2 \
            gcc gcc-gfortran python3 cargo rust pkgconf-pkg-config \
            dbus-devel pam-devel json-c-devel
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Validate Fedora package and staged-cutover contract
        id: contract
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/fedora-package-contract.log) 2>&1
          scripts/check-fedora-package-contract.sh 1:999-1
      - name: Publish exact package contract voucher
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          outcome='${{ steps.contract.outcome }}'
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git reset --hard HEAD
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p certification
          {
            printf 'schema=rustd-fedora-package-contract-v5\n'
            printf 'status=%s\n' "$outcome"
            printf 'tested_sha=%s\n' "$GITHUB_SHA"
            printf 'selinux_reference_policy=compiled\n'
            printf 'rpm_specs=parsed\n'
            printf 'capability.systemd=rustd-fedora-compat\n'
            printf 'capability.systemd_udev=rustd-fedora-compat\n'
            printf 'capability.systemd_libs=rustd-compat-libs\n'
            printf 'capability_evr=equal-build-host-systemd-stack\n'
            printf 'stage.pam=rustd-cutover-tools\n'
            printf 'stage.nss=rustd-resolved-nss\n'
            printf 'stage.systemd_erasure=forbidden\n'
            printf 'exclusive.pretrans_auth_guard=required\n'
            printf 'owner.init=rustd-fedora-compat\n'
            if [[ "$outcome" != success ]]; then
              printf '%s\n' '--- tail ---'
              tail -n 300 /tmp/fedora-package-contract.log || true
            fi
          } > certification/fedora-package-contract-latest.txt
          git add certification/fedora-package-contract-latest.txt
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m "Record Fedora package contract ${outcome}" || exit 0
          git push origin HEAD:main
          [[ "$outcome" == success ]]
