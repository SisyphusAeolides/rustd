name: Final native FFI cleanup

defaults:
  run:
    shell: 'bash --noprofile --norc -euo pipefail {0}'

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-ffi-cleanup.yml

permissions:
  contents: write

concurrency:
  group: final-native-ffi-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Patch and validate FFI surface
        id: validate
        continue-on-error: true
        run: |
          exec > >(tee /tmp/ffi-cleanup.log) 2>&1
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential gfortran libdbus-1-dev libpam0g-dev pkg-config
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build.rs')
          s = p.read_text()
          for line in (
              '    println!("cargo:rerun-if-changed=ffi/interface.c");\n',
              '    let interface_obj = object(&out_dir, "rustd_interface");\n',
              '    compile_c(&cc, "ffi/interface.c", &interface_obj);\n',
              '        interface_obj,\n',
          ):
              s = s.replace(line, '')
          p.write_text(s)

          p = Path('ffi/signal.c')
          s = p.read_text()
          s = s.replace(
              ' * opens a signalfd and blocks delivery via the process signal mask.\n * Stub — populated as the event loop is implemented against\n * src/core/main.c in the v261 baseline.\n',
              ' * opens a signalfd and blocks delivery via the process signal mask.\n * This file owns the native reset/blocking helpers used by that event loop.\n')
          p.write_text(s)

          interface = Path('ffi/interface.c')
          if interface.exists():
              interface.unlink()
          PY
          git diff --check
          cargo check --all-targets --all-features --locked
          make check-native
          ! test -e ffi/interface.c
          ! grep -Fq 'ffi/interface.c' build.rs
          ! grep -Fq 'Stub —' ffi/cgroup.c ffi/signal.c

      - name: Publish result
        if: always()
        run: |
          outcome='${{ steps.validate.outcome }}'
          if [[ "$outcome" == success ]]; then
            git fetch origin main
            git rebase origin/main
            rm -f .github/workflows/ffi-cleanup.yml \
                  .github/workflows/final-ffi-cleanup.yml
            git add -A build.rs ffi .github/workflows/ffi-cleanup.yml .github/workflows/final-ffi-cleanup.yml
            git diff --cached --check
            git config user.name 'Kenny Glowner'
            git config user.email 'SisyphusAeolides@pm.me'
            git commit -m 'Remove obsolete native FFI stub'
            git push origin HEAD:main
            exit 0
          fi

          git reset --hard HEAD
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p certification
          {
            printf 'schema=rustd-ffi-cleanup-v1\nstatus=failure\ntested_sha=%s\n' "$GITHUB_SHA"
            printf '%s\n' '--- tail ---'
            tail -n 200 /tmp/ffi-cleanup.log || true
          } > certification/ffi-cleanup-diagnostic.txt
          git add certification/ffi-cleanup-diagnostic.txt
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Record native FFI cleanup diagnostic'
          git push origin HEAD:main
          exit 1
