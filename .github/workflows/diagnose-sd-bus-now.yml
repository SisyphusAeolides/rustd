name: Run exact sd-bus diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-sd-bus-now.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libdbus-1-dev dbus python3-yaml
      - name: Execute strengthened bus transaction
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          data=yaml.safe_load(Path('.github/workflows/fix-sd-bus-dispatch-filter.yml').read_text())
          step=next(x for x in data['jobs']['fix']['steps'] if x.get('name') == 'Patch and certify dispatch bridge')
          script=step['run']
          lines=[]
          for line in script.splitlines():
              if line.strip().startswith('sudo apt-get '):
                  continue
              lines.append(line)
          Path('/tmp/sd-bus-step.sh').write_text('\n'.join(lines)+'\n')
          PY
          set +e
          bash /tmp/sd-bus-step.sh > /tmp/sd-bus.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then exit 0; fi
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p certification
          { printf 'schema=rustd-sd-bus-diagnostic-v2\nstatus=failure\ntested_sha=%s\nrc=%s\n--- tail ---\n' "$GITHUB_SHA" "$rc"; tail -n 240 /tmp/sd-bus.log; } > certification/sd-bus-bridge-diagnostic.txt
          git add certification/sd-bus-bridge-diagnostic.txt
          git config user.name 'Kenny Glauner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Record exact sd-bus diagnostic'
          git push origin HEAD:main
          exit "$rc"
