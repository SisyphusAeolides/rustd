name: Run Fedora transaction compatibility landing
# rebase with local transaction patch preserved

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-fedora-transaction-fix.yml

permissions:
  contents: write

concurrency:
  group: fedora-transaction-landing
  cancel-in-progress: true

jobs:
  land:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Patch and test Fedora transaction frontend
        id: test
        continue-on-error: true
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          exec > >(tee /tmp/fedora-transaction-fix.log) 2>&1
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/fedora/compat/systemctl')
          s=p.read_text()
          old="""command=${1:-}\n[[ -n $command ]] || { echo 'systemctl(RustD): command required' >&2; exit 64; }\nshift\n\ncase $command in\n"""
          new="""command=${1:-}\n[[ -n $command ]] || { echo 'systemctl(RustD): command required' >&2; exit 64; }\nshift\n\n# Normalize options supplied after the verb by Fedora/third-party RPM scriptlets.\nwhile (($#)); do\n    case $1 in\n        --no-reload|--no-warn|--no-pager|--plain|--no-block) shift ;;\n        --quiet|-q) quiet=1; shift ;;\n        --now) now=1; shift ;;\n        --user) scope=user; shift ;;\n        --system) scope=system; shift ;;\n        --global) global=1; scope=user; shift ;;\n        --marked) marked=1; shift ;;\n        --legend=no|--no-legend) shift ;;\n        --type=*|--state=*) shift ;;\n        --type|--state) shift 2 ;;\n        --) shift; break ;;\n        -*) echo \"systemctl(RustD): unsupported command option $1\" >&2; exit 64 ;;\n        *) break ;;\n    esac\ndone\n\ncase $command in\n"""
          if new not in s:
              if old not in s:
                  raise SystemExit('systemctl dispatch preimage missing')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          for file in dist/fedora/compat/* tests/fedora-transaction-compat.sh; do bash -n "$file"; done
          bash tests/fedora-transaction-compat.sh
          git diff --check
          git fetch origin main
          git rebase --autostash origin/main
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/fedora/compat/systemctl')
          s=p.read_text()
          old="""command=${1:-}\n[[ -n $command ]] || { echo 'systemctl(RustD): command required' >&2; exit 64; }\nshift\n\ncase $command in\n"""
          new="""command=${1:-}\n[[ -n $command ]] || { echo 'systemctl(RustD): command required' >&2; exit 64; }\nshift\n\n# Normalize options supplied after the verb by Fedora/third-party RPM scriptlets.\nwhile (($#)); do\n    case $1 in\n        --no-reload|--no-warn|--no-pager|--plain|--no-block) shift ;;\n        --quiet|-q) quiet=1; shift ;;\n        --now) now=1; shift ;;\n        --user) scope=user; shift ;;\n        --system) scope=system; shift ;;\n        --global) global=1; scope=user; shift ;;\n        --marked) marked=1; shift ;;\n        --legend=no|--no-legend) shift ;;\n        --type=*|--state=*) shift ;;\n        --type|--state) shift 2 ;;\n        --) shift; break ;;\n        -*) echo \"systemctl(RustD): unsupported command option $1\" >&2; exit 64 ;;\n        *) break ;;\n    esac\ndone\n\ncase $command in\n"""
          if new not in s:
              if old not in s: raise SystemExit('rebased systemctl preimage missing')
              p.write_text(s.replace(old,new,1))
          PY
          bash tests/fedora-transaction-compat.sh
          rm -f .github/workflows/land-fedora-systemctl-postopts.yml .github/workflows/run-fedora-transaction-fix.yml
          git add -A dist/fedora tests/fedora-transaction-compat.sh \
            .github/workflows/land-fedora-systemctl-postopts.yml .github/workflows/run-fedora-transaction-fix.yml
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Certify Fedora transaction compatibility'
          git push origin HEAD:main
      - name: Publish Fedora transaction failure
        if: steps.test.outcome != 'success'
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          git reset --hard HEAD
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p certification
          {
            printf 'schema=rustd-fedora-transaction-diagnostic-v2\nstatus=failure\ntested_sha=%s\n' "$GITHUB_SHA"
            printf '%s\n' '--- tail ---'
            tail -n 240 /tmp/fedora-transaction-fix.log || true
          } > certification/fedora-transaction-diagnostic.txt
          git add certification/fedora-transaction-diagnostic.txt
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Record Fedora transaction diagnostic'
          git push origin HEAD:main
          exit 1
