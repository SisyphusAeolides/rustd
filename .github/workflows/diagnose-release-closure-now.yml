name: Diagnose release closure now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-release-closure-now.yml

permissions:
  contents: write

concurrency:
  group: rustd-release-closure-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gfortran pkg-config libdbus-1-dev libudev-dev libjson-c-dev
      - name: Run closure with retained diagnostics
        shell: bash
        run: |
          set +e
          {
            set -x
            make clean
            make check-compat
            python3 scripts/check-compat-source-readiness.py --report target/compat-readiness.json --require-complete
            python3 scripts/check-release-closure.py --readiness target/compat-readiness.json --libsystemd build/libs/libsystemd.so.0 --libudev build/libs/libudev.so.1
            grep -RInE '#[[:space:]]*include[[:space:]]*[<"]systemd/' libs include ffi src 2>/dev/null && exit 91
            readelf -d build/libs/libsystemd.so.0 | grep -F 'libsystemd.so' && exit 92
            readelf -d build/libs/libudev.so.1 | grep -F 'libsystemd.so' && exit 93
          } > /tmp/release-closure.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p certification
          {
            printf 'schema=rustd-release-closure-diagnostic-v1\nstatus=failure\ntested_sha=%s\nrc=%s\n' "$GITHUB_SHA" "$rc"
            printf '%s\n' '--- readiness ---'
            cat target/compat-readiness.json 2>/dev/null || true
            printf '%s\n' '--- tail ---'
            tail -n 240 /tmp/release-closure.log
          } > certification/release-closure-diagnostic.txt
          git add certification/release-closure-diagnostic.txt
          git config user.name 'Kenny Glauner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Record release closure diagnostic'
          git push origin HEAD:main
          exit "$rc"
