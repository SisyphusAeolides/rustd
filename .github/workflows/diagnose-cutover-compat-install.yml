name: Diagnose RustD cutover compatibility install
# trigger

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-cutover-compat-install.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Run canonical cutover landing and capture failure
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends python3-yaml
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          wf=yaml.safe_load(Path('.github/workflows/land-cutover-compat-install.yml').read_text())
          step=next(x for x in wf['jobs']['land']['steps'] if x.get('name') == 'Patch cutover install policy')
          Path('/tmp/cutover-step.sh').write_text(step['run'])
          PY
          set +e
          bash /tmp/cutover-step.sh > /tmp/cutover-install.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          git reset --hard HEAD
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p certification
          {
            printf 'schema=rustd-cutover-install-diagnostic-v1\nstatus=failure\ntested_sha=%s\nrc=%s\n' "$GITHUB_SHA" "$rc"
            printf '%s\n' '--- tail ---'
            tail -n 240 /tmp/cutover-install.log || true
          } > certification/cutover-install-diagnostic.txt
          git add certification/cutover-install-diagnostic.txt
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Record cutover install diagnostic'
          git push origin HEAD:main
          exit "$rc"
