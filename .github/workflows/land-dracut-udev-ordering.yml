name: Land dracut udev ordering contract

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/land-dracut-udev-ordering.yml

permissions:
  contents: write

concurrency:
  group: land-dracut-udev-ordering
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply ordered settle and property propagation
        id: verify
        continue-on-error: true
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          exec > >(tee /tmp/dracut-udev-ordering.log) 2>&1
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/bin/rustudevadm.rs')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one preimage, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'use std::time::{Duration, Instant};\n',
              '''use std::time::{Duration, Instant};

const KERNEL_UEVENT_SEQNUM: &str = "/sys/kernel/uevent_seqnum";
const SETTLE_TARGET_FILE: &str = "/run/udev/settle-target";
const LAST_SEQNUM_FILE: &str = "/run/udev/last-seqnum";
const QUEUE_FILE: &str = "/run/udev/queue";
''')

          replace_once(
              '    long_about = "Controls the runtime behavior of systemd-udevd, requests kernel events, manages the event queue, and provides simple debugging mechanisms."\n',
              '    long_about = "Controls the RustD device event daemon, requests kernel events, manages the event queue, and provides simple debugging mechanisms."\n')

          old_trigger = '''fn handle_trigger(args: &TriggerArgs) -> anyhow::Result<()> {
    let action_str = format!("{}\\n", args.action);

    let count = match args.trigger_type.as_str() {
        "subsystems" => trigger_subsystems(args, &action_str),
        "all" => trigger_subsystems(args, &action_str) + trigger_devices(args, &action_str),
        _ => trigger_devices(args, &action_str),
    };

    if args.verbose {
        println!("Triggered {count} devices.");
    }

    if args.settle {
        let settle_args = SettleArgs {
            timeout: 120,
            exit_if_exists: None,
            quiet: false,
        };
        handle_settle(&settle_args)?;
    }

    Ok(())
}
'''
          new_trigger = '''fn handle_trigger(args: &TriggerArgs) -> anyhow::Result<()> {
    let action_str = format!("{}\\n", args.action);

    let count = match args.trigger_type.as_str() {
        "subsystems" => trigger_subsystems(args, &action_str),
        "all" => trigger_subsystems(args, &action_str) + trigger_devices(args, &action_str),
        _ => trigger_devices(args, &action_str),
    };

    if !args.dry_run {
        if let Some(sequence) = read_sequence_file(Path::new(KERNEL_UEVENT_SEQNUM)) {
            fs::create_dir_all("/run/udev")?;
            fs::write(SETTLE_TARGET_FILE, format!("{sequence}\\n"))?;
        }
    }

    if args.verbose {
        println!("Triggered {count} devices.");
    }

    if args.settle {
        let settle_args = SettleArgs {
            timeout: 120,
            exit_if_exists: None,
            quiet: false,
        };
        handle_settle(&settle_args)?;
    }

    Ok(())
}
'''
          replace_once(old_trigger, new_trigger)

          old_settle = '''fn handle_settle(args: &SettleArgs) -> anyhow::Result<()> {
    let queue_file = Path::new("/run/udev/queue");
    let start = Instant::now();
    let timeout = Duration::from_secs(args.timeout);

    loop {
        if let Some(ref exit_file) = args.exit_if_exists {
            if exit_file.exists() {
                return Ok(());
            }
        }

        if !queue_file.exists() {
            return Ok(());
        }

        if let Ok(meta) = fs::metadata(queue_file) {
            if meta.len() == 0 {
                return Ok(());
            }
        }

        if start.elapsed() >= timeout {
            if !args.quiet {
                eprintln!("udevadm settle: timeout reached ({}s)", args.timeout);
                std::process::exit(1);
            }
            return Ok(());
        }

        thread::sleep(Duration::from_millis(50));
    }
}
'''
          new_settle = '''fn handle_settle(args: &SettleArgs) -> anyhow::Result<()> {
    let start = Instant::now();
    let timeout = Duration::from_secs(args.timeout);
    let target = read_sequence_file(Path::new(SETTLE_TARGET_FILE));

    loop {
        if let Some(ref exit_file) = args.exit_if_exists {
            if exit_file.exists() {
                return Ok(());
            }
        }

        if let Some(target) = target {
            if read_sequence_file(Path::new(LAST_SEQNUM_FILE)).is_some_and(|done| done >= target) {
                return Ok(());
            }
        } else {
            // Compatibility fallback for callers that did not issue a RustD
            // trigger first. Dracut's coldplug path always uses the sequence
            // watermark above.
            let queue_file = Path::new(QUEUE_FILE);
            if !queue_file.exists() || fs::metadata(queue_file).is_ok_and(|meta| meta.len() == 0) {
                return Ok(());
            }
        }

        if start.elapsed() >= timeout {
            if !args.quiet {
                if let Some(target) = target {
                    let done = read_sequence_file(Path::new(LAST_SEQNUM_FILE)).unwrap_or(0);
                    eprintln!(
                        "udevadm settle: timeout reached ({}s, processed sequence {done}, target {target})",
                        args.timeout
                    );
                } else {
                    eprintln!("udevadm settle: timeout reached ({}s)", args.timeout);
                }
                std::process::exit(1);
            }
            return Ok(());
        }

        thread::sleep(Duration::from_millis(20));
    }
}

fn read_sequence_file(path: &Path) -> Option<u64> {
    parse_sequence(&fs::read_to_string(path).ok()?)
}

fn parse_sequence(value: &str) -> Option<u64> {
    value.trim().parse().ok()
}
'''
          replace_once(old_settle, new_settle)

          old_control = '''    if !commands.is_empty() {
        for command in commands {
            send_udevd_control(command)?;
        }
    }
    if args.reload {
'''
          new_control = '''    if !commands.is_empty() {
        for command in commands {
            send_udevd_control(command)?;
        }
    }
    for property in &args.property {
        if !property.contains('=') {
            return Err(anyhow::anyhow!(
                "udevadm control: --property requires NAME=VALUE"
            ));
        }
        send_udevd_control(&format!("property={property}"))?;
    }
    if args.reload {
'''
          replace_once(old_control, new_control)

          replace_once(
              '        println!("systemd-hwdb operations complete.");\n',
              '        println!("RustD hardware database operations complete.");\n')

          text += '''

#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn parses_sequence_watermark() {
        assert_eq!(parse_sequence("4242\\n"), Some(4242));
        assert_eq!(parse_sequence("invalid"), None);
    }

    #[test]
    fn accepts_dracut_coldplug_commands() {
        let trigger = Cli::try_parse_from([
            "rustudevadm",
            "trigger",
            "--type=subsystems",
            "--action=add",
        ])
        .expect("dracut subsystem trigger must parse");
        assert!(matches!(trigger.command, Commands::Trigger(_)));

        let settle = Cli::try_parse_from(["rustudevadm", "settle", "--timeout=30"])
            .expect("dracut settle must parse");
        assert!(matches!(settle.command, Commands::Settle(_)));

        let property = Cli::try_parse_from([
            "rustudevadm",
            "control",
            "--property=RD_UDEV=1",
        ])
        .expect("dracut global property must parse");
        assert!(matches!(property.command, Commands::Control(_)));
    }
}
'''
          path.write_text(text)
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --bin rustudevadm --bin rustd-udevd -- -D warnings
          cargo test --locked --bin rustudevadm --bin rustd-udevd
          git diff --check

      - name: Publish failure diagnostic
        if: steps.verify.outcome != 'success'
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          git reset --hard HEAD
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p certification
          {
            printf 'schema=rustd-dracut-udev-diagnostic-v1\n'
            printf 'status=failure\n'
            printf 'tested_sha=%s\n' "$GITHUB_SHA"
            printf '%s\n' '--- tail ---'
            tail -n 300 /tmp/dracut-udev-ordering.log || true
          } > certification/dracut-udev-diagnostic.txt
          git add certification/dracut-udev-diagnostic.txt
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Record dracut udev ordering diagnostic'
          git push origin HEAD:main
          exit 1

      - name: Commit verified ordering contract
        if: steps.verify.outcome == 'success'
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          rm -f .github/workflows/land-dracut-udev-ordering.yml certification/dracut-udev-diagnostic.txt
          git fetch origin main
          git rebase --autostash origin/main
          cargo fmt --all -- --check
          git add -A
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Order dracut udev coldplug completion'
          git push origin HEAD:main
