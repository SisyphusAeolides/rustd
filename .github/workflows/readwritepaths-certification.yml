name: ReadWritePaths certification

on:
  push:
    branches:
      - main
    paths:
      - ffi/sandbox.c
      - ffi/spawn.c
      - ffi/spawn_helper.c
      - ffi/spawn.h
      - ffi/spawn_wire.h
      - src/ffi/spawn.rs
      - src/sandbox.rs
      - src/manager.rs
      - tests/read_write_paths.rs
      - .github/workflows/readwritepaths-certification.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readwritepaths-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-spawn-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.75.0
      - name: Install native compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gfortran
      - name: Build certification binary
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.75.0 test --locked --test read_write_paths --no-run
          test_bin="$(find target/debug/deps -maxdepth 1 -type f -name 'read_write_paths-*' -perm -111 | head -n1)"
          test -n "$test_bin"
          printf '%s\n' "$test_bin" > "$RUNNER_TEMP/readwritepaths-test-bin"
      - name: Run production spawn certification as root
        id: certify
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test_bin="$(cat "$RUNNER_TEMP/readwritepaths-test-bin")"
          sudo --preserve-env=RUST_BACKTRACE "$test_bin" --nocapture --test-threads=1
      - name: Publish exact-SHA certification voucher
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CERT_OUTCOME: ${{ steps.certify.outcome }}
        run: |
          set -euo pipefail
          tested_sha="$GITHUB_SHA"
          status=failure
          if [ "$BUILD_OUTCOME" = success ] && [ "$CERT_OUTCOME" = success ]; then
              status=pass
          fi
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p certification
          existing_sha=""
          if [ -f certification/readwritepaths-latest.txt ]; then
              existing_sha="$(sed -n 's/^tested_sha=//p' certification/readwritepaths-latest.txt | head -n1)"
          fi
          if [ -n "$existing_sha" ] && git cat-file -e "$existing_sha^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$tested_sha" "$existing_sha"; then
              echo "newer ReadWritePaths voucher already exists for $existing_sha; not overwriting with $tested_sha"
              exit 0
          fi
          printf 'schema=rustd-readwritepaths-cert-v1\nstatus=%s\ntested_sha=%s\nbuild_outcome=%s\ncert_outcome=%s\nprotect_system=strict\nread_write_paths=production-spawn-v2\n' \
              "$status" "$tested_sha" "$BUILD_OUTCOME" "$CERT_OUTCOME" \
              > certification/readwritepaths-latest.txt
          if [ "$status" = pass ]; then
              rm -f certification/readwritepaths-build-diagnostic.txt
          fi
          git add -A certification/
          if git diff --cached --quiet; then
              [ "$status" = pass ]
              exit
          fi
          git config user.name 'Kenny Glauner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m "Record ReadWritePaths certification $status"
          bash scripts/push-certification-voucher.sh
          [ "$status" = pass ]
