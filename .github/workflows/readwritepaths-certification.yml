name: ReadWritePaths certification

on:
  push:
    branches:
      - main
    paths:
      - ffi/sandbox.c
      - ffi/spawn.c
      - ffi/spawn_helper.c
      - ffi/spawn.h
      - ffi/spawn_wire.h
      - src/ffi/spawn.rs
      - src/sandbox.rs
      - tests/read_write_paths.rs
      - .github/workflows/readwritepaths-certification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-spawn-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.75.0
      - name: Install native compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gfortran
      - name: Build certification binary
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test read_write_paths --no-run
          test_bin="$(find target/debug/deps -maxdepth 1 -type f -name 'read_write_paths-*' -perm -111 | head -n1)"
          test -n "$test_bin"
          printf '%s\n' "$test_bin" > "$RUNNER_TEMP/readwritepaths-test-bin"
      - name: Run production spawn certification as root
        shell: bash
        run: |
          set -euo pipefail
          test_bin="$(cat "$RUNNER_TEMP/readwritepaths-test-bin")"
          sudo --preserve-env=RUST_BACKTRACE "$test_bin" --nocapture --test-threads=1
