name: Fix OOM cgroup signal API

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-oom-signal-api.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Apply exact manager repair
        shell: bash
        run: |
          set -euo pipefail
          # Exact postimage from the guarded OOM landing remains the only accepted base.
          test "$(git hash-object src/manager.rs)" = 01cac46bc41f2c9d9e025ace5dab1281d6b1954d
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/manager.rs')
          text = path.read_text()
          old = 'self.cgroup.signal_unit(&name, libc::SIGKILL)'
          new = 'self.cgroup.signal_unit(&name, libc::SIGKILL, &[])'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale OOM signal call, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          rm -f .github/workflows/fix-oom-signal-api.yml
          git add -A .github/workflows/fix-oom-signal-api.yml src/manager.rs
          python3 - <<'PY'
          import subprocess
          allowed={'.github/workflows/fix-oom-signal-api.yml','src/manager.rs'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          if actual != allowed:
              raise SystemExit(f'unexpected changed paths: {sorted(actual)}')
          PY
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Fix OOM cgroup kill call'
          git push origin HEAD:main
