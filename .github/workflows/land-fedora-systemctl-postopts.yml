name: Land Fedora systemctl post-verb options

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/land-fedora-systemctl-postopts.yml

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Patch and syntax-check frontend
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/fedora/compat/systemctl')
          s=p.read_text()
          old='''command=${1:-}\n[[ -n $command ]] || { echo 'systemctl(RustD): command required' >&2; exit 64; }\nshift\n\ncase $command in\n'''
          new='''command=${1:-}\n[[ -n $command ]] || { echo 'systemctl(RustD): command required' >&2; exit 64; }\nshift\n\n# Fedora macros and third-party RPM scriptlets commonly put options after the\n# verb (for example `disable --now` or `preset --global`). Normalize those\n# before dispatching to RustD.\nwhile (($#)); do\n    case $1 in\n        --no-reload|--no-warn|--no-pager|--plain|--no-block) shift ;;\n        --quiet|-q) quiet=1; shift ;;\n        --now) now=1; shift ;;\n        --user) scope=user; shift ;;\n        --system) scope=system; shift ;;\n        --global) global=1; scope=user; shift ;;\n        --marked) marked=1; shift ;;\n        --legend=no|--no-legend) shift ;;\n        --type=*|--state=*) shift ;;\n        --type|--state) shift 2 ;;\n        --) shift; break ;;\n        -*) echo "systemctl(RustD): unsupported command option $1" >&2; exit 64 ;;\n        *) break ;;\n    esac\ndone\n\ncase $command in\n'''
          if old not in s:
              if new not in s:
                  raise SystemExit('systemctl command-dispatch preimage missing')
          else:
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          bash -n dist/fedora/compat/systemctl
          git diff --check
          git fetch origin main
          git rebase origin/main
          rm -f .github/workflows/land-fedora-systemctl-postopts.yml
          git add -A dist/fedora/compat/systemctl .github/workflows/land-fedora-systemctl-postopts.yml
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Accept Fedora systemctl post-verb options'
          git push origin HEAD:main
