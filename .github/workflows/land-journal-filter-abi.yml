name: Land journal filter ABI closure

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/land-journal-filter-abi.yml
      - .github/journal-filter-trigger

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install compatibility headers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc gfortran libsystemd-dev libudev-dev
      - name: Apply native journal filtering and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          h=Path('include/rustd/journal.h')
          hs=h.read_text()
          anchor='''int rustd_journal_get_realtime_usec(rustd_journal *journal, uint64_t *usec);\n'''
          addition='''int rustd_journal_get_realtime_usec(rustd_journal *journal, uint64_t *usec);\nint rustd_journal_add_match(rustd_journal *journal, const void *data, size_t size);\nint rustd_journal_add_disjunction(rustd_journal *journal);\nvoid rustd_journal_flush_matches(rustd_journal *journal);\n'''
          if 'rustd_journal_add_match' not in hs:
              if anchor not in hs: raise SystemExit('journal header insertion point missing')
              hs=hs.replace(anchor,addition,1)
          h.write_text(hs)

          p=Path('libs/journal/journal.c')
          s=p.read_text()
          old_struct='''struct rustd_journal {\n    char *directory;\n    char **paths;\n    size_t path_count;\n    /* Current entry index. SIZE_MAX is before the first entry and\n     * path_count is after the last entry. */\n    size_t path_index;\n    char *entry;\n    size_t entry_length;\n};'''
          new_struct='''struct rustd_journal_match {\n    char *data;\n    size_t length;\n    size_t field_length;\n    unsigned term;\n    struct rustd_journal_match *next;\n};\n\nstruct rustd_journal {\n    char *directory;\n    char **paths;\n    size_t path_count;\n    /* Current entry index. SIZE_MAX is before the first entry and\n     * path_count is after the last entry. */\n    size_t path_index;\n    char *entry;\n    size_t entry_length;\n    struct rustd_journal_match *matches;\n    unsigned match_term;\n};'''
          if old_struct in s:
              s=s.replace(old_struct,new_struct,1)
          elif new_struct not in s:
              raise SystemExit('journal struct preimage missing')

          start=s.index('static int collect_journal_files(rustd_journal *journal) {')
          end=s.index('\nint rustd_journal_open(', start)
          collect=r'''static int append_journal_entry(char ***entries, size_t *count, const char *data, size_t length) {
    char **resized;
    char *copy;
    while (length > 0U && data[0] == '\n') {
        data++;
        length--;
    }
    while (length > 0U && data[length - 1U] == '\n')
        length--;
    if (length == 0U)
        return 0;
    copy = malloc(length + 1U);
    if (!copy)
        return -ENOMEM;
    memcpy(copy, data, length);
    copy[length] = '\0';
    resized = realloc(*entries, (*count + 1U) * sizeof(char *));
    if (!resized) {
        free(copy);
        return -ENOMEM;
    }
    *entries = resized;
    (*entries)[(*count)++] = copy;
    return 0;
}

static int collect_journal_files(rustd_journal *journal) {
    char path[512];
    FILE *stream;
    char *raw = NULL;
    char *data = NULL;
    char **entries = NULL;
    size_t count = 0U;
    long file_size;
    size_t raw_size;
    size_t normalized = 0U;
    size_t cursor = 0U;
    int framed;
    int result = 0;

    snprintf(path, sizeof(path), "%s/entries.log",
             journal->directory ? journal->directory : JOURNAL_RUNTIME_DIR);
    stream = fopen(path, "rb");
    if (!stream)
        return -errno;
    if (fseek(stream, 0L, SEEK_END) < 0) {
        result = -errno;
        goto finish;
    }
    file_size = ftell(stream);
    if (file_size < 0) {
        result = -errno;
        goto finish;
    }
    if (fseek(stream, 0L, SEEK_SET) < 0) {
        result = -errno;
        goto finish;
    }
    raw_size = (size_t)file_size;
    raw = malloc(raw_size + 1U);
    data = malloc(raw_size + 1U);
    if (!raw || !data) {
        result = -ENOMEM;
        goto finish;
    }
    if (raw_size > 0U && fread(raw, 1U, raw_size, stream) != raw_size) {
        result = ferror(stream) ? -EIO : -EINVAL;
        goto finish;
    }
    raw[raw_size] = '\0';
    for (size_t i = 0U; i < raw_size; ++i)
        if (raw[i] != '\r')
            data[normalized++] = raw[i];
    data[normalized] = '\0';
    framed = strstr(data, "\n\n") != NULL;

    while (cursor < normalized) {
        size_t next = cursor;
        if (framed) {
            while (next + 1U < normalized && !(data[next] == '\n' && data[next + 1U] == '\n'))
                next++;
            if (next + 1U >= normalized)
                next = normalized;
        } else {
            while (next < normalized && data[next] != '\n')
                next++;
        }
        result = append_journal_entry(&entries, &count, data + cursor, next - cursor);
        if (result < 0)
            goto finish;
        if (framed) {
            cursor = next < normalized ? next + 2U : normalized;
            while (cursor < normalized && data[cursor] == '\n')
                cursor++;
        } else
            cursor = next < normalized ? next + 1U : normalized;
    }

finish:
    fclose(stream);
    free(raw);
    free(data);
    if (result < 0) {
        for (size_t i = 0U; i < count; ++i)
            free(entries[i]);
        free(entries);
        return result;
    }
    journal->paths = entries;
    journal->path_count = count;
    journal->path_index = SIZE_MAX;
    return 0;
}
'''
          s=s[:start]+collect+s[end:]

          old_unref='''    free(journal->paths);\n    free(journal->entry);\n    free(journal);'''
          new_unref='''    free(journal->paths);\n    free(journal->entry);\n    while (journal->matches) {\n        struct rustd_journal_match *next = journal->matches->next;\n        free(journal->matches->data);\n        free(journal->matches);\n        journal->matches = next;\n    }\n    free(journal);'''
          if old_unref in s:
              s=s.replace(old_unref,new_unref,1)
          elif new_unref not in s:
              raise SystemExit('journal unref preimage missing')

          insert_at=s.index('\nstatic int load_entry(', s.index('static void clear_current_entry'))
          match_code=r'''

static void reset_journal_position(rustd_journal *journal) {
    journal->path_index = SIZE_MAX;
    clear_current_entry(journal);
}

int rustd_journal_add_match(rustd_journal *journal, const void *data, size_t size) {
    const char *bytes = data;
    const char *equals;
    struct rustd_journal_match *match;
    struct rustd_journal_match **tail;
    if (!journal || !data)
        return -EINVAL;
    if (size == 0U)
        size = strlen(bytes);
    if (size < 3U)
        return -EINVAL;
    equals = memchr(bytes, '=', size);
    if (!equals || equals == bytes || equals == bytes + size - 1U)
        return -EINVAL;
    match = calloc(1, sizeof(*match));
    if (!match)
        return -ENOMEM;
    match->data = malloc(size);
    if (!match->data) {
        free(match);
        return -ENOMEM;
    }
    memcpy(match->data, bytes, size);
    match->length = size;
    match->field_length = (size_t)(equals - bytes);
    match->term = journal->match_term;
    tail = &journal->matches;
    while (*tail)
        tail = &(*tail)->next;
    *tail = match;
    reset_journal_position(journal);
    return 0;
}

int rustd_journal_add_disjunction(rustd_journal *journal) {
    struct rustd_journal_match *match;
    int has_current = 0;
    if (!journal)
        return -EINVAL;
    for (match = journal->matches; match; match = match->next)
        if (match->term == journal->match_term) {
            has_current = 1;
            break;
        }
    if (!has_current)
        return -EINVAL;
    if (journal->match_term == UINT_MAX)
        return -ERANGE;
    journal->match_term++;
    reset_journal_position(journal);
    return 0;
}

void rustd_journal_flush_matches(rustd_journal *journal) {
    if (!journal)
        return;
    while (journal->matches) {
        struct rustd_journal_match *next = journal->matches->next;
        free(journal->matches->data);
        free(journal->matches);
        journal->matches = next;
    }
    journal->match_term = 0U;
    reset_journal_position(journal);
}

static int entry_has_exact_match(const char *entry, const struct rustd_journal_match *match) {
    const char *cursor = entry;
    while (*cursor) {
        const char *end = strchr(cursor, '\n');
        size_t length = end ? (size_t)(end - cursor) : strlen(cursor);
        if (length == match->length && memcmp(cursor, match->data, length) == 0)
            return 1;
        if (!end)
            break;
        cursor = end + 1;
    }
    return 0;
}

static int same_match_field(const struct rustd_journal_match *a,
                            const struct rustd_journal_match *b) {
    return a->field_length == b->field_length &&
           memcmp(a->data, b->data, a->field_length) == 0;
}

static int journal_entry_matches(const rustd_journal *journal, const char *entry) {
    const struct rustd_journal_match *term_match;
    unsigned term;
    if (!journal->matches)
        return 1;
    for (term = 0U; term <= journal->match_term; ++term) {
        int has_term = 0;
        int term_ok = 1;
        for (term_match = journal->matches; term_match; term_match = term_match->next) {
            const struct rustd_journal_match *previous;
            const struct rustd_journal_match *candidate;
            int field_seen = 0;
            int field_ok = 0;
            if (term_match->term != term)
                continue;
            has_term = 1;
            for (previous = journal->matches; previous != term_match; previous = previous->next)
                if (previous->term == term && same_match_field(previous, term_match)) {
                    field_seen = 1;
                    break;
                }
            if (field_seen)
                continue;
            for (candidate = term_match; candidate; candidate = candidate->next)
                if (candidate->term == term && same_match_field(candidate, term_match) &&
                    entry_has_exact_match(entry, candidate)) {
                    field_ok = 1;
                    break;
                }
            if (!field_ok) {
                term_ok = 0;
                break;
            }
        }
        if (has_term && term_ok)
            return 1;
    }
    return 0;
}
'''
          if 'int rustd_journal_add_match(' not in s:
              s=s[:insert_at]+match_code+s[insert_at:]

          nstart=s.index('int rustd_journal_next(rustd_journal *journal) {')
          nend=s.index('\nint rustd_journal_previous(', nstart)
          next_impl=r'''int rustd_journal_next(rustd_journal *journal) {
    size_t next_index;
    int result;
    if (!journal)
        return -EINVAL;
    if (journal->path_count == 0U)
        return 0;
    for (;;) {
        if (journal->path_index == SIZE_MAX)
            next_index = 0U;
        else if (journal->path_index >= journal->path_count) {
            clear_current_entry(journal);
            return 0;
        } else {
            next_index = journal->path_index + 1U;
            if (next_index >= journal->path_count) {
                journal->path_index = journal->path_count;
                clear_current_entry(journal);
                return 0;
            }
        }
        result = load_entry(journal, next_index);
        if (result < 0)
            return result;
        if (journal_entry_matches(journal, journal->entry))
            return 1;
    }
}
'''
          s=s[:nstart]+next_impl+s[nend:]

          pstart=s.index('int rustd_journal_previous(rustd_journal *journal) {')
          pend=s.index('\nint rustd_journal_previous_skip(', pstart)
          prev_impl=r'''int rustd_journal_previous(rustd_journal *journal) {
    size_t previous_index;
    int result;
    if (!journal)
        return -EINVAL;
    if (journal->path_count == 0U)
        return 0;
    for (;;) {
        if (journal->path_index == SIZE_MAX) {
            clear_current_entry(journal);
            return 0;
        }
        if (journal->path_index >= journal->path_count)
            previous_index = journal->path_count - 1U;
        else if (journal->path_index == 0U) {
            journal->path_index = SIZE_MAX;
            clear_current_entry(journal);
            return 0;
        } else
            previous_index = journal->path_index - 1U;
        result = load_entry(journal, previous_index);
        if (result < 0)
            return result;
        if (journal_entry_matches(journal, journal->entry))
            return 1;
    }
}
'''
          s=s[:pstart]+prev_impl+s[pend:]
          p.write_text(s)

          c=Path('libs/compat/systemd.c')
          cs=c.read_text()
          old='''int sd_journal_add_match(rustd_journal *journal, const void *data, size_t size) {\n    (void)journal;\n    (void)data;\n    (void)size;\n    return 0;\n}\n\nint sd_journal_add_disjunction(rustd_journal *journal) {\n    (void)journal;\n    return 0;\n}\n\nvoid sd_journal_flush_matches(rustd_journal *journal) {\n    (void)journal;\n}\n'''
          new='''int sd_journal_add_match(rustd_journal *journal, const void *data, size_t size) {\n    return rustd_journal_add_match(journal, data, size);\n}\n\nint sd_journal_add_disjunction(rustd_journal *journal) {\n    return rustd_journal_add_disjunction(journal);\n}\n\nvoid sd_journal_flush_matches(rustd_journal *journal) {\n    rustd_journal_flush_matches(journal);\n}\n'''
          if old in cs:
              cs=cs.replace(old,new,1)
          elif new not in cs:
              raise SystemExit('compat journal match wrappers missing')
          c.write_text(cs)

          q=Path('scripts/check-compat-closure.py')
          qs=q.read_text()
          for name in ('sd_journal_add_match','sd_journal_add_disjunction','sd_journal_flush_matches'):
              qs=qs.replace(f'    "{name}",\n','')
          q.write_text(qs)
          PY
          git diff --check
          cc -O2 -g -std=c17 -Wall -Wextra -Werror -fstack-protector-strong \
             -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -Iinclude \
             libs/journal/journal.c libs/tests/test_journal_filters.c -o /tmp/test-journal-filters
          /tmp/test-journal-filters
          make check-compat
          python3 scripts/check-compat-source-readiness.py --report target/compat-readiness.json
          python3 - <<'PY'
          import json
          r=json.load(open('target/compat-readiness.json'))
          if r['supported'] < 122 or r['unsupported'] > 62 or r['missing_source_definition'] != 0:
              raise SystemExit(r)
          PY
          rm -f .github/workflows/land-journal-filter-abi.yml .github/journal-filter-trigger
          git add -A include/rustd/journal.h libs/journal/journal.c libs/compat/systemd.c \
             scripts/check-compat-closure.py libs/tests/test_journal_filters.c \
             .github/workflows/land-journal-filter-abi.yml .github/journal-filter-trigger
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Implement journal match compatibility'
          git push origin HEAD:main
