name: Formal verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify RustD formal models
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"pending","context":"rustd/formal","description":"RustD formal verification is running","target_url":"%s"}' "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null

      - name: Check out source
        uses: actions/checkout@v6

      - name: Install formal toolchain dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends agda-bin chezscheme git libgmp-dev

      - name: Cache Idris 2
        id: idris-cache
        uses: actions/cache@v5
        with:
          path: ~/.idris2
          key: idris2-v0.8.0-${{ runner.os }}-${{ runner.arch }}

      - name: Bootstrap Idris 2
        if: ${{ steps.idris-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          rm -rf /tmp/Idris2
          git clone --depth 1 --branch v0.8.0 https://github.com/idris-lang/Idris2.git /tmp/Idris2
          make -C /tmp/Idris2 bootstrap SCHEME=chezscheme PREFIX="$HOME/.idris2"
          make -C /tmp/Idris2 install PREFIX="$HOME/.idris2"

      - name: Verify compiler versions
        run: |
          set -euo pipefail
          "$HOME/.idris2/bin/idris2" --version | grep '0.8.0'
          agda --version

      - name: Verify Idris and Agda models
        run: |
          set -euo pipefail
          export PATH="$HOME/.idris2/bin:$PATH"
          make check-formal IDRIS2="$HOME/.idris2/bin/idris2"

      - name: Publish final status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"%s","context":"rustd/formal","description":"RustD formal verification %s","target_url":"%s"}' "$STATE" "$STATE" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null
