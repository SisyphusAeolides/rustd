name: Formal verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify RustD formal models
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install formal toolchain dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends agda-bin chezscheme git libgmp-dev

      - name: Cache Idris 2
        id: idris-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.idris2
          key: idris2-v0.8.0-5aaefadb587224eb44d3be0fbb7e2835b48bd7a6-${{ runner.os }}-${{ runner.arch }}

      - name: Bootstrap Idris 2
        if: ${{ steps.idris-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          idris_work=$(mktemp -d "$RUNNER_TEMP/idris2.XXXXXX")
          trap 'find "$idris_work" -depth -delete' EXIT
          git clone --filter=blob:none https://github.com/idris-lang/Idris2.git "$idris_work/src"
          git -C "$idris_work/src" checkout --detach 5aaefadb587224eb44d3be0fbb7e2835b48bd7a6
          make -C "$idris_work/src" bootstrap SCHEME=chezscheme PREFIX="$HOME/.idris2"
          make -C "$idris_work/src" install PREFIX="$HOME/.idris2"

      - name: Verify compiler versions
        run: |
          set -euo pipefail
          "$HOME/.idris2/bin/idris2" --version | grep '0.8.0'
          agda --version

      - name: Verify Idris and Agda models
        run: |
          set -euo pipefail
          export PATH="$HOME/.idris2/bin:$PATH"
          make check-formal IDRIS2="$HOME/.idris2/bin/idris2"
