name: Formal verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify RustD formal models
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install formal toolchain dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends agda-bin chezscheme git libgmp-dev

      - name: Cache Idris 2
        id: idris-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.idris2
          key: idris2-v0.8.0-${{ runner.os }}-${{ runner.arch }}

      - name: Bootstrap Idris 2
        if: ${{ steps.idris-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          rm -rf /tmp/Idris2
          git clone --depth 1 --branch v0.8.0 https://github.com/idris-lang/Idris2.git /tmp/Idris2
          make -C /tmp/Idris2 bootstrap SCHEME=chezscheme PREFIX="$HOME/.idris2"
          make -C /tmp/Idris2 install PREFIX="$HOME/.idris2"

      - name: Verify compiler versions
        run: |
          set -euo pipefail
          "$HOME/.idris2/bin/idris2" --version | grep '0.8.0'
          agda --version

      - name: Verify Idris and Agda models
        run: |
          set -euo pipefail
          export PATH="$HOME/.idris2/bin:$PATH"
          make check-formal IDRIS2="$HOME/.idris2/bin/idris2"
