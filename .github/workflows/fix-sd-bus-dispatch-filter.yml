name: Fix staged sd-bus dispatch filter bridge
# trigger-v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-sd-bus-dispatch-filter.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Patch and certify dispatch bridge
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libdbus-1-dev dbus
          python3 - <<'PY'
          from pathlib import Path
          p=Path('libs/compat/sd_bus_impl.c')
          s=p.read_text()
          anchor='''static sd_bus_message *rustd_message_wrap(sd_bus *bus, DBusMessage *message, bool take_ref) {'''
          declaration='''static int rustd_dispatch_message(sd_bus *bus, sd_bus_message *m);\n\n'''
          if declaration not in s:
              if anchor not in s: raise SystemExit('message wrap anchor missing')
              s=s.replace(anchor,declaration+anchor,1)
          anchor='''static int rustd_bus_open_kind(sd_bus **ret, DBusBusType type) {'''
          filter_code='''static DBusHandlerResult rustd_dbus_filter(DBusConnection *connection, DBusMessage *raw, void *userdata) {\n    sd_bus *bus = userdata;\n    sd_bus_message *message;\n    int r;\n    (void)connection;\n    if (!bus || !raw)\n        return DBUS_HANDLER_RESULT_NOT_YET_HANDLED;\n    message = rustd_message_wrap(bus, raw, true);\n    if (!message)\n        return DBUS_HANDLER_RESULT_NEED_MEMORY;\n    r = rustd_dispatch_message(bus, message);\n    sd_bus_message_unref(message);\n    if (r < 0)\n        return r == -ENOMEM ? DBUS_HANDLER_RESULT_NEED_MEMORY : DBUS_HANDLER_RESULT_HANDLED;\n    return r > 0 ? DBUS_HANDLER_RESULT_HANDLED : DBUS_HANDLER_RESULT_NOT_YET_HANDLED;\n}\n\n'''
          if filter_code not in s:
              if anchor not in s: raise SystemExit('bus open anchor missing')
              s=s.replace(anchor,filter_code+anchor,1)
          old2='''    bus->connection = connection;\n    bus->started = true;\n    *ret = bus;\n    return 0;'''
          new2='''    bus->connection = connection;\n    if (!dbus_connection_add_filter(connection, rustd_dbus_filter, bus, NULL)) {\n        sd_bus_unref(bus);\n        return -ENOMEM;\n    }\n    bus->started = true;\n    *ret = bus;\n    return 0;'''
          if new2 not in s:
              if old2 not in s: raise SystemExit('connection assignment preimage missing')
              s=s.replace(old2,new2,1)
          start=s.index('int sd_bus_process(sd_bus *bus, sd_bus_message **ret) {')
          end=s.index('\nint sd_bus_add_filter(',start)
          replacement='''int sd_bus_process(sd_bus *bus, sd_bus_message **ret) {\n    DBusDispatchStatus before;\n    DBusDispatchStatus after;\n    if (ret)\n        *ret = NULL;\n    if (!bus)\n        return -EINVAL;\n    if (!bus->connection)\n        return bus->input_fd >= 0 ? 0 : -ENOTCONN;\n    before = dbus_connection_get_dispatch_status(bus->connection);\n    if (before == DBUS_DISPATCH_NEED_MEMORY)\n        return -ENOMEM;\n    if (!dbus_connection_read_write_dispatch(bus->connection, 0))\n        return -ECONNRESET;\n    after = dbus_connection_get_dispatch_status(bus->connection);\n    if (after == DBUS_DISPATCH_NEED_MEMORY)\n        return -ENOMEM;\n    return (before == DBUS_DISPATCH_DATA_REMAINS || after == DBUS_DISPATCH_DATA_REMAINS) ? 1 : 0;\n}\n'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)
          PY
          git diff --check
          cc -std=c17 -Wall -Wextra -Werror -fPIC -Ilibs/compat -Iinclude $(pkg-config --cflags dbus-1) -c libs/compat/sd_bus_impl.c -o /tmp/sd_bus_impl.o
          cc -std=c17 -Wall -Wextra -Werror -Ilibs/compat -Iinclude $(pkg-config --cflags dbus-1) libs/tests/test_sd_bus_impl.c libs/compat/sd_bus_impl.c $(pkg-config --libs dbus-1) -o /tmp/test-sd-bus-impl
          dbus-run-session -- /tmp/test-sd-bus-impl
          rm -f certification/sd-bus-header-independence-diagnostic.txt certification/sd-bus-bridge-diagnostic.txt
          git add libs/compat/sd_bus_impl.c
          git add -A certification
          git diff --cached --check
          git config user.name 'Kenny Glauner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Fix sd-bus async dispatch bridge'
          git push origin HEAD:main
