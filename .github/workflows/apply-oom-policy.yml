name: Apply OOM policy implementation

on:
  push:
    branches:
      - main
    paths:
      - scripts/oom-policy.patch.gz
      - .github/workflows/apply-oom-policy.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.head_commit.message == 'Retry OOM policy implementation'
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out exact staging commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify immutable patch inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/manager.rs)" = 483f4e1dd7352c362c39becbeea9b17525c0095a
          test "$(git hash-object src/lib.rs)" = f435702e5ee9c789914dcd5c8c1d88736bfded4b
          printf '%s  %s\n' \
            547be27041622ef1773af4030ae92ba1e4dda273a7dfaec8c7a983de94032049 \
            "$RUNNER_TEMP/oom-policy.patch" > "$RUNNER_TEMP/oom-policy.patch.sha256"
          gzip -dc scripts/oom-policy.patch.gz > "$RUNNER_TEMP/oom-policy.patch"
          sha256sum --check "$RUNNER_TEMP/oom-policy.patch.sha256"
          git apply --check "$RUNNER_TEMP/oom-policy.patch"
          git apply "$RUNNER_TEMP/oom-policy.patch"
          test "$(git hash-object src/manager.rs)" = 01cac46bc41f2c9d9e025ace5dab1281d6b1954d
          test "$(git hash-object src/lib.rs)" = 13f01448678d4a1ef2f3ffb2b59603683b3b2a94
          test "$(git hash-object src/oom.rs)" = e1de3dd89058bb7755ddefa5163d1aefe4410e69

      - name: Install native toolchain
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          timeout 8m sudo apt-get -o Acquire::Retries=3 update
          timeout 8m sudo apt-get -o Acquire::Retries=3 install --yes --no-install-recommends gfortran

      - name: Install formatting toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt

      - name: Install Rust 1.75.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.75.0
          components: clippy

      - name: Format and run native release gates
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable fmt --all
          git diff --check
          make check-native
          cargo clippy --all-targets --all-features --locked -- \
            -D warnings \
            -A unknown-lints \
            -A renamed-and-removed-lints \
            -A clippy::doc_markdown \
            -A clippy::default_trait_access \
            -A clippy::borrow_as_ptr \
            -A clippy::needless_borrows_for_generic_args \
            -A clippy::map_unwrap_or \
            -A clippy::bool_to_int_with_if
          cargo test --all-targets --all-features --locked -- --test-threads=1
          cargo build --release --all-features --locked
          make check-packaging

      - name: Commit validated OOM implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-oom-policy.yml scripts/oom-policy.patch.gz
          git add -A
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/apply-oom-policy.yml',
              'scripts/oom-policy.patch.gz',
              'src/lib.rs',
              'src/manager.rs',
              'src/oom.rs',
          }
          paths = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines())
          if paths != allowed:
              raise SystemExit(f'unexpected validated OOM commit paths: {sorted(paths)}')
          PY
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Implement OOM policy handling'
          git push origin HEAD:main
