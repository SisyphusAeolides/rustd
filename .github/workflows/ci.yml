name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate RustD native gates
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mark commit pending
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          url = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/statuses/{os.environ['REVISION']}"
          payload = {
              "state": "pending",
              "context": "rustd/ci",
              "description": "RustD native validation is running",
              "target_url": os.environ["RUN_URL"],
          }
          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              response.read()
          PY

      - name: Install native toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gfortran

      - name: Install formatting toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt

      - name: Install Rust 1.75.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.75.0
          components: clippy

      - name: Check lockfile reproducibility
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.repository"
          cargo generate-lockfile 2>&1 | tee lockfile.log
          if ! cmp -s Cargo.lock "$RUNNER_TEMP/Cargo.lock.repository"; then
            diff -u "$RUNNER_TEMP/Cargo.lock.repository" Cargo.lock || true
            echo "Cargo.lock changed during regeneration" >&2
            exit 1
          fi

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable fmt --all -- --check 2>&1 | tee rustfmt.log

      - name: Run native validation gates
        shell: bash
        run: |
          set -euo pipefail
          bash -o pipefail -c '
            set -eux
            make check-native
            cargo clippy --all-targets --all-features --locked -- -D warnings -A clippy::doc_markdown -A clippy::default_trait_access -A clippy::borrow_as_ptr -A clippy::needless_borrows_for_generic_args -A clippy::map_unwrap_or -A clippy::bool_to_int_with_if
            cargo test --all-targets --all-features --locked -- --test-threads=1
            cargo build --release --all-features --locked
            make check-packaging
          ' 2>&1 | tee ci.log

      - name: Package source snapshot
        if: always()
        run: |
          tar \
            --exclude=.git \
            --exclude=build \
            --exclude=target \
            -C "$GITHUB_WORKSPACE" \
            -czf "$RUNNER_TEMP/rustd-source.tar.gz" .

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustd-ci-${{ github.sha }}
          path: |
            ci.log
            rustfmt.log
            lockfile.log
            ${{ runner.temp }}/Cargo.lock.repository
            ${{ runner.temp }}/rustd-source.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          STATUS_DESCRIPTION: ${{ job.status == 'success' && 'RustD native validation passed' || 'RustD native validation failed' }}
        run: |
          set -euo pipefail
          export STATUS_STATE STATUS_DESCRIPTION
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          url = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/statuses/{os.environ['REVISION']}"
          payload = {
              "state": os.environ["STATUS_STATE"],
              "context": "rustd/ci",
              "description": os.environ["STATUS_DESCRIPTION"],
              "target_url": os.environ["RUN_URL"],
          }
          data = json.dumps(payload).encode("utf-8")
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }
          retryable_http = {403, 429, 500, 502, 503, 504}
          last_error = None
          for attempt in range(5):
              request = urllib.request.Request(url, data=data, headers=headers, method="POST")
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      response.read()
                  break
              except urllib.error.HTTPError as error:
                  last_error = error
                  if error.code not in retryable_http or attempt == 4:
                      raise
                  retry_after = error.headers.get("Retry-After")
                  delay = int(retry_after) if retry_after and retry_after.isdigit() else 2**attempt
              except (urllib.error.URLError, TimeoutError) as error:
                  last_error = error
                  if attempt == 4:
                      raise
                  delay = 2**attempt
              time.sleep(min(delay, 30))
          else:
              raise RuntimeError(f"status publication failed: {last_error}")
          PY
