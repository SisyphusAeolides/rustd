name: RustD PID1 certification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustd-pid1-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pid1-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native and virtualization tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            busybox-static \
            cpio \
            gfortran \
            linux-image-generic \
            qemu-system-x86
          kernel="$(ls -1v /boot/vmlinuz-*-generic | tail -1)"
          sudo cp -L "$kernel" "$RUNNER_TEMP/rustd-ci-vmlinuz"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/rustd-ci-vmlinuz"
          chmod 0644 "$RUNNER_TEMP/rustd-ci-vmlinuz"
          echo "RUSTD_PID1_KERNEL=$RUNNER_TEMP/rustd-ci-vmlinuz" >> "$GITHUB_ENV"

      - name: Install Rust 1.75.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal
          rustc +1.75.0 --version --verbose
          cargo +1.75.0 --version --verbose

      - name: Build PID1 certificate payload
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.75.0 build --release --all-features --locked \
            --bin rustd \
            --bin rustctl \
            --bin rustd-journald

      - name: Cold boot RustD as PID1 three times
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "RustD PID1 cold-boot certification attempt ${attempt}/3"
            RUSTD_PID1_SERIAL_LOG="pid1-cold-serial-${attempt}.log" \
              bash scripts/ci-pid1-initramfs.sh
          done

      - name: Boot rescue target three times
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "RustD PID1 rescue certification attempt ${attempt}/3"
            RUSTD_PID1_SERIAL_LOG="pid1-rescue-serial-${attempt}.log" \
              bash scripts/ci-pid1-special-target.sh rescue
          done

      - name: Boot emergency target three times
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "RustD PID1 emergency certification attempt ${attempt}/3"
            RUSTD_PID1_SERIAL_LOG="pid1-emergency-serial-${attempt}.log" \
              bash scripts/ci-pid1-special-target.sh emergency
          done

      - name: Re-exec RustD as PID1 one hundred times
        shell: bash
        run: |
          set -euo pipefail
          RUSTD_PID1_REEXEC_CYCLES=100 \
          RUSTD_PID1_QEMU_TIMEOUT=180s \
          RUSTD_PID1_SERIAL_LOG=pid1-reexec-serial-1.log \
            bash scripts/ci-pid1-initramfs.sh

      - name: Reboot through RustD ten times
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            echo "RustD PID1 reboot certification attempt ${attempt}/10"
            RUSTD_PID1_TRANSITION=reboot \
            RUSTD_PID1_SERIAL_LOG="pid1-reboot-serial-${attempt}.log" \
              bash scripts/ci-pid1-machine-transition.sh
          done

      - name: Power off through RustD ten times
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            echo "RustD PID1 poweroff certification attempt ${attempt}/10"
            RUSTD_PID1_TRANSITION=poweroff \
            RUSTD_PID1_SERIAL_LOG="pid1-poweroff-serial-${attempt}.log" \
              bash scripts/ci-pid1-machine-transition.sh
          done

      - name: Record PID1 boot evidence
        shell: bash
        run: |
          set -euo pipefail
          resolved_sha="$(tr -d '[:space:]' < scripts/rustd-resolved-revision.txt)"
          python3 - "$GITHUB_SHA" "$resolved_sha" > pid1-certification-evidence.jsonl <<'PY'
          import json
          import os
          import sys
          import time

          rustd_sha, resolved_sha = sys.argv[1:]
          source = (
              f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )
          timestamp = int(time.time())
          records = (
              ("boot.cold", 3, "three independent QEMU initramfs cold boots passed with RustD as PID 1 and the normal unit graph healthy"),
              ("boot.reboot", 10, "ten independent QEMU boots issued rustctl reboot to RustD PID 1, observed the managed keeper ExecStop during the orderly shutdown transaction, and QEMU exited from the guest reboot with -no-reboot"),
              ("boot.poweroff", 10, "ten independent QEMU boots issued rustctl poweroff to RustD PID 1, observed the managed keeper ExecStop during the orderly shutdown transaction, and QEMU exited from the guest poweroff"),
              ("boot.rescue", 3, "three independent QEMU kernel boots entered rescue.target with RustD as PID 1 and a live rustctl control-plane probe"),
              ("boot.emergency", 3, "three independent QEMU kernel boots entered emergency.target with RustD as PID 1 and a live rustctl control-plane probe"),
              ("boot.reexec", 100, "one QEMU PID 1 campaign completed one hundred rustctl daemon-reexec transactions; the control socket rebound after every exec and a long-running service retained the same live MainPID throughout"),
          )
          for gate, iterations, detail in records:
              print(json.dumps({
                  "gate": gate,
                  "status": "pass",
                  "detail": detail,
                  "ts": timestamp,
                  "rustd_sha": rustd_sha,
                  "resolved_sha": resolved_sha,
                  "iterations": iterations,
                  "source": source,
              }, sort_keys=True, separators=(",", ":")))
          PY
          chmod 0600 pid1-certification-evidence.jsonl
          python3 - "$GITHUB_SHA" "$resolved_sha" <<'PY'
          import json
          import stat
          import sys
          from pathlib import Path

          rustd_sha, resolved_sha = sys.argv[1:]
          path = Path("pid1-certification-evidence.jsonl")
          if stat.S_IMODE(path.stat().st_mode) != 0o600:
              raise SystemExit("PID1 evidence mode must be 0600")
          records = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
          expected = {"boot.cold", "boot.reboot", "boot.poweroff", "boot.rescue", "boot.emergency", "boot.reexec"}
          if {record.get("gate") for record in records} != expected:
              raise SystemExit("PID1 evidence gate set is incomplete")
          minimums = {
              "boot.cold": 3,
              "boot.reboot": 10,
              "boot.poweroff": 10,
              "boot.rescue": 3,
              "boot.emergency": 3,
              "boot.reexec": 100,
          }
          for record in records:
              gate = record.get("gate")
              if record.get("status") != "pass":
                  raise SystemExit(f"{gate}: status is not pass")
              if record.get("rustd_sha") != rustd_sha or record.get("resolved_sha") != resolved_sha:
                  raise SystemExit(f"{gate}: stack SHA mismatch")
              if int(record.get("iterations", 0)) < minimums[gate]:
                  raise SystemExit(f"{gate}: insufficient iterations")
              if not str(record.get("detail", "")).strip():
                  raise SystemExit(f"{gate}: empty detail")
          print("certification evidence OK: boot.cold,boot.reboot,boot.poweroff,boot.rescue,boot.emergency,boot.reexec")
          PY

      - name: Upload serial certificate logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustd-pid1-serial-${{ github.sha }}
          path: |
            pid1-*-serial-*.log
            pid1-certification-evidence.jsonl
          if-no-files-found: error
          retention-days: 14
