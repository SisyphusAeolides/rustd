name: Diagnose Fedora Login1 session support
# raw step extraction preserves zero-indented embedded Rust; diagnostic v6

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-fedora-login-session.yml

permissions:
  contents: write

concurrency:
  group: diagnose-fedora-login1
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.75.0
          components: rustfmt,clippy
      - name: Install dependencies
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gfortran libdbus-1-dev libpam0g-dev pkg-config
      - name: Run canonical Login1 patch and capture result
        id: test
        continue-on-error: true
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          exec > >(tee /tmp/fedora-login1.log) 2>&1
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/land-fedora-login-session.yml').read_text()
          step = text.index('      - name: Add complete Login1 session registration path\n')
          marker = '        run: |\n'
          start = text.index(marker, step) + len(marker)
          raw = text[start:]
          lines = [line[10:] if line.startswith('          ') else line for line in raw.splitlines()]
          script = '\n'.join(lines) + '\n'
          cut = 'git fetch origin main'
          if cut in script:
              script = script[:script.index(cut)]
          required = (
              'from pathlib import Path',
              'pub fn prepare_user_runtime',
              'async fn create_session',
              'cargo check --locked --bin rustd-logind',
              'cargo clippy --locked --bin rustd-logind',
              'cargo test --locked --lib logind',
          )
          if not all(item in script for item in required):
              raise SystemExit('Login1 extraction is incomplete')
          Path('/tmp/login1-step.sh').write_text(script)
          PY
          bash -x /tmp/login1-step.sh
      - name: Publish diagnostic
        if: always()
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          outcome='${{ steps.test.outcome }}'
          git reset --hard HEAD
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p certification
          {
            printf 'schema=rustd-fedora-login1-diagnostic-v6\n'
            printf 'status=%s\n' "$outcome"
            printf 'tested_sha=%s\n' "$GITHUB_SHA"
            printf '%s\n' '--- tail ---'
            tail -n 700 /tmp/fedora-login1.log || true
          } > certification/fedora-login1-diagnostic.txt
          git add certification/fedora-login1-diagnostic.txt
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m "Record Fedora Login1 ${outcome}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
          [[ "$outcome" == success ]]
