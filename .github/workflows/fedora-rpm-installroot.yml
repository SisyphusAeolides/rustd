name: Fedora zero-systemd RPM solver

on:
  push:
    branches: [main]
    paths:
      - certification/final-abi-closure-latest.txt
      - scripts/rustd-resolved-revision.txt
      - scripts/build-fedora-rpms.sh
      - scripts/fedora-vm-guest-cutover.sh
      - dist/fedora/**
      - .github/workflows/fedora-rpm-installroot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fedora-rpm-installroot
  cancel-in-progress: true

jobs:
  solve:
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 60
    steps:
      - name: Install Fedora build and solver dependencies
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          dnf -y install \
            git-core findutils make rpm-build rpmdevtools createrepo_c dnf-plugins-core \
            selinux-policy selinux-policy-devel policycoreutils-devel bzip2 \
            gcc gcc-gfortran libasan libubsan python3 cargo rust rustfmt clippy pkgconf-pkg-config \
            dbus-devel dbus-daemon pam-devel json-c-devel openssl openssl-devel liburing-devel \
            tar gzip systemd systemd-libs systemd-udev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SisyphusAeolides/rustd-resolved
          path: rustd-resolved
          fetch-depth: 0
      - name: Bind resolver checkout to RustD pin
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/rustd-resolved"
          pinned="$(tr -d '[:space:]' < scripts/rustd-resolved-revision.txt)"
          [[ $pinned =~ ^[0-9a-f]{40}$ ]]
          git -C rustd-resolved fetch origin "$pinned"
          git -C rustd-resolved checkout --detach "$pinned"
          test "$(git -C rustd-resolved rev-parse HEAD)" = "$pinned"
          printf '/rustd-resolved/\n' >> .git/info/exclude
      - name: Require complete RustD ABI candidate
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          voucher=certification/final-abi-closure-latest.txt
          test -r "$voucher"
          scripts/check-voucher-source-equivalence.sh "$voucher" "$GITHUB_SHA"
          grep -Fxq 'status=pass' "$voucher"
          grep -Fxq 'required=335' "$voucher"
          grep -Fxq 'supported=335' "$voucher"
          grep -Fxq 'unsupported=0' "$voucher"
          grep -Fxq 'missing=0' "$voucher"
          grep -Fxq 'systemd_headers=none' "$voucher"
          grep -Fxq 'systemd_runtime_link=none' "$voucher"
      - name: Build exact Fedora RPM set
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          RUSTD_RESOLVED_SOURCE_ROOT="$GITHUB_WORKSPACE/rustd-resolved" \
            scripts/build-fedora-rpms.sh
          test -s target/fedora-rpms/manifest.txt
          grep -Fxq "rustd_sha=$(git rev-parse HEAD)" target/fedora-rpms/manifest.txt
          grep -Fxq "resolved_sha=$(cat scripts/rustd-resolved-revision.txt)" target/fedora-rpms/manifest.txt
          manager_evr="$(sed -n 's/^systemd_reference_evr=//p' target/fedora-rpms/manifest.txt)"
          libs_evr="$(sed -n 's/^systemd_libraries_reference_evr=//p' target/fedora-rpms/manifest.txt)"
          udev_evr="$(sed -n 's/^systemd_udev_reference_evr=//p' target/fedora-rpms/manifest.txt)"
          test -n "$manager_evr"
          test "$manager_evr" = "$libs_evr"
          test "$manager_evr" = "$udev_evr"
      - name: Solve staged and exclusive Fedora transactions
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          createrepo_c target/fedora-rpms
          root=/tmp/rustd-fedora-root
          rm -rf "$root"
          mkdir -p "$root"
          base_common=(
            --installroot="$root"
            --releasever=44
            --use-host-config
            --setopt=install_weak_deps=False
            --setopt=keepcache=False
            --setopt=tsflags=noscripts
          )
          common=(
            "${base_common[@]}"
            --repofrompath=rustd,"file://$GITHUB_WORKSPACE/target/fedora-rpms"
            --setopt=rustd.gpgcheck=0
          )

          # DNF5 may unpack libgcc before the filesystem package in a fresh
          # installroot, turning /lib64 into a directory before filesystem can
          # install the merged-/usr symlink. Bootstrap filesystem separately.
          dnf -y "${base_common[@]}" install filesystem

          # Establish an ordinary Fedora manager/PAM stack first.
          # The local replacement repository must not participate in this
          # baseline solve: its exact-EVR Provides intentionally outrank the
          # Fedora systemd packages during the later exclusive transaction.
          dnf -y "${base_common[@]}" install \
            systemd systemd-libs systemd-udev systemd-pam authselect dbus-daemon
          rpm --root "$root" -q systemd systemd-libs systemd-udev systemd-pam authselect
          test "$(rpm --root "$root" -qf --qf '%{NAME}\n' /usr/sbin/init)" = systemd
          rpm --root "$root" -qa --qf '%{NAME}-%{EVR}.%{ARCH}\n' \
            | sort > /tmp/installroot-before-stage.txt

          # The first phase must coexist with the complete Fedora stack.
          dnf -y "${common[@]}" install rustd-cutover-tools rustd-resolved-nss
          rpm --root "$root" -qa --qf '%{NAME}-%{EVR}.%{ARCH}\n' \
            | sort > /tmp/installroot-after-stage.txt
          comm -23 /tmp/installroot-before-stage.txt /tmp/installroot-after-stage.txt \
            > /tmp/installroot-stage-removed.txt
          test ! -s /tmp/installroot-stage-removed.txt
          rpm --root "$root" -q systemd systemd-libs systemd-udev systemd-pam
          rpm --root "$root" -q rustd-cutover-tools rustd-resolved-nss
          test "$(rpm --root "$root" -qf --qf '%{NAME}\n' /usr/sbin/init)" = systemd
          test "$(rpm --root "$root" -qf --qf '%{NAME}\n' /usr/sbin/rustd-fedora-cutover)" = rustd-cutover-tools
          test "$(rpm --root "$root" -qf --qf '%{NAME}\n' /usr/lib64/security/pam_rustd.so)" = rustd-cutover-tools
          test "$(rpm --root "$root" -qf --qf '%{NAME}\n' /usr/lib64/libnss_rustd_dns.so.2)" = rustd-resolved-nss
          for package in rustd rustd-resolved rustd-compat-libs rustd-fedora-compat rustd-selinux; do
            ! rpm --root "$root" -q "$package" >/dev/null 2>&1
          done

          # Scriptlets are disabled in this solver root; the real VM executes
          # the migration and exercises the compatibility RPM's pretrans guard.
          dnf -y "${common[@]}" install \
            rustd rustd-resolved rustd-compat-libs rustd-fedora-compat rustd-selinux \
            --setopt=protected_packages= \
            --allowerasing
          mapfile -t residual < <(
            rpm --root "$root" -qa --qf '%{NAME}\n' \
              | grep -E '^systemd($|-)' | sort -u || true
          )
          if ((${#residual[@]})); then
            dnf -y "${common[@]}" \
              --setopt=clean_requirements_on_remove=False remove "${residual[@]}"
          fi
          dnf -q "${common[@]}" check

          for package in rustd rustd-cutover-tools rustd-resolved rustd-resolved-nss \
                         rustd-compat-libs rustd-fedora-compat rustd-selinux; do
            rpm --root "$root" -q "$package"
          done
          if rpm --root "$root" -qa --qf '%{NAME}\n' | grep -Eq '^systemd($|-)'; then
            echo 'systemd RPM remains in solved Fedora cutover root' >&2
            rpm --root "$root" -qa --qf '%{NAME}-%{EVR}.%{ARCH}\n' \
              | grep '^systemd' >&2 || true
            exit 1
          fi
          test "$(rpm --root "$root" -qf --qf '%{NAME}\n' /usr/lib64/libsystemd.so.0)" = rustd-compat-libs
          test "$(rpm --root "$root" -qf --qf '%{NAME}\n' /usr/lib64/libudev.so.1)" = rustd-compat-libs
          test "$(rpm --root "$root" -qf --qf '%{NAME}\n' /usr/sbin/init)" = rustd-fedora-compat
          test "$(rpm --root "$root" -qf --qf '%{NAME}\n' /usr/sbin/rustd-fedora-cutover)" = rustd-cutover-tools
          test "$(rpm --root "$root" -qf --qf '%{NAME}\n' /usr/lib64/security/pam_rustd.so)" = rustd-cutover-tools
          test "$(rpm --root "$root" -qf --qf '%{NAME}\n' /usr/lib64/libnss_rustd_dns.so.2)" = rustd-resolved-nss
          test "$(rpm --root "$root" -qf --qf '%{NAME}\n' /usr/bin/systemctl)" = rustd-fedora-compat
          test "$(rpm --root "$root" -qf --qf '%{NAME}\n' /usr/lib/systemd/systemd-udevd)" = rustd-fedora-compat
          test "$(rpm --root "$root" -qf --qf '%{NAME}\n' /usr/lib/udev/rules.d/50-rustd-default.rules)" = rustd-fedora-compat
          test "$(readlink "$root/usr/sbin/init")" = ../lib/rustd/rustd
