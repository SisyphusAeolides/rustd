name: Land Fedora PAM session environment support

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/land-fedora-pam-session.yml
      - pam/pam_rustd.c
      - src/bin/rustd-logind.rs
      - src/logind/mod.rs

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Install PAM build dependencies
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential libdbus-1-dev libpam0g-dev pkg-config
      - name: Validate standard Login1 PAM registration
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          trap 'rm -f /tmp/pam_rustd.so' EXIT
          test -r pam/pam_rustd.c
          grep -Fq 'async fn create_session(' src/bin/rustd-logind.rs
          cc -O2 -g -std=c17 -Wall -Wextra -Werror -fPIC -shared pam/pam_rustd.c \
            -o /tmp/pam_rustd.so $(pkg-config --cflags --libs dbus-1) -lpam
          nm -D --defined-only /tmp/pam_rustd.so | grep -Fq 'pam_sm_open_session'
          nm -D --defined-only /tmp/pam_rustd.so | grep -Fq 'pam_sm_close_session'
          git diff --check
