name: Validate portable platform ABIs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-seccomp-portability.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install cross compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          rustup target add aarch64-unknown-linux-gnu

      - name: Scope platform ABIs to the target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("ffi/seccomp.c")
          source = path.read_text()
          start_marker = "static const syscall_entry syscall_table[] = {\n"
          end_marker = "    { NULL, 0 }\n};"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          body = source[start:end]

          lines = []
          for line in body.splitlines():
              stripped = line.strip()
              if stripped.startswith("#ifdef __NR_") or stripped == "#endif":
                  continue
              match = re.fullmatch(r'\s*\{\s*"[^"]+",\s*(__NR_[A-Za-z0-9_]+)\s*\},', line)
              if match:
                  macro = match.group(1)
                  lines.extend([f"#ifdef {macro}", line, "#endif"])
              else:
                  lines.append(line)

          rebuilt = "\n".join(lines).strip("\n") + "\n"
          source = source[:start] + rebuilt + source[end:]
          source = source.replace(
              "/* Table of the most common Linux x86-64 syscall names. */",
              "/* Common Linux syscall names, compiled only when present in the target ABI. */",
              1,
          )
          path.write_text(source)

          path = Path("src/bin/rustd-update-utmp.rs")
          source = path.read_text()
          old_layout = "const _: [(); 384] = [(); size_of::<libc::utmpx>()];"
          new_layout = (
              "#[cfg(target_arch = \"x86_64\")]\n"
              "const _: [(); 384] = [(); size_of::<libc::utmpx>()];\n"
              "#[cfg(target_arch = \"aarch64\")]\n"
              "const _: [(); 400] = [(); size_of::<libc::utmpx>()];"
          )
          if source.count(old_layout) != 1:
              raise SystemExit("utmpx layout assertion drifted")
          source = source.replace(old_layout, new_layout, 1)
          old_char = "c_char::try_from(source).unwrap_or(63_i8)"
          new_char = "c_char::try_from(source).unwrap_or(b'?' as c_char)"
          if source.count(old_char) != 1:
              raise SystemExit("utmp c_char conversion drifted")
          path.write_text(source.replace(old_char, new_char, 1))

          path = Path("src/bin/rusttimedatectl.rs")
          source = path.read_text()
          if source.count("[0i8; 100]") != 4:
              raise SystemExit("timedate C buffer layout drifted")
          source = source.replace("[0i8; 100]", "[0 as libc::c_char; 100]")
          if source.count(".cast::<i8>()") != 4:
              raise SystemExit("timedate C format pointer layout drifted")
          source = source.replace(".cast::<i8>()", ".cast::<libc::c_char>()")
          long_utc = 'b"%a %Y-%m-%d %H:%M:%S UTC\\0".as_ptr().cast::<libc::c_char>(),'
          formatted_utc = (
              'b"%a %Y-%m-%d %H:%M:%S UTC\\0"\n'
              '                .as_ptr()\n'
              '                .cast::<libc::c_char>(), '
          ).rstrip()
          if source.count(long_utc) != 1:
              raise SystemExit("timedate UTC format expression drifted")
          source = source.replace(long_utc, formatted_utc, 1)
          source = source.replace(
              "// In a real implementation this would talk to systemd-timedated over D-Bus\n        // or require root privileges to modify /etc/localtime directly.",
              "// RustD applies the timezone directly here when the caller has the required privileges.",
              1,
          )
          path.write_text(source)
          PY

          cargo fmt --all -- --check
          cc -c -std=c11 -O2 -fPIC -fstack-protector-strong \
            -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -Wall -Wextra -Werror \
            -iquote ffi ffi/seccomp.c -o /tmp/seccomp-native.o
          aarch64-linux-gnu-gcc -c -std=c11 -O2 -fPIC -fstack-protector-strong \
            -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -Wall -Wextra -Werror \
            -iquote ffi ffi/seccomp.c -o /tmp/seccomp-aarch64.o

          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          export AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar
          cargo build --release --locked --target aarch64-unknown-linux-gnu
          cargo test --locked --lib

          git rm -- .github/workflows/fix-seccomp-portability.yml
          expected=$'.github/workflows/fix-seccomp-portability.yml\nffi/seccomp.c\nsrc/bin/rustd-update-utmp.rs\nsrc/bin/rusttimedatectl.rs'
          changed="$(git diff HEAD --name-only | sort)"
          if [[ "$changed" != "$expected" ]]; then
            printf 'Unexpected source changes:\n%s\n' "$changed" >&2
            exit 1
          fi
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git add -- ffi/seccomp.c src/bin/rustd-update-utmp.rs src/bin/rusttimedatectl.rs
          git commit -m 'Make platform ABI checks target aware'
          git push origin HEAD:main
