name: RustD manager runtime closure

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/manager-runtime-closure.yml
      - src/logind/**
      - src/bin/rustd-logind.rs
      - scripts/rustd-resolved-revision.txt
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - ffi/**
      - packaging/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustd-manager-runtime-closure
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: 'bash --noprofile --norc -euo pipefail {0}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.75.0
          components: rustfmt,clippy

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential gfortran libdbus-1-dev libpam0g-dev pkg-config

      - name: Verify paired resolver revision
        run: |
          revision="$(tr -d '\n' < scripts/rustd-resolved-revision.txt)"
          [[ $revision =~ ^[0-9a-f]{40}$ ]]
          git init --bare /tmp/rustd-resolved.git
          git -C /tmp/rustd-resolved.git fetch --depth=1 \
            https://github.com/SisyphusAeolides/rustd-resolved.git "$revision"
          test "$(git -C /tmp/rustd-resolved.git rev-parse FETCH_HEAD)" = "$revision"

      - name: Verify Login1 runtime lifecycle
        run: |
          cargo +1.75.0 fmt --all -- --check
          cargo +1.75.0 check --locked --bin rustd-logind
          cargo +1.75.0 clippy --locked --bin rustd-logind --tests -- \
            -D warnings \
            -A unknown-lints \
            -A renamed-and-removed-lints
          cargo +1.75.0 test --locked --lib logind -- --test-threads=1
          make check-native

      - name: Verify lifecycle source contract
        run: |
          grep -Fq 'async fn create_session(' src/bin/rustd-logind.rs
          grep -Fq 'fn release_session(' src/bin/rustd-logind.rs
          grep -Fq 'logind::save(&session).map_err(dbus_error)' src/bin/rustd-logind.rs
          grep -Fq 'pub fn prepare_user_runtime' src/logind/mod.rs
          grep -Fq 'user_runtime_and_session_metadata_round_trip' src/logind/mod.rs

      - name: Record runtime summary
        run: |
          {
            printf '### RustD manager runtime closure\n\n'
            printf -- '- Login1 lifecycle, secure runtime ownership, native checks, and resolver pairing passed.\n'
            printf -- '- Source commit: `%s`\n' "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
