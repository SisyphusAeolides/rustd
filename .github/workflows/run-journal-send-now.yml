name: Run journal send certification now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-journal-send-now.yml

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Compile and exercise journal send contract
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c17 -Wall -Wextra -Werror -Iinclude libs/tests/test_journal_send_impl.c libs/compat/journal_send_impl.c -o /tmp/test-journal-send
          /tmp/test-journal-send
          mkdir -p certification
          printf 'schema=rustd-journal-send-compat-v1\nstatus=pass\ntested_sha=%s\nbehavior_outcome=success\nvarargs=null-terminated-fields\nlocation=code-file-line-func\n' "$GITHUB_SHA" > certification/journal-send-compat-latest.txt
          rm -f certification/journal-send-compat-diagnostic.txt .github/workflows/run-journal-send-now.yml
          git add -A certification .github/workflows/run-journal-send-now.yml
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Certify journal send compatibility engine'
          git push origin HEAD:main
