name: Harden final ABI landing rebase
# trigger with self-autostash

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/harden-final-abi-rebase.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Preserve ABI changes across concurrent main updates
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/run-final-abi-closure.yml')
          s=p.read_text()
          needle="          Path('/tmp/final-abi-closure.sh').write_text(run)\n"
          replacement="          run = run.replace('git rebase origin/main', 'git rebase --autostash origin/main')\n" + needle
          if "run.replace('git rebase origin/main', 'git rebase --autostash origin/main')" not in s:
              if needle not in s:
                  raise SystemExit('ABI script write preimage missing')
              s=s.replace(needle,replacement,1)
          p.write_text(s)
          PY
          git diff --check
          git fetch origin main
          git rebase --autostash origin/main
          rm -f .github/workflows/harden-final-abi-rebase.yml
          git add -A .github/workflows/run-final-abi-closure.yml .github/workflows/harden-final-abi-rebase.yml
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Preserve final ABI changes across rebase'
          git push origin HEAD:main
