name: Land Rust 1.75 clippy cleanup
# self-reporting trigger

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/land-rust175-clippy-cleanup.yml

permissions:
  contents: write

concurrency:
  group: rust175-clippy-cleanup
  cancel-in-progress: true

jobs:
  land:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.75.0
          components: rustfmt,clippy
      - name: Install native dependencies
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gfortran libdbus-1-dev libpam0g-dev pkg-config
      - name: Apply source cleanup and certify
        id: cleanup
        continue-on-error: true
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          exec > >(tee /tmp/rust175-clippy.log) 2>&1
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'src/cgroup.rs': [('fs::read_to_string(&controllers_path)', 'fs::read_to_string(controllers_path)')],
              'src/reexec_state.rs': [("""std::env::var_os("XDG_RUNTIME_DIR")
                .map(PathBuf::from)
                .unwrap_or_else(|| {
                    PathBuf::from(format!("/run/user/{}", unsafe { libc::getuid() }))
                })""", """std::env::var_os("XDG_RUNTIME_DIR").map_or_else(
                || PathBuf::from(format!("/run/user/{}", unsafe { libc::getuid() })),
                PathBuf::from,
            )""")],
              'src/unit/loader.rs': [('std::fs::read_dir(&wants_dir)', 'std::fs::read_dir(wants_dir)')],
              'src/ffi/spawn.rs': [('pub unsafe fn rustd_spawn(p: *const SdSpawnParams) -> pid_t {', '#[must_use]\npub unsafe fn rustd_spawn(p: *const SdSpawnParams) -> pid_t {')],
          }
          for name, edits in replacements.items():
              p=Path(name); s=p.read_text()
              for old,new in edits:
                  if new in s: continue
                  if old not in s: raise SystemExit(f'preimage missing in {name}: {old[:80]!r}')
                  s=s.replace(old,new,1)
              p.write_text(s)
          p=Path('src/sandbox.rs'); s=p.read_text()
          if '/// Resolve a user name or numeric uid.' not in s:
              s=s.replace('pub fn resolve_user(user: &str) -> anyhow::Result<libc::uid_t> {','''/// Resolve a user name or numeric uid.
///
/// # Errors
/// Returns an error when the name contains NUL or no matching account exists.
pub fn resolve_user(user: &str) -> anyhow::Result<libc::uid_t> {''',1)
          if '/// Resolve a group name or numeric gid.' not in s:
              s=s.replace('pub fn resolve_group(group: &str) -> anyhow::Result<libc::gid_t> {','''/// Resolve a group name or numeric gid.
///
/// # Errors
/// Returns an error when the name contains NUL or no matching group exists.
pub fn resolve_group(group: &str) -> anyhow::Result<libc::gid_t> {''',1)
          p.write_text(s)
          p=Path('Cargo.toml'); s=p.read_text()
          for lint in ('assert_is_empty','assigning_clones','unnecessary_debug_formatting'):
              s=s.replace(f'{lint} = "allow"\n','')
          p.write_text(s)
          PY
          cargo fmt --all
          cargo check --locked --bin rustd-logind
          cargo clippy --locked --bin rustd-logind -- -D warnings -A unknown-lints -A renamed-and-removed-lints
          cargo test --locked --lib logind
          git diff --check
          git add src/cgroup.rs src/reexec_state.rs src/unit/loader.rs src/ffi/spawn.rs src/sandbox.rs Cargo.toml
          git fetch origin main
          git rebase --autostash origin/main
          cargo fmt --all
          cargo clippy --locked --bin rustd-logind -- -D warnings -A unknown-lints -A renamed-and-removed-lints
          git add src/cgroup.rs src/reexec_state.rs src/unit/loader.rs src/ffi/spawn.rs src/sandbox.rs Cargo.toml
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Clean Rust 1.75 clippy gate'
          git push origin HEAD:main
      - name: Publish cleanup failure
        if: steps.cleanup.outcome != 'success'
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          git reset --hard HEAD
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p certification
          {
            printf 'schema=rustd-rust175-clippy-diagnostic-v1\nstatus=failure\ntested_sha=%s\n' "$GITHUB_SHA"
            printf '%s\n' '--- tail ---'
            tail -n 360 /tmp/rust175-clippy.log || true
          } > certification/rust175-clippy-diagnostic.txt
          git add certification/rust175-clippy-diagnostic.txt
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Record Rust 1.75 clippy diagnostic' || exit 0
          git push origin HEAD:main
          exit 1
