name: Run Varlink IDL certification now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-varlink-idl-now.yml

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Compile and exercise IDL parser
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          h=Path('libs/compat/sd_json_varlink_abi.h')
          s=h.read_text()
          anchor='''int sd_varlink_collect(sd_varlink *v, const char *method, sd_json_variant *parameters,\n                       sd_json_variant **ret_parameters, const char **ret_error_id);\n'''
          addition=anchor+'''int sd_varlink_idl_parse(const char *text, unsigned *reterr_line,\n                         unsigned *reterr_column, sd_varlink_interface **ret);\nsd_varlink_interface *sd_varlink_interface_free(sd_varlink_interface *interface);\n'''
          if 'int sd_varlink_idl_parse(' not in s:
              if anchor not in s: raise SystemExit('ABI insertion anchor missing')
              h.write_text(s.replace(anchor,addition,1))
          p=Path('libs/compat/sd_varlink_idl_impl.c')
          s=p.read_text()
          old='''    while (isalnum((unsigned char)parser_peek(p)) || parser_peek(p) == '_')\n        parser_take(p);\n    length = p->pos - start;'''
          new='''    while (isalnum((unsigned char)parser_peek(p)) || parser_peek(p) == '_')\n        parser_take(p);\n    if (upper) {\n        for (size_t i = start; i < p->pos; ++i)\n            if (p->text[i] == '_')\n                return parser_fail(p);\n    }\n    length = p->pos - start;'''
          if old in s:
              p.write_text(s.replace(old,new,1))
          PY
          cc -std=c17 -Wall -Wextra -Werror -Ilibs/compat libs/tests/test_sd_varlink_idl_impl.c libs/compat/sd_varlink_idl_impl.c -o /tmp/test-varlink-idl
          /tmp/test-varlink-idl
          mkdir -p certification
          printf 'schema=rustd-varlink-idl-v1\nstatus=pass\ntested_sha=%s\nbehavior_outcome=success\ngrammar=varlink-official\n' "$GITHUB_SHA" > certification/varlink-idl-latest.txt
          rm -f certification/varlink-idl-diagnostic.txt .github/workflows/run-varlink-idl-now.yml
          git add -A libs/compat/sd_json_varlink_abi.h libs/compat/sd_varlink_idl_impl.c certification .github/workflows/run-varlink-idl-now.yml
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Certify Varlink IDL compatibility parser'
          git push origin HEAD:main
