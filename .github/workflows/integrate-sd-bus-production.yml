name: Integrate certified sd-bus production engine

on:
  push:
    branches: [main]
    paths:
      - libs/compat/sd_bus_impl.c
      - .github/workflows/integrate-sd-bus-production.yml

permissions:
  contents: write

concurrency:
  group: integrate-sd-bus-production
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gfortran pkg-config libdbus-1-dev libudev-dev dbus
      - name: Verify bus behavior and switch production ABI
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'dbus_connection_read_write_dispatch' libs/compat/sd_bus_impl.c
          cc -std=c17 -Wall -Wextra -Werror -Ilibs/compat -Iinclude $(pkg-config --cflags dbus-1) \
            libs/tests/test_sd_bus_impl.c libs/compat/sd_bus_impl.c $(pkg-config --libs dbus-1) -o /tmp/test-sd-bus
          dbus-run-session -- /tmp/test-sd-bus
          python3 - <<'PY'
          from pathlib import Path
          m=Path('Makefile')
          s=m.read_text()
          s=s.replace('libs/compat/systemd.c libs/compat/sd_bus_stubs.c libs/compat/journal_send_impl.c',
                      'libs/compat/systemd.c libs/compat/sd_bus_impl.c libs/compat/journal_send_impl.c')
          s=s.replace('libs/compat/systemd.c libs/compat/sd_bus_stubs.c libs/maps/libsystemd.map',
                      'libs/compat/systemd.c libs/compat/sd_bus_impl.c libs/maps/libsystemd.map')
          s=s.replace('libs/compat/systemd.c libs/compat/sd_bus_stubs.c \\\n',
                      'libs/compat/systemd.c libs/compat/sd_bus_impl.c \\\n')
          marker='''\t\t-Wl,--version-script=libs/maps/libsystemd.map \\\n'''
          if '$(shell pkg-config --cflags dbus-1)' not in s:
              s=s.replace('\t$(CC) $(CFLAGS) $(CPPFLAGS) -shared \\\n',
                          '\t$(CC) $(CFLAGS) $(CPPFLAGS) $(shell pkg-config --cflags dbus-1) -shared \\\n', 1)
          libline='''\t\t-l:librustd_service.so.1 -l:librustd_journal.so.1 -l:librustd_login.so.1 -l:librustd_device.so.1 \\\n'''
          if '$(shell pkg-config --libs dbus-1)' not in s:
              if libline not in s: raise SystemExit('libsystemd link line missing')
              s=s.replace(libline, libline.rstrip('\\\n')+' $(shell pkg-config --libs dbus-1) \\\n',1)
          m.write_text(s)

          c=Path('scripts/check-compat-closure.py')
          cs=c.read_text()
          cs=cs.replace('STUB_DATA_SYMBOLS = {"sd_bus_object_vtable_format"}', 'STUB_DATA_SYMBOLS = set()')
          cs=cs.replace('        STUB_SOURCE,\n', '        Path("libs/compat/sd_bus_impl.c"),\n')
          cs=cs.replace('            if relative == STUB_SOURCE and name not in SUPPORTED_STUB_FUNCTIONS:\n                unsupported.add(name)\n                continue\n', '')
          c.write_text(cs)

          r=Path('scripts/check-compat-source-readiness.py')
          rs=r.read_text()
          rs=rs.replace('        Path("libs/compat/sd_bus_stubs.c"),\n', '        Path("libs/compat/sd_bus_impl.c"),\n')
          r.write_text(rs)
          PY
          git diff --check
          make clean
          make check-compat
          python3 scripts/check-compat-source-readiness.py --report target/compat-readiness.json
          python3 - <<'PY'
          import json
          r=json.load(open('target/compat-readiness.json'))
          bus=[s for s in r['unsupported_symbols'] if s.startswith('sd_bus_')]
          missing=[s for s in r['missing_symbols'] if s.startswith('sd_bus_')]
          if bus or missing:
              raise SystemExit({'unsupported_bus':bus,'missing_bus':missing})
          if r['supported'] < 168 or r['missing_source_definition'] != 0:
              raise SystemExit(r)
          PY
          git fetch origin main
          git rebase origin/main
          rm -f .github/workflows/integrate-sd-bus-production.yml
          git add -A Makefile scripts/check-compat-closure.py scripts/check-compat-source-readiness.py .github/workflows/integrate-sd-bus-production.yml
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Switch libsystemd ABI to RustD sd-bus engine'
          git push origin HEAD:main
