name: Apply udev sysattr setter

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-udev-setter.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install ABI development headers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential gfortran libudev-dev libsystemd-dev

      - name: Apply and validate source
        shell: bash
        run: |
          set -euo pipefail
          payload=''
          printf '%s' "$payload" | base64 --decode | tar --extract --gzip
          git rm -- .github/workflows/apply-udev-setter.yml
          expected=$'.github/workflows/apply-udev-setter.yml\ninclude/rustd/device.h\nlibs/compat/udev.c\nlibs/device/device.c\nlibs/tests/test_compat_abi.c\nlibs/tests/test_libs_smoke.c'
          changed="$(git diff HEAD --name-only | sort)"
          if [[ "$changed" != "$expected" ]]; then
            printf 'Unexpected source changes:\n%s\n' "$changed" >&2
            exit 1
          fi
          make check-libs -j2
          make check-compat -j2
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git add -- include/rustd/device.h libs/device/device.c libs/compat/udev.c libs/tests/test_libs_smoke.c libs/tests/test_compat_abi.c
          git commit -m 'Implement udev sysattr writes'
          git push origin HEAD:main
