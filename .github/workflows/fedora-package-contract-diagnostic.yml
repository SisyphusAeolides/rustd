name: Fedora package contract diagnostic
# Manually rerun the Fedora package contract without mutating the repository.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Run Fedora Rawhide package contract
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/source:ro" \
            fedora:rawhide bash -lc '
              set -euo pipefail
              dnf -y install git-core findutils make rpm-build rpmdevtools \
                selinux-policy selinux-policy-devel policycoreutils-devel bzip2 \
            gcc gcc-gfortran libasan libubsan python3 cargo rust rustfmt clippy pkgconf-pkg-config \
                dbus-devel dbus-daemon pam-devel json-c-devel
              cp -a /source /tmp/rustd
              cd /tmp/rustd
              scripts/check-fedora-package-contract.sh 1:999-1
            '
