name: Validate XDG autostart generator v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/execute-xdg-autostart-generator.yml

permissions:
  contents: write
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Publish validation status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"pending","context":"rustd/xdg-autostart-generator","description":"XDG autostart generator validation in progress","target_url":"%s"}' "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Install validation toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gfortran
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt,clippy
          rustup default 1.75.0
      - name: Apply generator implementation
        run: |
          set -euo pipefail
          python3 .github/apply-xdg-autostart-generator.py
          python3 .github/fix-xdg-validation-clippy.py
          rm -f \
            .github/apply-xdg-autostart-generator.py \
            .github/fix-xdg-validation-clippy.py \
            .github/workflows/execute-xdg-autostart-generator.yml
      - name: Validate source and behavior
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          make check-native
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --all-features --locked -- --test-threads=1
          cargo build --release --all-features --locked
          make check-packaging
          timeout 120s make check-live
      - name: Verify v261 surface closure
        run: |
          set -euo pipefail
          python3 scripts/audit-upstream-v261-executables.py --json > /tmp/rustd-v261.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/rustd-v261.json').read_text())
          missing = {item['name'] for item in report['missing']}
          assert 'systemd-xdg-autostart-generator' not in missing
          assert report['missing_upstream_executables'] < 70
          assert set(report['companion_covered_executables']) == {'resolvectl', 'systemd-resolved'}
          PY
      - name: Commit directly to main
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git add -A
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'generator: add XDG autostart units'
          git push origin HEAD:main
      - name: Publish final validation status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"%s","context":"rustd/xdg-autostart-generator","description":"XDG autostart generator validation %s","target_url":"%s"}' "$STATE" "$STATE" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null
