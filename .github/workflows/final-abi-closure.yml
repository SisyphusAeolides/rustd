name: Final RustD compatibility ABI closure

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-abi-closure.yml

permissions:
  contents: write

concurrency:
  group: final-rustd-abi-closure
  cancel-in-progress: true

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gfortran pkg-config libdbus-1-dev libudev-dev \
            libjson-c-dev dbus python3-yaml
      - name: Apply certified compatibility engines
        shell: bash
        run: |
          set -euo pipefail

          # Apply the already-developed journal-filter transaction, but stop
          # before its own commit/push tail so this job remains atomic.
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          wf = yaml.safe_load(Path('.github/workflows/land-journal-filter-abi.yml').read_text())
          step = next(x for x in wf['jobs']['land']['steps'] if x.get('name') == 'Apply native journal filtering and verify')
          run = step['run']
          cut_points = [p for p in ('git fetch origin main', 'git config user.name', 'git add -A') if p in run]
          if cut_points:
              positions = [run.index(p) for p in cut_points]
              run = run[:min(positions)]
          Path('/tmp/apply-journal-filter.sh').write_text(run)
          PY
          bash /tmp/apply-journal-filter.sh

          python3 - <<'PY'
          from pathlib import Path

          # JSON/Varlink has a tested private ABI header; remove the remaining
          # development-header dependency.
          p = Path('libs/compat/sd_json_varlink_impl.c')
          s = p.read_text()
          s = s.replace('#include <systemd/sd-json.h>\n#include <systemd/sd-varlink.h>\n', '#include "sd_json_varlink_abi.h"\n')
          p.write_text(s)

          # Remove compatibility functions now supplied by the certified
          # journal-send implementation to avoid duplicate definitions.
          p = Path('libs/compat/systemd.c')
          s = p.read_text()
          def remove_function(text, name):
              needle = name + '('
              pos = text.find(needle)
              if pos < 0:
                  return text
              start = text.rfind('\n', 0, pos) + 1
              brace = text.find('{', pos)
              if brace < 0:
                  raise SystemExit(f'no body for {name}')
              depth = 1
              i = brace + 1
              while i < len(text) and depth:
                  if text[i] == '{': depth += 1
                  elif text[i] == '}': depth -= 1
                  i += 1
              if depth:
                  raise SystemExit(f'unbalanced body for {name}')
              while i < len(text) and text[i] in ' \t\r\n':
                  i += 1
              return text[:start] + text[i:]
          for name in ('int sd_journal_send', 'int sd_journal_send_with_location', 'int sd_journal_print_with_location'):
              s = remove_function(s, name)
          p.write_text(s)

          # Switch the production libsystemd compatibility target from stubs
          # to the certified engines and link only their real backends.
          m = Path('Makefile')
          s = m.read_text()
          start = s.index('$(LIBS_DIR)/libsystemd.so.0:')
          end = s.index('\n$(LIBS_DIR)/librustd_service.so.1:', start)
          old = s[start:end]
          new = '''$(LIBS_DIR)/libsystemd.so.0: libs/compat/systemd.c libs/compat/sd_bus_impl.c \\
\t\tlibs/compat/journal_send_impl.c libs/compat/sd_json_varlink_impl.c libs/compat/sd_varlink_idl_impl.c \\
\t\tlibs/maps/libsystemd.map include/rustd/service.h include/rustd/journal.h include/rustd/login.h include/rustd/device.h \\
\t\t$(LIBS_DIR)/librustd_service.so.1 $(LIBS_DIR)/librustd_journal.so.1 \\
\t\t$(LIBS_DIR)/librustd_login.so.1 $(LIBS_DIR)/librustd_device.so.1
\tmkdir -p $(LIBS_DIR)
\t$(CC) $(CFLAGS) -fPIC $(LIB_CPPFLAGS) $$(pkg-config --cflags dbus-1 json-c) -shared \\
\t\tlibs/compat/systemd.c libs/compat/sd_bus_impl.c libs/compat/journal_send_impl.c \\
\t\tlibs/compat/sd_json_varlink_impl.c libs/compat/sd_varlink_idl_impl.c \\
\t\t-Wl,--version-script=libs/maps/libsystemd.map \\
\t\t-Wl,-soname,libsystemd.so.0 $(LIB_LDFLAGS) \\
\t\t-Wl,-rpath,'$$ORIGIN' -L$(LIBS_DIR) \\
\t\t-l:librustd_service.so.1 -l:librustd_journal.so.1 -l:librustd_login.so.1 -l:librustd_device.so.1 \\
\t\t$$(pkg-config --libs dbus-1 json-c) -o $@
'''
          s = s[:start] + new + s[end:]
          m.write_text(s)

          # The behavioral classifier must inspect the real implementation
          # files rather than treating every former stub symbol as unsupported.
          c = Path('scripts/check-compat-closure.py')
          s = c.read_text()
          s = s.replace('STUB_DATA_SYMBOLS = {"sd_bus_object_vtable_format"}', 'STUB_DATA_SYMBOLS = set()')
          a = s.index('SEMANTIC_PLACEHOLDERS = {')
          b = s.index('}\n\n', a) + 2
          s = s[:a] + 'SEMANTIC_PLACEHOLDERS = set()\n' + s[b:]
          old_loop = '''    for relative in (\n        Path("libs/compat/systemd.c"),\n        STUB_SOURCE,\n        Path("libs/compat/udev.c"),\n    ):'''
          new_loop = '''    for relative in (\n        Path("libs/compat/systemd.c"),\n        Path("libs/compat/sd_bus_impl.c"),\n        Path("libs/compat/journal_send_impl.c"),\n        Path("libs/compat/sd_json_varlink_impl.c"),\n        Path("libs/compat/sd_varlink_idl_impl.c"),\n        Path("libs/compat/udev.c"),\n    ):'''
          if old_loop not in s:
              raise SystemExit('closure source loop preimage missing')
          s = s.replace(old_loop, new_loop)
          stub_block = '''            if relative == STUB_SOURCE and name not in SUPPORTED_STUB_FUNCTIONS:\n                unsupported.add(name)\n                continue\n'''
          s = s.replace(stub_block, '')
          c.write_text(s)

          r = Path('scripts/check-compat-source-readiness.py')
          s = r.read_text()
          old_loop = '''    for relative in (\n        Path("libs/compat/systemd.c"),\n        Path("libs/compat/sd_bus_stubs.c"),\n        Path("libs/compat/udev.c"),\n    ):'''
          new_loop = '''    for relative in (\n        Path("libs/compat/systemd.c"),\n        Path("libs/compat/sd_bus_impl.c"),\n        Path("libs/compat/journal_send_impl.c"),\n        Path("libs/compat/sd_json_varlink_impl.c"),\n        Path("libs/compat/sd_varlink_idl_impl.c"),\n        Path("libs/compat/udev.c"),\n    ):'''
          if old_loop not in s:
              raise SystemExit('readiness source loop preimage missing')
          s = s.replace(old_loop, new_loop)
          r.write_text(s)
          PY

          git diff --check

          # Focused behavioral certifications for every formerly-red bucket.
          cc -std=c17 -Wall -Wextra -Werror -Ilibs/compat -Iinclude $(pkg-config --cflags dbus-1) \
            libs/tests/test_sd_bus_impl.c libs/compat/sd_bus_impl.c $(pkg-config --libs dbus-1) -o /tmp/test-sd-bus
          dbus-run-session -- /tmp/test-sd-bus

          cc -std=c17 -Wall -Wextra -Werror -Ilibs/compat $(pkg-config --cflags json-c) \
            libs/tests/test_sd_json_varlink_impl.c libs/compat/sd_json_varlink_impl.c \
            $(pkg-config --libs json-c) -o /tmp/test-json-varlink
          /tmp/test-json-varlink

          cc -std=c17 -Wall -Wextra -Werror -Ilibs/compat \
            libs/tests/test_sd_varlink_idl_impl.c libs/compat/sd_varlink_idl_impl.c -o /tmp/test-varlink-idl
          /tmp/test-varlink-idl

          cc -std=c17 -Wall -Wextra -Werror -Iinclude \
            libs/tests/test_journal_send_impl.c libs/compat/journal_send_impl.c -o /tmp/test-journal-send
          /tmp/test-journal-send

          cc -std=c17 -Wall -Wextra -Werror -Iinclude \
            libs/tests/test_journal_filters.c libs/journal/journal.c -o /tmp/test-journal-filters
          /tmp/test-journal-filters

          make clean
          make check-compat
          python3 scripts/check-compat-source-readiness.py --report target/compat-readiness.json --require-complete
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('target/compat-readiness.json').read_text())
          if r['required'] != 184 or r['supported'] != 184 or r['unsupported'] != 0 or r['missing_source_definition'] != 0:
              raise SystemExit(r)
          production = [
              Path('libs/compat/systemd.c'), Path('libs/compat/sd_bus_impl.c'),
              Path('libs/compat/journal_send_impl.c'), Path('libs/compat/sd_json_varlink_impl.c'),
              Path('libs/compat/sd_varlink_idl_impl.c'), Path('libs/compat/udev.c')]
          for path in production:
              text = path.read_text()
              if '<systemd/' in text:
                  raise SystemExit(f'systemd header remains in {path}')
          PY
          ! readelf -d build/libs/libsystemd.so.0 | grep -F 'Shared library: [libsystemd'
          ! grep -R -n --include='*.c' --include='*.h' '#include <systemd/' libs/compat include/rustd

          mkdir -p certification
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          r=json.loads(Path('target/compat-readiness.json').read_text())
          r['schema']='rustd-source-readiness-v1'
          r['tested_sha']=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          Path('certification/source-readiness-latest.json').write_text(json.dumps(r, indent=2, sort_keys=True)+'\n')
          PY
          printf 'schema=rustd-final-abi-closure-v1\nstatus=pass\nrequired=184\nsupported=184\nunsupported=0\nmissing=0\nsystemd_headers=none\nsystemd_runtime_link=none\n' > certification/final-abi-closure-latest.txt

          git fetch origin main
          git rebase origin/main
          git add -A Makefile libs/compat/systemd.c libs/compat/sd_json_varlink_impl.c \
            libs/journal/journal.c include/rustd/journal.h scripts/check-compat-closure.py \
            scripts/check-compat-source-readiness.py certification/source-readiness-latest.json \
            certification/final-abi-closure-latest.txt .github/workflows/final-abi-closure.yml
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Close RustD compatibility ABI'
          git push origin HEAD:main
