name: Repair Fedora VM cutover transaction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/land-fedora-vm-cutover-fixes.yml

permissions:
  contents: write

concurrency:
  group: fedora-vm-cutover-repair
  cancel-in-progress: true

jobs:
  land:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Align the VM with the exact Fedora transaction contract
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/fedora-full-vm-certification.yml')
          text = path.read_text()

          def replace(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one VM workflow match, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          replace(
              '                tar gzip systemd-libs\n',
              '                tar gzip systemd systemd-libs systemd-udev\n')
          replace(
              '''          "${ssh_cmd[@]}" 'set -euo pipefail; sudo dnf -y --repofrompath=rustd,file:///var/tmp/rustd-rpms --setopt=rustd.gpgcheck=0 install rustd rustd-resolved rustd-compat-libs rustd-fedora-compat rustd-selinux --allowerasing'\n''',
              '''          "${ssh_cmd[@]}" 'set -euo pipefail; sudo dnf -y --repofrompath=rustd,file:///var/tmp/rustd-rpms --setopt=rustd.gpgcheck=0 install rustd rustd-resolved rustd-compat-libs rustd-fedora-compat rustd-selinux --allowerasing; sudo /usr/sbin/rustd-fedora-cutover'\n''')
          replace(
              '''          "${ssh_cmd[@]}" 'set -euo pipefail; sudo dnf -q check; if rpm -qa --qf "%{NAME}\\n" | grep -Eq "^systemd($|-)"; then rpm -qa --qf "%{NAME}-%{EVR}.%{ARCH}\\n" | grep "^systemd" >&2; exit 1; fi'\n''',
              '''          "${ssh_cmd[@]}" 'set -euo pipefail; sudo dnf -q check; if rpm -qa --qf "%{NAME}\\n" | grep -Eq "^systemd($|-)"; then rpm -qa --qf "%{NAME}-%{EVR}.%{ARCH}\\n" | grep "^systemd" >&2; exit 1; fi; grep -Eq "^hosts:.*[[:space:]]rustd_dns([[:space:]]|$)" /etc/nsswitch.conf; ! grep -Eq "^hosts:.*[[:space:]](myhostname|resolve|systemd)([[:space:]]|$)" /etc/nsswitch.conf; grep -R -Fq pam_rustd.so /etc/pam.d; ! grep -R -E -q "pam_systemd(_home)?\\.so" /etc/pam.d'\n''')

          path.write_text(text)
          PY

          grep -Fq 'tar gzip systemd systemd-libs systemd-udev' \
            .github/workflows/fedora-full-vm-certification.yml
          grep -Fq 'sudo /usr/sbin/rustd-fedora-cutover' \
            .github/workflows/fedora-full-vm-certification.yml
          grep -Fq 'grep -R -Fq pam_rustd.so /etc/pam.d' \
            .github/workflows/fedora-full-vm-certification.yml
          git diff --check

          rm -f .github/workflows/land-fedora-vm-cutover-fixes.yml
          git add -A .github/workflows/fedora-full-vm-certification.yml \
            .github/workflows/land-fedora-vm-cutover-fixes.yml
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Align Fedora VM cutover transaction'
          git push origin HEAD:main
