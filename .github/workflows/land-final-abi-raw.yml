name: Land final RustD compatibility ABI directly
# trigger

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/land-final-abi-raw.yml

permissions:
  contents: write

concurrency:
  group: final-abi-raw-landing
  cancel-in-progress: true

jobs:
  land:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install compatibility build dependencies
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential gfortran pkg-config libdbus-1-dev libudev-dev \
            libjson-c-dev dbus python3
      - name: Apply and certify complete compatibility ABI
        id: abi
        continue-on-error: true
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          exec > >(tee /tmp/final-abi-raw.log) 2>&1
          python3 - <<'PY'
          from pathlib import Path

          def raw_run(path: str, step_name: str) -> str:
              text=Path(path).read_text()
              step=text.index(f'      - name: {step_name}\n')
              marker='        run: |\n'
              start=text.index(marker,step)+len(marker)
              raw=text[start:]
              return '\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines())+'\n'

          run=raw_run('.github/workflows/final-abi-closure.yml','Apply certified compatibility engines')
          journal_start=run.index('# Apply the already-developed journal-filter transaction')
          journal_end_marker='bash /tmp/apply-journal-filter.sh'
          journal_end=run.index(journal_end_marker,journal_start)+len(journal_end_marker)

          journal=raw_run('.github/workflows/land-journal-filter-abi.yml','Apply native journal filtering and verify')
          cuts=[p for p in ('git fetch origin main','git config user.name','git add -A') if p in journal]
          if cuts:
              journal=journal[:min(journal.index(p) for p in cuts)]
          replacement="# Apply native journal filtering from the raw certified payload.\ncat > /tmp/apply-journal-filter.sh <<'JOURNALSHELL'\n"+journal+"JOURNALSHELL\nbash /tmp/apply-journal-filter.sh"
          run=run[:journal_start]+replacement+run[journal_end:]

          run=run.replace(
              "s = s.replace('STUB_DATA_SYMBOLS = {\"sd_bus_object_vtable_format\"}', 'STUB_DATA_SYMBOLS = set()')",
              "s = s.replace('UNSUPPORTED_DATA_SYMBOLS = {\"sd_bus_object_vtable_format\"}', 'UNSUPPORTED_DATA_SYMBOLS = set()')")
          run=run.replace('git rebase origin/main','git rebase --autostash origin/main')
          required=(
              'dbus-run-session -- /tmp/test-sd-bus',
              '/tmp/test-json-varlink',
              '/tmp/test-varlink-idl',
              '/tmp/test-journal-send',
              '/tmp/test-journal-filters',
              '--require-complete',
              "r['supported'] != 184",
          )
          if not all(x in run for x in required):
              raise SystemExit('final ABI raw payload is incomplete')
          Path('/tmp/final-abi-raw.sh').write_text(run)
          PY
          bash -x /tmp/final-abi-raw.sh
      - name: Publish ABI landing failure
        if: steps.abi.outcome != 'success'
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          git reset --hard HEAD
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p certification
          {
            printf 'schema=rustd-final-abi-diagnostic-v5\nstatus=failure\ntested_sha=%s\n' "$GITHUB_SHA"
            printf '%s\n' '--- tail ---'
            tail -n 480 /tmp/final-abi-raw.log || true
          } > certification/final-abi-closure-diagnostic.txt
          git add certification/final-abi-closure-diagnostic.txt
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Record final ABI landing failure' || exit 0
          git push origin HEAD:main
          exit 1
