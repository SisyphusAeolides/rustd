name: RustD disk-full certification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustd-disk-full-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disk-full-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native and virtualization tools
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          timeout 12m sudo apt-get -o Acquire::Retries=3 update
          timeout 20m sudo apt-get -o Acquire::Retries=3 install --yes --no-install-recommends \
            busybox-static cpio gfortran linux-image-generic qemu-system-x86
          kernel="$(ls -1v /boot/vmlinuz-*-generic | tail -1)"
          sudo cp -L "$kernel" "$RUNNER_TEMP/rustd-ci-vmlinuz"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/rustd-ci-vmlinuz"
          chmod 0644 "$RUNNER_TEMP/rustd-ci-vmlinuz"
          echo "RUSTD_PID1_KERNEL=$RUNNER_TEMP/rustd-ci-vmlinuz" >> "$GITHUB_ENV"

      - name: Install Rust 1.75.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal
          rustc +1.75.0 --version --verbose
          cargo +1.75.0 --version --verbose

      - name: Build disk-full certificate payload
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.75.0 build --release --all-features --locked \
            --bin rustd \
            --bin rustctl \
            --bin rustd-journald \
            --bin rustd-cat

      - name: Exhaust persistent journal storage three times
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "RustD PID1 disk-full certification attempt ${attempt}/3"
            RUSTD_PID1_SERIAL_LOG="pid1-disk-full-serial-${attempt}.log" \
            RUSTD_PID1_QEMU_TIMEOUT=120s \
              bash scripts/ci-pid1-disk-full.sh
          done

      - name: Record disk-full evidence
        shell: bash
        run: |
          set -euo pipefail
          resolved_sha="$(tr -d '[:space:]' < scripts/rustd-resolved-revision.txt)"
          python3 - "$GITHUB_SHA" "$resolved_sha" > disk-full-certification-evidence.jsonl <<'PY'
          import json
          import os
          import sys
          import time

          rustd_sha, resolved_sha = sys.argv[1:]
          print(json.dumps({
              "gate": "fault.disk_full_sim",
              "status": "pass",
              "detail": (
                  "three independent QEMU boots ran RustD as PID 1, exhausted a dedicated tmpfs mounted "
                  "at /var/log/journal until writes returned ENOSPC, injected real rustd-cat journal traffic, "
                  "observed RustD-Journald persistence failure, and retained a responsive manager plus the "
                  "same live unrelated keeper MainPID after the storage fault"
              ),
              "ts": int(time.time()),
              "rustd_sha": rustd_sha,
              "resolved_sha": resolved_sha,
              "iterations": 3,
              "source": (
                  f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
          }, sort_keys=True, separators=(",", ":")))
          PY
          chmod 0600 disk-full-certification-evidence.jsonl
          python3 - "$GITHUB_SHA" "$resolved_sha" <<'PY'
          import json
          import stat
          import sys
          from pathlib import Path

          rustd_sha, resolved_sha = sys.argv[1:]
          path = Path("disk-full-certification-evidence.jsonl")
          if stat.S_IMODE(path.stat().st_mode) != 0o600:
              raise SystemExit("disk-full evidence mode must be 0600")
          records = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
          if len(records) != 1:
              raise SystemExit("expected exactly one disk-full evidence record")
          record = records[0]
          if record.get("gate") != "fault.disk_full_sim" or record.get("status") != "pass":
              raise SystemExit("unexpected disk-full evidence gate/status")
          if record.get("rustd_sha") != rustd_sha or record.get("resolved_sha") != resolved_sha:
              raise SystemExit("disk-full evidence stack SHA mismatch")
          if int(record.get("iterations", 0)) < 3:
              raise SystemExit("fault.disk_full_sim evidence records fewer than three boots")
          if not str(record.get("detail", "")).strip():
              raise SystemExit("fault.disk_full_sim evidence detail is empty")
          print("certification evidence OK: fault.disk_full_sim")
          PY

      - name: Upload disk-full serial logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustd-disk-full-${{ github.sha }}
          path: |
            pid1-disk-full-serial-*.log
            disk-full-certification-evidence.jsonl
          if-no-files-found: warn
          retention-days: 14
