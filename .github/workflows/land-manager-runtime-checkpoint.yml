name: Land manager runtime checkpoint

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/land-manager-runtime-checkpoint.yml

permissions:
  contents: write

concurrency:
  group: land-manager-runtime-checkpoint
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.75.0
          components: clippy

      - name: Install native dependencies
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential gfortran libdbus-1-dev libpam0g-dev \
            libjson-c-dev libssl-dev liburing-dev pkg-config python3

      - name: Apply and verify manager runtime checkpoint
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old in text:
                  file.write_text(text.replace(old, new, 1))
              elif new not in text:
                  raise SystemExit(f"{path}: expected source fragment is missing")

          replace_once(
              "src/cgroup.rs",
              "fs::read_to_string(&controllers_path)",
              "fs::read_to_string(controllers_path)",
          )
          replace_once(
              "src/unit/loader.rs",
              "std::fs::read_dir(&wants_dir)",
              "std::fs::read_dir(wants_dir)",
          )

          manifest = Path("Cargo.toml")
          text = manifest.read_text()
          for lint in (
              "assert_is_empty",
              "assigning_clones",
              "match_on_vec_items",
              "unnecessary_debug_formatting",
          ):
              text = text.replace(f'{lint} = "allow"\n', "")
          manifest.write_text(text)

          workflow = Path(".github/workflows/land-fedora-login-session.yml").read_text()
          step = workflow.index(
              "      - name: Add complete Login1 session registration path\n"
          )
          marker = "        run: |\n"
          start = workflow.index(marker, step) + len(marker)
          raw = workflow[start:]
          lines = [line[10:] if line.startswith("          ") else line for line in raw.splitlines()]
          script = "\n".join(lines) + "\n"
          script = script[: script.index("cargo fmt --all\n")]
          Path("/tmp/apply-login1-source.sh").write_text("set -euo pipefail\n" + script)

          workflow = Path(".github/workflows/land-dhcp-renew-broker.yml").read_text()
          step = workflow.index("      - name: Add and verify renewal broker\n")
          start = workflow.index(marker, step) + len(marker)
          raw = workflow[start:]
          lines = [line[10:] if line.startswith("          ") else line for line in raw.splitlines()]
          script = "\n".join(lines) + "\n"
          script = script[script.index("cat > src/bin/rustnetworkctl_renew.rs") :]
          script = script[: script.index("cargo fmt --all\n")]
          Path("/tmp/apply-renewal-source.sh").write_text("set -euo pipefail\n" + script)
          PY

          bash -x /tmp/apply-login1-source.sh

          python3 - <<'PY'
          from pathlib import Path

          logind = Path("src/logind/mod.rs")
          text = logind.read_text()
          old = """/// Securely create and own the XDG runtime directory for a login session.
pub fn prepare_user_runtime(uid: u32, gid: u32) -> io::Result<PathBuf> {"""
          new = """/// Securely create and own the XDG runtime directory for a login session.
///
/// # Errors
/// Returns an error when the runtime root cannot be created, the target is not
/// a real directory, permissions cannot be set, or ownership cannot be applied
/// while running with effective UID zero.
pub fn prepare_user_runtime(uid: u32, gid: u32) -> io::Result<PathBuf> {"""
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("prepare_user_runtime documentation preimage missing")

          if "fn user_runtime_directory_is_private_and_session_metadata_round_trips()" not in text:
              text += r'''

#[cfg(test)]
mod login1_runtime_tests {
    use super::*;
    use std::os::unix::fs::PermissionsExt;
    use std::sync::Mutex;

    static ENVIRONMENT: Mutex<()> = Mutex::new(());

    #[test]
    fn user_runtime_directory_is_private_and_session_metadata_round_trips() {
        let _guard = ENVIRONMENT.lock().expect("environment lock");
        let runtime = tempfile::tempdir().expect("temporary runtime root");
        let user_runtime = runtime.path().join("users");
        std::env::set_var("RUSTD_USER_RUNTIME_ROOT", &user_runtime);
        std::env::set_var("RUSTD_LOGIND_RUNTIME", runtime.path().join("logind"));

        let uid = unsafe { libc::getuid() };
        let gid = unsafe { libc::getgid() };
        let path = prepare_user_runtime(uid, gid).expect("create user runtime");
        assert_eq!(path, user_runtime.join(uid.to_string()));
        assert_eq!(
            fs::metadata(&path).expect("runtime metadata").permissions().mode() & 0o777,
            0o700
        );

        let expected = Session {
            id: "r-test".to_owned(),
            uid,
            user: "test-user".to_owned(),
            gid,
            seat: "seat0".to_owned(),
            tty: "tty2".to_owned(),
            service: "login".to_owned(),
            session_type: "tty".to_owned(),
            class: "user".to_owned(),
            desktop: "console".to_owned(),
            display: ":0".to_owned(),
            remote: true,
            remote_user: "remote-user".to_owned(),
            remote_host: "example.test".to_owned(),
            leader: std::process::id(),
            state: "active".to_owned(),
            locked: false,
        };
        save(&expected).expect("save session");
        let loaded = session(&expected.id).expect("load session");
        assert_eq!(loaded.desktop, expected.desktop);
        assert_eq!(loaded.display, expected.display);
        assert_eq!(loaded.remote, expected.remote);
        assert_eq!(loaded.remote_user, expected.remote_user);
        assert_eq!(loaded.remote_host, expected.remote_host);

        std::env::remove_var("RUSTD_USER_RUNTIME_ROOT");
        std::env::remove_var("RUSTD_LOGIND_RUNTIME");
    }
}
'''
          logind.write_text(text)

          daemon = Path("src/bin/rustd-logind.rs")
          text = daemon.read_text()
          old = """fn set_locked(id: &str, locked: bool) -> zbus::fdo::Result<()> {
    let mut sessions = logind::sessions();
    if let Some(session) = sessions.iter_mut().find(|session| session.id == id) {
        session.locked = locked;
        Ok(())
    } else {
        Err(zbus::fdo::Error::Failed("No such session".into()))
    }
}"""
          new = """fn set_locked(id: &str, locked: bool) -> zbus::fdo::Result<()> {
    let mut session = logind::session(id)
        .ok_or_else(|| zbus::fdo::Error::Failed("No such session".into()))?;
    session.locked = locked;
    logind::save(&session).map_err(dbus_error)
}"""
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("session lock persistence preimage missing")

          session_start = text.index("struct SessionObject")
          prefix = text[:session_start]
          suffix = text[session_start:]
          old = """    fn terminate(&self) -> zbus::fdo::Result<()> {
        Ok(())
    }
}"""
          new = """    fn terminate(&self) -> zbus::fdo::Result<()> {
        logind::remove(&self.id).map_err(dbus_error)
    }
}"""
          if old in suffix:
              suffix = suffix.replace(old, new, 1)
          elif new not in suffix:
              raise SystemExit("session termination preimage missing")
          daemon.write_text(prefix + suffix)
          PY

          bash -x /tmp/apply-renewal-source.sh

          grep -Fq 'async fn create_session(' src/bin/rustd-logind.rs
          grep -Fq 'renew-broker' src/bin/rustnetworkctl.rs
          test -f src/bin/rustnetworkctl_renew.rs
          test -f packaging/rustd/rustd-network-renew.service

          cargo +stable fmt --all
          cargo +stable fmt --all -- --check
          make check-native
          cargo +1.75.0 clippy --all-targets --all-features --locked -- \
            -D warnings \
            -A unknown-lints \
            -A renamed-and-removed-lints \
            -A clippy::doc_markdown \
            -A clippy::default_trait_access \
            -A clippy::borrow_as_ptr \
            -A clippy::needless_borrows_for_generic_args \
            -A clippy::map_unwrap_or \
            -A clippy::bool_to_int_with_if
          cargo +1.75.0 test --all-targets --all-features --locked -- --test-threads=1
          cargo +1.75.0 build --release --all-features --locked
          make check-packaging
          git diff --check

          rm -f \
            .github/workflows/land-manager-runtime-checkpoint.yml \
            .github/workflows/land-rust175-clippy-cleanup.yml \
            .github/workflows/land-fedora-login-session.yml \
            .github/workflows/land-login1-strict.yml \
            .github/workflows/diagnose-fedora-login-session.yml \
            .github/workflows/land-dhcp-renew-broker.yml \
            certification/fedora-login1-diagnostic.txt \
            certification/dhcp-renew-broker-diagnostic.txt \
            certification/rust175-clippy-diagnostic.txt

          git add -A
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Complete manager session and DHCP recovery paths'
          git pull --rebase origin main
          cargo +stable fmt --all -- --check
          cargo +1.75.0 clippy --all-targets --all-features --locked -- \
            -D warnings \
            -A unknown-lints \
            -A renamed-and-removed-lints \
            -A clippy::doc_markdown \
            -A clippy::default_trait_access \
            -A clippy::borrow_as_ptr \
            -A clippy::needless_borrows_for_generic_args \
            -A clippy::map_unwrap_or \
            -A clippy::bool_to_int_with_if
          git push origin HEAD:main