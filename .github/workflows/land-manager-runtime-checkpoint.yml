name: Land manager runtime checkpoint

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/land-manager-runtime-checkpoint.yml

permissions:
  contents: write

concurrency:
  group: land-manager-runtime-checkpoint
  cancel-in-progress: true

jobs:
  land:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.75.0
          components: clippy

      - name: Install native dependencies
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential dbus gfortran libdbus-1-dev libpam0g-dev \
            libjson-c-dev libssl-dev libudev-dev liburing-dev pkg-config python3

      - name: Apply and verify manager runtime checkpoint
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old in text:
                  file.write_text(text.replace(old, new, 1))
              elif new not in text:
                  raise SystemExit(f"{path}: expected source fragment is missing")

          replace_once(
              "src/cgroup.rs",
              "fs::read_to_string(&controllers_path)",
              "fs::read_to_string(controllers_path)",
          )
          replace_once(
              "src/unit/loader.rs",
              "std::fs::read_dir(&wants_dir)",
              "std::fs::read_dir(wants_dir)",
          )

          manifest = Path("Cargo.toml")
          text = manifest.read_text()
          for lint in (
              "assert_is_empty",
              "assigning_clones",
              "match_on_vec_items",
              "unnecessary_debug_formatting",
          ):
              text = text.replace(f'{lint} = "allow"\n', "")
          manifest.write_text(text)

          marker = "        run: |\n"

          strict = Path(".github/workflows/land-login1-strict.yml").read_text()
          step = strict.index(
              "      - name: Apply and verify Login1 source transaction\n"
          )
          start = strict.index(marker, step) + len(marker)
          raw = strict[start:]
          lines = [line[10:] if line.startswith("          ") else line for line in raw.splitlines()]
          script = "\n".join(lines) + "\n"
          script = script[script.index("python3 - <<'PY'\n") :]
          script = script[: script.index("make check-native\n")]
          Path("/tmp/apply-login1-source.sh").write_text("set -euo pipefail\n" + script)

          renewal = Path(".github/workflows/land-dhcp-renew-broker.yml").read_text()
          step = renewal.index("      - name: Add and verify renewal broker\n")
          start = renewal.index(marker, step) + len(marker)
          raw = renewal[start:]
          lines = [line[10:] if line.startswith("          ") else line for line in raw.splitlines()]
          script = "\n".join(lines) + "\n"
          script = script[script.index("cat > src/bin/rustnetworkctl_renew.rs") :]
          script = script[: script.index("cargo fmt --all\n")]
          Path("/tmp/apply-renewal-source.sh").write_text("set -euo pipefail\n" + script)

          closure = Path(".github/workflows/land-full-abi-v2.yml").read_text()
          step = closure.index(
              "      - name: Apply, verify, and commit complete ABI\n"
          )
          start = closure.index(marker, step) + len(marker)
          raw = closure[start:]
          lines = [line[10:] if line.startswith("          ") else line for line in raw.splitlines()]
          script = "\n".join(lines) + "\n"
          script = script[script.index("python3 - <<'PY'\n") :]
          script = script[: script.index("mkdir -p certification\n")]
          Path("/tmp/apply-full-abi-source.sh").write_text("set -euo pipefail\n" + script)
          PY

          bash -x /tmp/apply-login1-source.sh

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/bin/rustd-logind.rs")
          text = path.read_text()

          replacements = (
              (
                  '''fn set_locked(id: &str, locked: bool) -> zbus::fdo::Result<()> {
    let mut sessions = logind::sessions();
    if let Some(session) = sessions.iter_mut().find(|session| session.id == id) {
        session.locked = locked;
        Ok(())
    } else {
        Err(zbus::fdo::Error::Failed("No such session".into()))
    }
}''',
                  '''fn set_locked(id: &str, locked: bool) -> zbus::fdo::Result<()> {
    let mut session = logind::session(id)
        .ok_or_else(|| zbus::fdo::Error::Failed("No such session".into()))?;
    session.locked = locked;
    logind::save(&session).map_err(dbus_error)
}''',
              ),
              (
                  '''    fn scope(&self) -> String {
        String::new()
    }''',
                  '''    fn scope(&self) -> String {
        format!("session-{}.scope", self.id)
    }''',
              ),
              (
                  '''    fn active(&self) -> bool {
        true
    }''',
                  '''    fn active(&self) -> bool {
        logind::session(&self.id).is_some_and(|session| session.state == "active")
    }''',
              ),
              (
                  '''    fn state(&self) -> &'static str {
        "active"
    }''',
                  '''    fn state(&self) -> String {
        logind::session(&self.id)
            .map(|session| session.state)
            .unwrap_or_else(|| "closing".into())
    }''',
              ),
              (
                  '''    fn activate(&self) -> zbus::fdo::Result<()> {
        Ok(())
    }''',
                  '''    fn activate(&self) -> zbus::fdo::Result<()> {
        if logind::session(&self.id).is_some() {
            Ok(())
        } else {
            Err(zbus::fdo::Error::Failed("No such session".into()))
        }
    }''',
              ),
          )
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f"Login1 source fragment is missing: {old[:40]!r}")

          session_start = text.index("struct SessionObject")
          user_start = text.index("struct UserObject", session_start)
          session_prefix = text[:session_start]
          session_block = text[session_start:user_start]
          remainder = text[user_start:]
          old = '''    fn terminate(&self) -> zbus::fdo::Result<()> {
        Ok(())
    }'''
          new = '''    fn terminate(&self) -> zbus::fdo::Result<()> {
        logind::remove(&self.id).map_err(dbus_error)
    }'''
          if old in session_block:
              session_block = session_block.replace(old, new, 1)
          elif new not in session_block:
              raise SystemExit("session terminate source fragment is missing")
          text = session_prefix + session_block + remainder

          old = '''    fn display(&self) -> (String, OwnedObjectPath) {
        (
            String::new(),
            OwnedObjectPath::try_from("/").unwrap_or_default(),
        )
    }'''
          new = '''    fn display(&self) -> (String, OwnedObjectPath) {
        let session = logind::sessions()
            .into_iter()
            .find(|session| session.uid == self.uid && !session.display.is_empty());
        match session {
            Some(session) => (
                session.id.clone(),
                path(logind::session_path(&session.id))
                    .unwrap_or_else(|_| OwnedObjectPath::default()),
            ),
            None => (
                String::new(),
                OwnedObjectPath::try_from("/").unwrap_or_default(),
            ),
        }
    }'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("user display source fragment is missing")

          user_start = text.index("struct UserObject")
          seat_start = text.index("struct SeatObject", user_start)
          prefix = text[:user_start]
          user_block = text[user_start:seat_start]
          suffix = text[seat_start:]
          old = '''    fn terminate(&self) -> zbus::fdo::Result<()> {
        Ok(())
    }
    fn kill(&self, signal: i32) -> zbus::fdo::Result<()> {
        let _ = signal;
        Ok(())
    }'''
          new = '''    fn terminate(&self) -> zbus::fdo::Result<()> {
        for session in logind::sessions()
            .into_iter()
            .filter(|session| session.uid == self.uid)
        {
            logind::remove(&session.id).map_err(dbus_error)?;
        }
        Ok(())
    }
    fn kill(&self, signal: i32) -> zbus::fdo::Result<()> {
        for session in logind::sessions()
            .into_iter()
            .filter(|session| session.uid == self.uid && session.leader > 0)
        {
            if unsafe { libc::kill(session.leader as libc::pid_t, signal) } != 0 {
                let error = std::io::Error::last_os_error();
                if error.raw_os_error() != Some(libc::ESRCH) {
                    return Err(dbus_error(error));
                }
            }
        }
        Ok(())
    }'''
          if old in user_block:
              user_block = user_block.replace(old, new, 1)
          elif new not in user_block:
              raise SystemExit("user terminate/kill source fragment is missing")
          text = prefix + user_block + suffix

          old = '''    fn active_session(&self) -> (String, OwnedObjectPath) {
        (
            String::new(),
            OwnedObjectPath::try_from("/").unwrap_or_default(),
        )
    }'''
          new = '''    fn active_session(&self) -> (String, OwnedObjectPath) {
        let session = logind::sessions()
            .into_iter()
            .find(|session| session.seat == self.id && session.state == "active");
        match session {
            Some(session) => (
                session.id.clone(),
                path(logind::session_path(&session.id))
                    .unwrap_or_else(|_| OwnedObjectPath::default()),
            ),
            None => (
                String::new(),
                OwnedObjectPath::try_from("/").unwrap_or_default(),
            ),
        }
    }'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("seat active-session source fragment is missing")

          path.write_text(text)
          PY

          bash -x /tmp/apply-renewal-source.sh
          bash -x /tmp/apply-full-abi-source.sh

          grep -Fq 'async fn create_session(' src/bin/rustd-logind.rs
          grep -Fq 'logind::save(&session).map_err(dbus_error)' src/bin/rustd-logind.rs
          grep -Fq 'renew-broker' src/bin/rustnetworkctl.rs
          test -f src/bin/rustnetworkctl_renew.rs
          test -f packaging/rustd/rustd-network-renew.service
          grep -Fq 'libs/compat/sd_bus_impl.c' Makefile
          grep -Fq 'libs/compat/journal_send_impl.c' Makefile
          grep -Fq 'libs/compat/sd_json_varlink_impl.c' Makefile
          grep -Fq 'libs/compat/sd_varlink_idl_impl.c' Makefile
          ! grep -Fq 'libs/compat/sd_bus_stubs.c' Makefile

          python3 - <<'PY'
          import json

          report = json.load(open("target/compat-readiness.json", encoding="utf-8"))
          expected = {
              "required": 184,
              "supported": 184,
              "unsupported": 0,
              "missing_source_definition": 0,
          }
          for key, value in expected.items():
              if report.get(key) != value:
                  raise SystemExit(report)
          PY

          cargo +stable fmt --all
          cargo +stable fmt --all -- --check
          make clean
          make check-native
          make check-compat
          python3 scripts/check-compat-source-readiness.py \
            --report target/compat-readiness.json --require-complete
          cargo +1.75.0 clippy --all-targets --all-features --locked -- \
            -D warnings \
            -A unknown-lints \
            -A renamed-and-removed-lints \
            -A clippy::doc_markdown \
            -A clippy::default_trait_access \
            -A clippy::borrow_as_ptr \
            -A clippy::needless_borrows_for_generic_args \
            -A clippy::map_unwrap_or \
            -A clippy::bool_to_int_with_if
          cargo +1.75.0 test --all-targets --all-features --locked -- --test-threads=1
          cargo +1.75.0 build --release --all-features --locked

          tmp="$(mktemp -d)"
          socket="$tmp/dhcp-renew.sock"
          log="$tmp/dispatch.log"
          RUSTD_NETWORK_RENEW_SOCKET="$socket" \
          RUSTD_NETWORK_RENEW_TEST_LOG="$log" \
          RUSTD_NETWORK_RENEW_MAX_REQUESTS=1 \
            target/release/rustnetworkctl renew-broker &
          broker=$!
          trap 'kill "$broker" 2>/dev/null || true; rm -rf "$tmp"' EXIT
          for _ in $(seq 1 100); do
            [[ -S $socket ]] && break
            sleep 0.05
          done
          [[ -S $socket ]]
          python3 - "$socket" <<'PY'
          import socket
          import sys

          path = sys.argv[1]
          index = socket.if_nametoindex("lo")
          packet = (
              "RUSTD_DHCP_RENEW=1\n"
              f"IFINDEX={index}\n"
              "IFNAME=lo\n"
              "FAMILY=any\n"
          ).encode()
          client = socket.socket(socket.AF_UNIX, socket.SOCK_DGRAM)
          client.sendto(packet, path)
          PY
          wait "$broker"
          grep -Eq '^ifindex=[0-9]+ ifname=lo family=any$' "$log"
          trap - EXIT
          rm -rf "$tmp"

          make check-packaging
          git diff --check

          mkdir -p certification
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("target/compat-readiness.json").read_text())
          report["schema"] = "rustd-source-readiness-v2"
          report["production_engine"] = "native-real-implementations"
          Path("certification/source-readiness-latest.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          PY
          cat > certification/final-abi-closure-latest.txt <<'EOF'
          schema=rustd-final-abi-closure-v2
          status=pass
          required=184
          supported=184
          unsupported=0
          missing=0
          systemd_headers=none
          systemd_runtime_link=none
          sd_bus_engine=real
          journal_engine=real
          json_varlink_engine=real
          EOF

          rm -f \
            .github/workflows/land-manager-runtime-checkpoint.yml \
            .github/workflows/land-rust175-clippy-cleanup.yml \
            .github/workflows/land-fedora-login-session.yml \
            .github/workflows/land-login1-strict.yml \
            .github/workflows/diagnose-fedora-login-session.yml \
            .github/workflows/land-dhcp-renew-broker.yml \
            .github/workflows/integrate-sd-bus-production.yml \
            .github/workflows/check-sd-bus-impl.yml \
            .github/workflows/integrate-journal-send.yml \
            .github/workflows/final-abi-closure.yml \
            .github/workflows/run-final-abi-closure.yml \
            .github/workflows/land-full-abi-v2.yml \
            certification/fedora-login1-diagnostic.txt \
            certification/dhcp-renew-broker-diagnostic.txt \
            certification/rust175-clippy-diagnostic.txt \
            certification/sd-bus-staged-diagnostic.txt \
            certification/final-abi-closure-diagnostic.txt

          git add -A
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Complete manager runtime and compatibility paths'
          git pull --rebase origin main
          cargo +stable fmt --all -- --check
          cargo +1.75.0 clippy --all-targets --all-features --locked -- \
            -D warnings \
            -A unknown-lints \
            -A renamed-and-removed-lints \
            -A clippy::doc_markdown \
            -A clippy::default_trait_access \
            -A clippy::borrow_as_ptr \
            -A clippy::needless_borrows_for_generic_args \
            -A clippy::map_unwrap_or \
            -A clippy::bool_to_int_with_if
          make check-compat
          python3 scripts/check-compat-source-readiness.py \
            --report target/compat-readiness.json --require-complete
          git push origin HEAD:main