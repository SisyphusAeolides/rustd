name: Trigger compatibility event engine

on:
  push:
    branches: [main]
    paths:
      - .github/compat-event-engine-trigger

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Touch verified landing workflow
        shell: bash
        run: |
          set -euo pipefail
          printf '\n# triggered from %s\n' "$GITHUB_SHA" >> .github/workflows/land-compat-event-engine-v2.yml
          rm -f .github/compat-event-engine-trigger .github/workflows/trigger-compat-event-engine.yml
          git add -A .github/compat-event-engine-trigger .github/workflows/trigger-compat-event-engine.yml .github/workflows/land-compat-event-engine-v2.yml
          git config user.name 'Kenny Glauner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Trigger verified compatibility event engine'
          git push origin HEAD:main
