name: Reproducible release

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - Makefile
      - ffi/**
      - src/**
      - packaging/**
      - scripts/check-reproducible-release.sh
      - .github/workflows/reproducible-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducible-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install build toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gfortran \
            libdbus-1-dev \
            libpam0g-dev \
            pkg-config
          rustup toolchain install 1.75.0 --profile minimal
          rustup default 1.75.0

      - name: Verify release reproducibility
        shell: bash
        env:
          CARGO_BUILD_JOBS: 1
        run: |
          set -euo pipefail
          bash scripts/check-reproducible-release.sh

      - name: Upload reproducibility evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustd-reproducibility-${{ github.sha }}
          path: target/reproducibility
          if-no-files-found: error
          retention-days: 30
