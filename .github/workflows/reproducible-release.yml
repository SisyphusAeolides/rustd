name: Reproducible release

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - Makefile
      - ffi/**
      - src/**
      - packaging/**
      - scripts/check-reproducible-release.sh
      - .github/workflows/reproducible-release.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: reproducible-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"pending","context":"rustd/reproducibility","description":"Reproducible release proof is running","target_url":"%s"}' "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install build toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gfortran \
            libdbus-1-dev \
            libpam0g-dev \
            pkg-config
          rustup toolchain install 1.75.0 --profile minimal
          rustup default 1.75.0

      - name: Verify release reproducibility
        shell: bash
        env:
          CARGO_BUILD_JOBS: 1
        run: |
          set -euo pipefail
          bash scripts/check-reproducible-release.sh

      - name: Upload reproducibility evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustd-reproducibility-${{ github.sha }}
          path: target/reproducibility
          if-no-files-found: error
          retention-days: 30

      - name: Publish final status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"%s","context":"rustd/reproducibility","description":"Reproducible release proof %s","target_url":"%s"}' "$STATE" "$STATE" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null
