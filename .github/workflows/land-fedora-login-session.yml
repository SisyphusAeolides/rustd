name: Land Fedora Login1 PAM session support
# trigger

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/land-fedora-login-session.yml

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.75.0
          components: rustfmt,clippy
      - name: Install native build dependencies
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gfortran libdbus-1-dev libpam0g-dev pkg-config
      - name: Add complete Login1 session registration path
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/logind/mod.rs')
          s=p.read_text()
          s=s.replace('use std::path::{Path, PathBuf};\n', 'use std::os::unix::fs::PermissionsExt;\nuse std::path::{Path, PathBuf};\n')
          old='''    pub service: String,\n    pub session_type: String,\n    pub class: String,\n    pub leader: u32,\n'''
          new='''    pub service: String,\n    pub session_type: String,\n    pub class: String,\n    pub desktop: String,\n    pub display: String,\n    pub remote: bool,\n    pub remote_user: String,\n    pub remote_host: String,\n    pub leader: u32,\n'''
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('Session field preimage missing')
          old='''            class: values\n                .get("CLASS")\n                .cloned()\n                .unwrap_or_else(|| "user".into()),\n            state: values\n'''
          new='''            class: values\n                .get("CLASS")\n                .cloned()\n                .unwrap_or_else(|| "user".into()),\n            desktop: values.get("DESKTOP").cloned().unwrap_or_default(),\n            display: values.get("DISPLAY").cloned().unwrap_or_default(),\n            remote: values.get("REMOTE").is_some_and(|v| v == "yes"),\n            remote_user: values.get("REMOTE_USER").cloned().unwrap_or_default(),\n            remote_host: values.get("REMOTE_HOST").cloned().unwrap_or_default(),\n            state: values\n'''
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('Session parse preimage missing')
          old='''            "UID={}\\nGID={}\\nUSER={}\\nSEAT={}\\nTTY={}\\nSERVICE={}\\nTYPE={}\\nCLASS={}\\nLEADER={}\\nSTATE={}\\nLOCKED={}\\n",\n            self.uid, self.gid, self.user, self.seat, self.tty, self.service,\n            self.session_type, self.class, self.leader, self.state,\n'''
          new='''            "UID={}\\nGID={}\\nUSER={}\\nSEAT={}\\nTTY={}\\nSERVICE={}\\nTYPE={}\\nCLASS={}\\nDESKTOP={}\\nDISPLAY={}\\nREMOTE={}\\nREMOTE_USER={}\\nREMOTE_HOST={}\\nLEADER={}\\nSTATE={}\\nLOCKED={}\\n",\n            self.uid, self.gid, self.user, self.seat, self.tty, self.service,\n            self.session_type, self.class, self.desktop, self.display,\n            if self.remote { "yes" } else { "no" }, self.remote_user, self.remote_host,\n            self.leader, self.state,\n'''
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('Session serialize preimage missing')
          marker='''pub fn prepare() -> io::Result<()> {\n    for kind in ["sessions", "users", "seats"] {\n        fs::create_dir_all(directory(kind))?;\n    }\n    Ok(())\n}\n'''
          addition=marker+r'''

/// Root directory for per-user runtime directories.
#[must_use]
pub fn user_runtime_root() -> PathBuf {
    std::env::var_os("RUSTD_USER_RUNTIME_ROOT")
        .map_or_else(|| PathBuf::from("/run/user"), PathBuf::from)
}

/// Securely create and own the XDG runtime directory for a login session.
pub fn prepare_user_runtime(uid: u32, gid: u32) -> io::Result<PathBuf> {
    let root = user_runtime_root();
    fs::create_dir_all(&root)?;
    let path = root.join(uid.to_string());
    match fs::symlink_metadata(&path) {
        Ok(metadata) => {
            if !metadata.file_type().is_dir() || metadata.file_type().is_symlink() {
                return Err(io::Error::new(io::ErrorKind::InvalidData, "unsafe user runtime path"));
            }
        }
        Err(error) if error.kind() == io::ErrorKind::NotFound => fs::create_dir(&path)?,
        Err(error) => return Err(error),
    }
    fs::set_permissions(&path, fs::Permissions::from_mode(0o700))?;
    let c_path = std::ffi::CString::new(path.as_os_str().as_encoded_bytes())
        .map_err(|_| io::Error::new(io::ErrorKind::InvalidInput, "runtime path contains NUL"))?;
    if unsafe { libc::chown(c_path.as_ptr(), uid, gid) } != 0 {
        let error = io::Error::last_os_error();
        if unsafe { libc::geteuid() } == 0 {
            return Err(error);
        }
    }
    Ok(path)
}
'''
          if 'pub fn prepare_user_runtime(' not in s:
              if marker not in s: raise SystemExit('prepare insertion point missing')
              s=s.replace(marker,addition,1)
          p.write_text(s)

          p=Path('src/bin/rustd-logind.rs')
          s=p.read_text()
          s=s.replace('const NATIVE_ROOT: &str = "/io/rustd/Login1";\n', 'const NATIVE_ROOT: &str = "/io/rustd/Login1";\nstatic NEXT_SESSION: AtomicU64 = AtomicU64::new(1);\n')
          old='''struct Manager {\n    next_inhibitor: AtomicU64,\n    inhibitors: Arc<Mutex<HashMap<u64, InhibitorEntry>>>,\n}\n'''
          new='''struct Manager {\n    next_inhibitor: AtomicU64,\n    inhibitors: Arc<Mutex<HashMap<u64, InhibitorEntry>>>,\n    session_refs: Arc<Mutex<HashMap<String, OwnedFd>>>,\n}\n'''
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('Manager preimage missing')

          method_marker='''impl Manager {\n    fn get_session(&self, id: String) -> zbus::fdo::Result<OwnedObjectPath> {\n'''
          methods=r'''impl Manager {
    #[allow(clippy::too_many_arguments)]
    async fn create_session(
        &self,
        uid: u32,
        pid: u32,
        service: String,
        type_: String,
        class: String,
        desktop: String,
        seat_id: String,
        vtnr: u32,
        tty: String,
        display: String,
        remote: bool,
        remote_user: String,
        remote_host: String,
        _properties: Vec<(String, zbus::zvariant::OwnedValue)>,
        #[zbus(connection)] connection: &zbus::Connection,
    ) -> zbus::fdo::Result<(
        String,
        OwnedObjectPath,
        String,
        zbus::zvariant::OwnedFd,
        u32,
        String,
        u32,
        bool,
    )> {
        let (user, gid) = passwd_record(uid)
            .ok_or_else(|| zbus::fdo::Error::Failed("No such user".into()))?;
        let runtime = logind::prepare_user_runtime(uid, gid).map_err(dbus_error)?;
        let id = loop {
            let candidate = format!("r{}", NEXT_SESSION.fetch_add(1, Ordering::Relaxed));
            if logind::session(&candidate).is_none() {
                break candidate;
            }
        };
        let seat = if seat_id.is_empty() { "seat0".to_owned() } else { seat_id };
        let session = Session {
            id: id.clone(),
            uid,
            user,
            gid,
            seat: seat.clone(),
            tty,
            service,
            session_type: if type_.is_empty() { "unspecified".into() } else { type_ },
            class: if class.is_empty() { "user".into() } else { class },
            desktop,
            display,
            remote,
            remote_user,
            remote_host,
            leader: pid,
            state: "active".into(),
            locked: false,
        };
        logind::save(&session).map_err(dbus_error)?;
        let object_path = path(logind::session_path(&id))?;
        connection
            .object_server()
            .at(logind::session_path(&id), SessionObject { id: id.clone() })
            .await
            .map_err(|error| zbus::fdo::Error::Failed(error.to_string()))?;
        let _ = connection
            .object_server()
            .at(logind::user_path(uid), UserObject { uid })
            .await;
        let _ = connection
            .object_server()
            .at(logind::seat_path(&seat), SeatObject { id: seat.clone() })
            .await;

        let mut fds = [0i32; 2];
        if unsafe { libc::pipe2(fds.as_mut_ptr(), libc::O_CLOEXEC) } != 0 {
            let _ = logind::remove(&id);
            return Err(dbus_error(std::io::Error::last_os_error()));
        }
        let watch = unsafe { OwnedFd::from_raw_fd(fds[0]) };
        let client = unsafe { OwnedFd::from_raw_fd(fds[1]) };
        self.session_refs
            .lock()
            .map_err(|_| zbus::fdo::Error::Failed("session reference lock poisoned".into()))?
            .insert(id.clone(), watch);
        Ok((
            id,
            object_path,
            runtime.to_string_lossy().into_owned(),
            zbus::zvariant::OwnedFd::from(client),
            uid,
            seat,
            vtnr,
            false,
        ))
    }

    fn release_session(&self, id: String) -> zbus::fdo::Result<()> {
        self.session_refs
            .lock()
            .map_err(|_| zbus::fdo::Error::Failed("session reference lock poisoned".into()))?
            .remove(&id);
        logind::remove(&id).map_err(dbus_error)
    }

    fn terminate_session(&self, id: String) -> zbus::fdo::Result<()> {
        self.release_session(id)
    }

    fn get_session(&self, id: String) -> zbus::fdo::Result<OwnedObjectPath> {
