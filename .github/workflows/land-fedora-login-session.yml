'''    fn remote_user(&self) -> String {\n        String::new()\n    }''':'''    fn remote_user(&self) -> String {\n        logind::session(&self.id).map(|s| s.remote_user).unwrap_or_default()\n    }''',
'''    fn service(&self) -> String {\n        String::new()\n    }''':'''    fn service(&self) -> String {\n        logind::session(&self.id).map(|s| s.service).unwrap_or_default()\n    }''',
'''    fn desktop(&self) -> String {\n        String::new()\n    }''':'''    fn desktop(&self) -> String {\n        logind::session(&self.id).map(|s| s.desktop).unwrap_or_default()\n    }''',
