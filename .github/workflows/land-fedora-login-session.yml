          passwd=r'''fn passwd_record(uid: u32) -> Option<(String, u32)> {
    std::fs::read_to_string("/etc/passwd").ok()?.lines().find_map(|line| {
        let fields = line.split(':').collect::<Vec<_>>();
        if fields.len() < 4 || fields[2].parse::<u32>().ok()? != uid {
            return None;
        }
        Some((fields[0].to_owned(), fields[3].parse::<u32>().ok()?))
    })
}

fn passwd_name(uid: u32) -> Option<String> {
'''
