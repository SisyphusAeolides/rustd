name: multiarch-smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install cross (non-native)
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: cargo install cross --locked
      - name: Native build and library gates
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libdbus-1-dev libpam0g-dev pkg-config
          make libs compat check-libs check-compat
          cargo test --locked --lib
      - name: Cross build (no run)
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: cross build --release --locked --target ${{ matrix.target }}
