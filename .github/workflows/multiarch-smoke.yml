name: multiarch-smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust target
        shell: bash
        run: |
          set -euo pipefail
          rustup target add ${{ matrix.target }}
      - name: Native build and library gates
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            gfortran \
            libdbus-1-dev \
            libjson-c-dev \
            libpam0g-dev \
            libsystemd-dev \
            libudev-dev \
            pkg-config
          make libs compat check-libs check-compat
          cargo test --locked --lib
      - name: AArch64 release build
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/aarch64-cross-build.sh
