name: Fix staged sd-bus async dispatch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-sd-bus-async-dispatch.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Patch and certify async dispatch
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libdbus-1-dev libsystemd-dev dbus
          python3 - <<'PY'
          from pathlib import Path
          p=Path('libs/compat/sd_bus_impl.c')
          s=p.read_text()
          old='''    DBusPendingCall *pending;\n    struct sd_bus_slot *next;\n};'''
          new='''    DBusPendingCall *pending;\n    dbus_uint32_t pending_serial;\n    struct sd_bus_slot *next;\n};'''
          if old not in s: raise SystemExit('slot preimage missing')
          s=s.replace(old,new,1)
          old='''    if (!dbus_connection_read_write(bus->connection, 0))\n        return -ECONNRESET;\n    raw = dbus_connection_pop_message(bus->connection);\n    if (!raw)\n        return 0;'''
          new='''    if (!dbus_connection_read_write(bus->connection, 0))\n        return -ECONNRESET;\n    raw = dbus_connection_borrow_message(bus->connection);\n    if (!raw)\n        return 0;\n    if (dbus_message_get_reply_serial(raw) != 0U) {\n        dbus_uint32_t reply_serial = dbus_message_get_reply_serial(raw);\n        sd_bus_slot *slot;\n        for (slot = bus->slots; slot; slot = slot->next) {\n            if (slot->kind == RUSTD_SLOT_ASYNC && slot->pending_serial == reply_serial) {\n                dbus_connection_return_message(bus->connection, raw);\n                return dbus_connection_dispatch(bus->connection) == DBUS_DISPATCH_NEED_MEMORY ? -ENOMEM : 1;\n            }\n        }\n    }\n    dbus_connection_return_message(bus->connection, raw);\n    raw = dbus_connection_pop_message(bus->connection);\n    if (!raw)\n        return 0;'''
          if old not in s: raise SystemExit('process preimage missing')
          s=s.replace(old,new,1)
          old='''    slot->callback = callback;\n    slot->userdata = userdata;\n    slot->pending = pending;'''
          new='''    slot->callback = callback;\n    slot->userdata = userdata;\n    slot->pending = pending;\n    slot->pending_serial = dbus_message_get_serial(m->message);'''
          if old not in s: raise SystemExit('async slot preimage missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          cc -std=c17 -Wall -Wextra -Werror -fPIC -Iinclude $(pkg-config --cflags dbus-1) -c libs/compat/sd_bus_impl.c -o /tmp/sd_bus_impl.o
          cc -std=c17 -Wall -Wextra -Werror -Iinclude $(pkg-config --cflags dbus-1) libs/tests/test_sd_bus_impl.c libs/compat/sd_bus_impl.c $(pkg-config --libs dbus-1) -o /tmp/test-sd-bus-impl
          dbus-run-session -- /tmp/test-sd-bus-impl
          rm -f .github/workflows/fix-sd-bus-async-dispatch.yml
          git add -A libs/compat/sd_bus_impl.c .github/workflows/fix-sd-bus-async-dispatch.yml
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Fix selective sd-bus async dispatch'
          git push origin HEAD:main
