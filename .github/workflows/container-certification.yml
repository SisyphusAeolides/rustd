name: RustD container certification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustd-container-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor busybox-static gfortran

      - name: Install Rust 1.75.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal

      - name: Build native container launcher
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.75.0 build --release --locked --bin rustd-nspawn

      - name: Install rootless user-namespace policy
        shell: bash
        run: |
          set -euo pipefail
          sudo install -Dm0755 target/release/rustd-nspawn /usr/bin/rustd-nspawn
          sudo install -Dm0644 packaging/apparmor/usr.bin.rustd-nspawn /etc/apparmor.d/usr.bin.rustd-nspawn
          sudo apparmor_parser -r /etc/apparmor.d/usr.bin.rustd-nspawn
          sudo apparmor_status | grep -Fq '/usr/bin/rustd-nspawn'

      - name: Certify rootful and rootless isolation
        shell: bash
        run: |
          set -euo pipefail
          evidence=/tmp/rustd-container-certification.jsonl
          bash scripts/ci-container-certification.sh /usr/bin/rustd-nspawn "$evidence" \
            2>&1 | tee /tmp/rustd-container-certification.log
          python3 - "$evidence" "$GITHUB_SHA" "$(tr -d '[:space:]' < scripts/rustd-resolved-revision.txt)" <<'PY'
          import json
          import stat
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          rustd_sha, resolved_sha = sys.argv[2:4]
          if stat.S_IMODE(path.stat().st_mode) != 0o600:
              raise SystemExit("container evidence mode must be 0600")
          records = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
          expected = {"container.rootful", "container.rootless"}
          if {record.get("gate") for record in records} != expected:
              raise SystemExit("container evidence gate set is incomplete")
          for record in records:
              if record.get("status") != "pass":
                  raise SystemExit(f"{record.get('gate')}: status is not pass")
              if record.get("rustd_sha") != rustd_sha or record.get("resolved_sha") != resolved_sha:
                  raise SystemExit(f"{record.get('gate')}: stack SHA mismatch")
              if int(record.get("iterations", 0)) < 10:
                  raise SystemExit(f"{record.get('gate')}: fewer than 10 iterations")
              if not str(record.get("detail", "")).strip():
                  raise SystemExit(f"{record.get('gate')}: empty detail")
          print("certification evidence OK: container.rootful,container.rootless")
          PY

      - name: Upload container evidence and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustd-container-certification-${{ github.sha }}
          path: |
            /tmp/rustd-container-certification.log
            /tmp/rustd-container-certification.jsonl
          if-no-files-found: warn
          retention-days: 14
