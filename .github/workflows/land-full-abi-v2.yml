name: Land complete RustD compatibility ABI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/land-full-abi-v2.yml

permissions:
  contents: write

concurrency:
  group: land-complete-rustd-abi-v2
  cancel-in-progress: true

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install native dependencies
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential gfortran pkg-config libdbus-1-dev libudev-dev \
            libjson-c-dev dbus python3

      - name: Apply, verify, and commit complete ABI
        id: verify
        continue-on-error: true
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          exec > >(tee /tmp/rustd-full-abi-v2.log) 2>&1
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          base_sha="$(git rev-parse HEAD)"

          python3 - <<'PY'
          from pathlib import Path

          def remove_function(text: str, signature: str) -> str:
              position = text.find(signature + "(")
              if position < 0:
                  return text
              start = text.rfind("\n", 0, position) + 1
              brace = text.find("{", position)
              if brace < 0:
                  raise SystemExit(f"opening brace is missing for {signature}")
              depth = 1
              cursor = brace + 1
              while cursor < len(text) and depth:
                  if text[cursor] == "{":
                      depth += 1
                  elif text[cursor] == "}":
                      depth -= 1
                  cursor += 1
              if depth:
                  raise SystemExit(f"unbalanced body for {signature}")
              while cursor < len(text) and text[cursor] in " \t\r\n":
                  cursor += 1
              return text[:start] + text[cursor:]

          json_impl = Path("libs/compat/sd_json_varlink_impl.c")
          text = json_impl.read_text()
          old_headers = "#include <systemd/sd-json.h>\n#include <systemd/sd-varlink.h>\n"
          new_headers = '#include "sd_json_varlink_abi.h"\n'
          if old_headers in text:
              text = text.replace(old_headers, new_headers, 1)
          elif new_headers not in text:
              raise SystemExit("owned JSON/Varlink ABI include is missing")
          json_impl.write_text(text)

          systemd = Path("libs/compat/systemd.c")
          text = systemd.read_text()
          for signature in (
              "int sd_journal_send",
              "int sd_journal_send_with_location",
              "int sd_journal_print_with_location",
          ):
              text = remove_function(text, signature)
          systemd.write_text(text)

          makefile = Path("Makefile")
          text = makefile.read_text()
          start = text.index("$(LIBS_DIR)/libsystemd.so.0:")
          end = text.index("\n$(LIBS_DIR)/librustd_service.so.1:", start)
          target = '''$(LIBS_DIR)/libsystemd.so.0: libs/compat/systemd.c libs/compat/sd_bus_impl.c \\
\t\tlibs/compat/journal_send_impl.c libs/compat/sd_json_varlink_impl.c libs/compat/sd_varlink_idl_impl.c \\
\t\tlibs/maps/libsystemd.map include/rustd/service.h include/rustd/journal.h include/rustd/login.h include/rustd/device.h \\
\t\t$(LIBS_DIR)/librustd_service.so.1 $(LIBS_DIR)/librustd_journal.so.1 \\
\t\t$(LIBS_DIR)/librustd_login.so.1 $(LIBS_DIR)/librustd_device.so.1
\tmkdir -p $(LIBS_DIR)
\t$(CC) $(CFLAGS) -fPIC $(LIB_CPPFLAGS) $$(pkg-config --cflags dbus-1 json-c) -shared \\
\t\tlibs/compat/systemd.c libs/compat/sd_bus_impl.c libs/compat/journal_send_impl.c \\
\t\tlibs/compat/sd_json_varlink_impl.c libs/compat/sd_varlink_idl_impl.c \\
\t\t-Wl,--version-script=libs/maps/libsystemd.map \\
\t\t-Wl,-soname,libsystemd.so.0 $(LIB_LDFLAGS) \\
\t\t-Wl,-rpath,'$$ORIGIN' -L$(LIBS_DIR) \\
\t\t-l:librustd_service.so.1 -l:librustd_journal.so.1 -l:librustd_login.so.1 -l:librustd_device.so.1 \\
\t\t$$(pkg-config --libs dbus-1 json-c) -o $@
'''
          if "libs/compat/sd_bus_stubs.c" in text[start:end]:
              text = text[:start] + target + text[end:]
          elif "libs/compat/sd_bus_impl.c" not in text[start:end]:
              raise SystemExit("libsystemd compatibility target is unexpected")
          makefile.write_text(text)

          closure = Path("scripts/check-compat-closure.py")
          text = closure.read_text()
          text = text.replace(
              'UNSUPPORTED_DATA_SYMBOLS = {"sd_bus_object_vtable_format"}',
              "UNSUPPORTED_DATA_SYMBOLS = set()",
              1,
          )
          semantic_start = text.index("SEMANTIC_PLACEHOLDERS = ")
          semantic_end = text.index("\n\n", semantic_start)
          text = text[:semantic_start] + "SEMANTIC_PLACEHOLDERS = set()" + text[semantic_end:]
          old_loop = '''    for relative in (
              Path("libs/compat/systemd.c"),
              STUB_SOURCE,
              Path("libs/compat/udev.c"),
          ):'''
          new_loop = '''    for relative in (
              Path("libs/compat/systemd.c"),
              Path("libs/compat/sd_bus_impl.c"),
              Path("libs/compat/journal_send_impl.c"),
              Path("libs/compat/sd_json_varlink_impl.c"),
              Path("libs/compat/sd_varlink_idl_impl.c"),
              Path("libs/compat/udev.c"),
          ):'''
          if old_loop in text:
              text = text.replace(old_loop, new_loop, 1)
          elif 'Path("libs/compat/sd_bus_impl.c")' not in text:
              raise SystemExit("compatibility classifier source loop is unexpected")
          stub_block = '''            if relative == STUB_SOURCE and name not in SUPPORTED_STUB_FUNCTIONS:
                  unsupported.add(name)
                  continue
          '''
          text = text.replace(stub_block, "", 1)
          closure.write_text(text)

          readiness = Path("scripts/check-compat-source-readiness.py")
          text = readiness.read_text()
          old_loop = '''    for relative in (
              Path("libs/compat/systemd.c"),
              Path("libs/compat/sd_bus_stubs.c"),
              Path("libs/compat/udev.c"),
          ):'''
          new_loop = '''    for relative in (
              Path("libs/compat/systemd.c"),
              Path("libs/compat/sd_bus_impl.c"),
              Path("libs/compat/journal_send_impl.c"),
              Path("libs/compat/sd_json_varlink_impl.c"),
              Path("libs/compat/sd_varlink_idl_impl.c"),
              Path("libs/compat/udev.c"),
          ):'''
          if old_loop in text:
              text = text.replace(old_loop, new_loop, 1)
          elif 'Path("libs/compat/sd_bus_impl.c")' not in text:
              raise SystemExit("source-readiness source loop is unexpected")
          readiness.write_text(text)
          PY

          git diff --check
          cc -std=c17 -Wall -Wextra -Werror -Ilibs/compat -Iinclude \
            $(pkg-config --cflags dbus-1) \
            libs/tests/test_sd_bus_impl.c libs/compat/sd_bus_impl.c \
            $(pkg-config --libs dbus-1) -o /tmp/test-sd-bus
          dbus-run-session -- /tmp/test-sd-bus

          cc -std=c17 -Wall -Wextra -Werror -Ilibs/compat \
            $(pkg-config --cflags json-c) \
            libs/tests/test_sd_json_varlink_impl.c libs/compat/sd_json_varlink_impl.c \
            $(pkg-config --libs json-c) -o /tmp/test-json-varlink
          /tmp/test-json-varlink

          cc -std=c17 -Wall -Wextra -Werror -Ilibs/compat \
            libs/tests/test_sd_varlink_idl_impl.c libs/compat/sd_varlink_idl_impl.c \
            -o /tmp/test-varlink-idl
          /tmp/test-varlink-idl

          cc -std=c17 -Wall -Wextra -Werror -Iinclude \
            libs/tests/test_journal_send_impl.c libs/compat/journal_send_impl.c \
            -o /tmp/test-journal-send
          /tmp/test-journal-send

          cc -std=c17 -Wall -Wextra -Werror -Iinclude \
            libs/tests/test_journal_filters.c libs/journal/journal.c \
            -o /tmp/test-journal-filters
          /tmp/test-journal-filters

          make clean
          make check-compat
          python3 scripts/check-compat-source-readiness.py \
            --report target/compat-readiness.json --require-complete
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("target/compat-readiness.json").read_text())
          expected = {
              "required": 184,
              "supported": 184,
              "unsupported": 0,
              "missing_source_definition": 0,
          }
          for key, value in expected.items():
              if report.get(key) != value:
                  raise SystemExit(report)
          production = (
              Path("libs/compat/systemd.c"),
              Path("libs/compat/sd_bus_impl.c"),
              Path("libs/compat/journal_send_impl.c"),
              Path("libs/compat/sd_json_varlink_impl.c"),
              Path("libs/compat/sd_varlink_idl_impl.c"),
              Path("libs/compat/udev.c"),
          )
          for path in production:
              if "<systemd/" in path.read_text():
                  raise SystemExit(f"systemd development header remains in {path}")
          PY
          ! readelf -d build/libs/libsystemd.so.0 | grep -F 'Shared library: [libsystemd'
          ! grep -R -n --include='*.c' --include='*.h' \
            '#include <systemd/' libs/compat include/rustd

          mkdir -p certification
          python3 - "$base_sha" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path("target/compat-readiness.json").read_text())
          report["schema"] = "rustd-source-readiness-v2"
          report["tested_base_sha"] = sys.argv[1]
          report["production_engine"] = "native-real-implementations"
          Path("certification/source-readiness-latest.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          PY
          cat > certification/final-abi-closure-latest.txt <<EOF
          schema=rustd-final-abi-closure-v2
          status=pass
          tested_base_sha=$base_sha
          required=184
          supported=184
          unsupported=0
          missing=0
          systemd_headers=none
          systemd_runtime_link=none
          sd_bus_engine=real
          journal_engine=real
          json_varlink_engine=real
          EOF
          rm -f \
            .github/workflows/final-abi-closure.yml \
            .github/workflows/run-final-abi-closure.yml \
            .github/workflows/land-full-abi-v2.yml \
            certification/final-abi-closure-diagnostic.txt
          git add -A
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Close RustD compatibility ABI'
          git pull --rebase origin main
          make check-compat
          git push origin HEAD:main

      - name: Publish ABI failure diagnostic
        if: steps.verify.outcome != 'success'
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          git reset --hard HEAD
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p certification
          {
            printf 'schema=rustd-final-abi-diagnostic-v11\n'
            printf 'status=failure\n'
            printf 'tested_sha=%s\n' "$GITHUB_SHA"
            printf '%s\n' '--- tail ---'
            tail -n 800 /tmp/rustd-full-abi-v2.log || true
          } > certification/final-abi-closure-diagnostic.txt
          git add certification/final-abi-closure-diagnostic.txt
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Record final ABI closure diagnostic'
          git push origin HEAD:main
          exit 1
