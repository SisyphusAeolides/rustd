name: Land RustD full cutover compatibility install

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/land-cutover-compat-install.yml

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Patch cutover install policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          m = Path('Makefile')
          s = m.read_text()
          phony = '.PHONY: all build pam-module libs compat check-libs check-compat check-compat-closure test check-native check-rust check-formal check-packaging check-reproducible clean install release boot-smoke certify installed-certification performance-promotion\n'
          replacement = '.PHONY: all build pam-module libs compat check-libs check-compat check-compat-closure check-compat-installed test check-native check-rust check-formal check-packaging check-reproducible clean install install-compat install-cutover release boot-smoke certify installed-certification performance-promotion\n'
          if phony in s:
              s = s.replace(phony, replacement, 1)
          elif replacement not in s:
              raise SystemExit('Makefile PHONY preimage missing')

          s = s.replace(
              'bash -n scripts/boot-smoke.sh scripts/install-rustd-names.sh scripts/check-reproducible-release.sh scripts/installed-certification.sh scripts/performance-promotion.sh scripts/exclusive-cutover-gate.sh scripts/ci-pid1-initramfs.sh scripts/check-native-libs.sh',
              'bash -n scripts/boot-smoke.sh scripts/install-rustd-names.sh scripts/check-reproducible-release.sh scripts/installed-certification.sh scripts/performance-promotion.sh scripts/exclusive-cutover-gate.sh scripts/ci-pid1-initramfs.sh scripts/check-native-libs.sh scripts/check-compat-libs.sh')

          marker = '\nclean:\n\trm -rf build $(TARGET_DIR)\n'
          block = r'''
check-compat-installed:
	@test -n "$(DESTDIR)" && test "$(DESTDIR)" != "/" || (echo "DESTDIR must name a non-root staging directory" >&2; exit 64)
	bash scripts/check-compat-libs.sh "$(DESTDIR)$(PREFIX)"

install-compat: compat
	@test -n "$(DESTDIR)" && test "$(DESTDIR)" != "/" || (echo "DESTDIR must name a non-root staging directory" >&2; exit 64)
	python3 scripts/check-compat-source-readiness.py --report target/compat-readiness.json --require-complete
	install -Dm0755 "$(LIBS_DIR)/libsystemd.so.0" "$(DESTDIR)$(LIBDIR)/libsystemd.so.0"
	install -Dm0755 "$(LIBS_DIR)/libudev.so.1" "$(DESTDIR)$(LIBDIR)/libudev.so.1"
	bash scripts/check-compat-libs.sh "$(DESTDIR)$(PREFIX)"

install-cutover: install install-compat
	@echo "RustD cutover image includes RustD-native services and certified compatibility SONAMEs"

clean:
	rm -rf build $(TARGET_DIR)
'''
          if 'install-cutover: install install-compat' not in s:
              if marker not in s:
                  raise SystemExit('Makefile clean marker missing')
              s = s.replace(marker, '\n' + block, 1)
          m.write_text(s)

          p = Path('scripts/exclusive-cutover-gate.sh')
          s = p.read_text()
          old = '''if package_installed_exactly systemd-libs; then\n    pass "systemd-libs retained for certified third-party client ABI"\nelse\n    fail "systemd-libs missing before rustd-compat full ABI promotion"\nfi'''
          new = '''if package_installed_exactly systemd-libs; then\n    fail "systemd-libs package still installed after RustD compatibility ABI promotion"\nelse\n    pass "systemd-libs package absent"\nfi'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('systemd-libs cutover block missing')

          old = '''# Until the preview shims cover the complete host ABI, the compatibility\n# SONAMEs must remain owned by systemd-libs.\nfor shim in /usr/lib/libsystemd.so.0 /usr/lib/libudev.so.1; do\n    if [[ ! -e "${ROOT%/}$shim" ]]; then\n        fail "missing compatibility shim: $shim"\n    elif pacman_query -Qo "${ROOT%/}$shim" 2>/dev/null | grep -Fq systemd-libs; then\n        pass "$shim owned by retained systemd-libs"\n    else\n        fail "$shim must be owned by retained systemd-libs"\n    fi\ndone'''
          new = '''# Full cutover requires the compatibility SONAMEs to be supplied by RustD,\n# not by the removed systemd-libs package.\nfor shim in /usr/lib/libsystemd.so.0 /usr/lib/libudev.so.1; do\n    if [[ ! -e "${ROOT%/}$shim" ]]; then\n        fail "missing RustD compatibility SONAME: $shim"\n        continue\n    fi\n    owner="$(pacman_query -Qo "${ROOT%/}$shim" 2>/dev/null || true)"\n    if grep -Fq systemd-libs <<<"$owner"; then\n        fail "$shim is still owned by systemd-libs"\n    elif grep -Eq '(^|[[:space:]])rustd(-compat-libs)?([[:space:]]|$)' <<<"$owner"; then\n        pass "$shim owned by RustD compatibility package"\n    else\n        fail "$shim must be package-owned by rustd or rustd-compat-libs"\n    fi\ndone'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('compat SONAME ownership block missing')
          p.write_text(s)
          PY
          bash -n scripts/check-compat-libs.sh scripts/exclusive-cutover-gate.sh
          make -n DESTDIR=/tmp/rustd-cutover install-cutover >/dev/null
          git diff --check
          git fetch origin main
          git rebase origin/main
          rm -f .github/workflows/land-cutover-compat-install.yml
          git add -A Makefile scripts/check-compat-libs.sh scripts/exclusive-cutover-gate.sh .github/workflows/land-cutover-compat-install.yml
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Enable full systemd-libs cutover'
          git push origin HEAD:main
