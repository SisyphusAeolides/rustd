name: Diagnose sd-bus dispatch filter bridge
# trigger

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-sd-bus-dispatch-filter.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install runner dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libdbus-1-dev libsystemd-dev dbus python3-yaml
      - name: Execute canonical sd-bus bridge transaction
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          data=yaml.safe_load(Path('.github/workflows/fix-sd-bus-dispatch-filter.yml').read_text())
          step=next(x for x in data['jobs']['fix']['steps'] if x.get('name') == 'Patch and certify dispatch bridge')
          Path('/tmp/sd-bus-bridge-step.sh').write_text(step['run'])
          PY
          set +e
          bash /tmp/sd-bus-bridge-step.sh > /tmp/sd-bus-bridge.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p certification
          {
            printf 'schema=rustd-sd-bus-bridge-diagnostic-v1\nstatus=failure\ntested_sha=%s\nrc=%s\n' "$GITHUB_SHA" "$rc"
            printf '%s\n' '--- tail ---'
            tail -n 200 /tmp/sd-bus-bridge.log
          } > certification/sd-bus-bridge-diagnostic.txt
          git add certification/sd-bus-bridge-diagnostic.txt
          git config user.name 'Kenny Glauner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Record sd-bus bridge diagnostic'
          git push origin HEAD:main
          exit "$rc"
