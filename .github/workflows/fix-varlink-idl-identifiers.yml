name: Fix Varlink IDL exported identifiers

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-varlink-idl-identifiers.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Patch and certify grammar
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('libs/compat/sd_varlink_idl_impl.c')
          s=p.read_text()
          old='''    length = p->pos - start;\n    if (p->text[p->pos - 1U] == '_')\n        return parser_fail(p);\n    for (size_t i = start; i + 1U < p->pos; ++i)\n        if (p->text[i] == '_' && p->text[i + 1U] == '_')\n            return parser_fail(p);\n'''
          new='''    length = p->pos - start;\n    if (upper) {\n        for (size_t i = start; i < p->pos; ++i)\n            if (p->text[i] == '_')\n                return parser_fail(p);\n    } else {\n        if (p->text[p->pos - 1U] == '_')\n            return parser_fail(p);\n        for (size_t i = start; i + 1U < p->pos; ++i)\n            if (p->text[i] == '_' && p->text[i + 1U] == '_')\n                return parser_fail(p);\n    }\n'''
          if old not in s: raise SystemExit('identifier validation preimage missing')
          p.write_text(s.replace(old,new,1))
          h=Path('libs/compat/sd_json_varlink_abi.h')
          hs=h.read_text()
          anchor='''int sd_varlink_collect(sd_varlink *v, const char *method, sd_json_variant *parameters,\n                       sd_json_variant **ret_parameters, const char **ret_error_id);\n'''
          if 'int sd_varlink_idl_parse(' not in hs:
              hs=hs.replace(anchor, anchor+'''int sd_varlink_idl_parse(const char *text, unsigned *reterr_line,\n                         unsigned *reterr_column, sd_varlink_interface **ret);\nsd_varlink_interface *sd_varlink_interface_free(sd_varlink_interface *interface);\n''',1)
          h.write_text(hs)
          PY
          cc -std=c17 -Wall -Wextra -Werror -Ilibs/compat \
            libs/tests/test_sd_varlink_idl_impl.c libs/compat/sd_varlink_idl_impl.c \
            -o /tmp/test-varlink-idl
          /tmp/test-varlink-idl
          mkdir -p certification
          printf 'schema=rustd-varlink-idl-v1\nstatus=pass\ntested_sha=%s\nbehavior_outcome=success\ngrammar=varlink-official\n' "$GITHUB_SHA" > certification/varlink-idl-latest.txt
          rm -f certification/varlink-idl-diagnostic.txt .github/workflows/fix-varlink-idl-identifiers.yml .github/workflows/diagnose-varlink-idl-now.yml
          git add -A libs/compat/sd_varlink_idl_impl.c libs/compat/sd_json_varlink_abi.h certification .github/workflows/fix-varlink-idl-identifiers.yml .github/workflows/diagnose-varlink-idl-now.yml
          git diff --cached --check
          git config user.name 'Kenny Glauner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Fix Varlink IDL exported identifier grammar'
          git push origin HEAD:main
