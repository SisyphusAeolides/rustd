name: Fedora 44 full VM zero-systemd certification

on:
  push:
    branches: [main]
    paths:
      - certification/final-abi-closure-latest.txt
      - scripts/rustd-resolved-revision.txt
      - scripts/build-fedora-rpms.sh
      - scripts/fedora-cutover-gate.sh
      - scripts/fedora-vm-guest-cutover.sh
      - scripts/audit-systemd-elf-consumers.py
      - scripts/check-compat-closure.py
      - src/bin/rustd-boot-check-no-failures.rs
      - src/bin/rustd-udevd.rs
      - dist/fedora/**
      - .github/workflows/fedora-full-vm-certification.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fedora-44-full-vm-cutover
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FEDORA_RELEASE: '44'
      FEDORA_BUILD: '1.7'
      FEDORA_IMAGE: Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2
      FEDORA_IMAGE_SHA256: 28680fe5b371a5a82ebf43a31926e086a168e59949d03969c5093e7071f90b7f
      SSH_PORT: '2222'
    steps:
      - name: Check out RustD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out RustD-Resolved
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SisyphusAeolides/rustd-resolved
          path: rustd-resolved
          fetch-depth: 0

      - name: Bind resolver checkout to RustD pin
        shell: bash
        run: |
          set -euo pipefail
          pinned="$(tr -d '[:space:]' < scripts/rustd-resolved-revision.txt)"
          [[ $pinned =~ ^[0-9a-f]{40}$ ]]
          git -C rustd-resolved fetch origin "$pinned"
          git -C rustd-resolved checkout --detach "$pinned"
          test "$(git -C rustd-resolved rev-parse HEAD)" = "$pinned"
          printf '/rustd-resolved/\n' >> .git/info/exclude

      - name: Install VM host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cloud-image-utils curl openssh-client qemu-system-x86 qemu-utils socat
          qemu-system-x86_64 --version
          qemu-img --version

      - name: Build exact Fedora RPM set in Fedora 44
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            fedora:44 \
            bash -lc '
              set -euo pipefail
              dnf -y install \
                git-core findutils make rpm-build rpmdevtools createrepo_c dnf-plugins-core \
                selinux-policy selinux-policy-devel policycoreutils-devel bzip2 \
                gcc gcc-gfortran libasan libubsan python3 cargo rust rustfmt clippy pkgconf-pkg-config \
                dbus-devel dbus-daemon pam-devel json-c-devel openssl openssl-devel liburing-devel \
                tar gzip systemd systemd-libs systemd-udev
              git config --global --add safe.directory /work
              git config --global --add safe.directory /work/rustd-resolved
              RUSTD_RESOLVED_SOURCE_ROOT=/work/rustd-resolved scripts/build-fedora-rpms.sh
              manager_evr="$(sed -n "s/^systemd_reference_evr=//p" target/fedora-rpms/manifest.txt)"
              libs_evr="$(sed -n "s/^systemd_libraries_reference_evr=//p" target/fedora-rpms/manifest.txt)"
              udev_evr="$(sed -n "s/^systemd_udev_reference_evr=//p" target/fedora-rpms/manifest.txt)"
              test -n "$manager_evr"
              test "$manager_evr" = "$libs_evr"
              test "$manager_evr" = "$udev_evr"
              compat="$(find target/fedora-rpms -maxdepth 1 -type f -name "rustd-fedora-compat-*.rpm" ! -name "*-debug*" ! -name "*.src.rpm" | sort | head -n1)"
              libs="$(find target/fedora-rpms -maxdepth 1 -type f -name "rustd-compat-libs-*.rpm" ! -name "*-debug*" ! -name "*.src.rpm" | sort | head -n1)"
              test -n "$compat" -a -n "$libs"
              rpm -qp --provides "$compat" | grep -Fxq "systemd = $manager_evr"
              rpm -qp --provides "$compat" | grep -Fxq "systemd-udev = $udev_evr"
              rpm -qp --provides "$libs" | grep -Fxq "systemd-libs = $libs_evr"
            '
          test -s target/fedora-rpms/manifest.txt
          grep -Fxq "rustd_sha=$(git rev-parse HEAD)" target/fedora-rpms/manifest.txt
          grep -Fxq "resolved_sha=$(tr -d '[:space:]' < scripts/rustd-resolved-revision.txt)" target/fedora-rpms/manifest.txt
          ls -lh target/fedora-rpms/*.rpm

      - name: Record source ABI closure state
        id: abi
        shell: bash
        run: |
          set -euo pipefail
          if [[ -r certification/final-abi-closure-latest.txt ]] \
             && scripts/check-voucher-source-equivalence.sh certification/final-abi-closure-latest.txt "$GITHUB_SHA" \
             && grep -Fxq 'status=pass' certification/final-abi-closure-latest.txt \
             && grep -Fxq 'required=338' certification/final-abi-closure-latest.txt \
             && grep -Fxq 'supported=338' certification/final-abi-closure-latest.txt \
             && grep -Fxq 'unsupported=0' certification/final-abi-closure-latest.txt \
             && grep -Fxq 'systemd_headers=none' certification/final-abi-closure-latest.txt \
             && grep -Fxq 'systemd_runtime_link=none' certification/final-abi-closure-latest.txt; then
            echo 'closed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'closed=false' >> "$GITHUB_OUTPUT"
            echo 'ABI closure is not yet release-green.'
          fi

      - name: Download and verify Fedora Cloud image
        shell: bash
        run: |
          set -euo pipefail
          url="https://download.fedoraproject.org/pub/fedora/linux/releases/${FEDORA_RELEASE}/Cloud/x86_64/images/${FEDORA_IMAGE}"
          curl --fail --location --retry 5 --retry-delay 3 --output "$RUNNER_TEMP/$FEDORA_IMAGE" "$url"
          printf '%s  %s\n' "$FEDORA_IMAGE_SHA256" "$RUNNER_TEMP/$FEDORA_IMAGE" | sha256sum --check --strict
          qemu-img info "$RUNNER_TEMP/$FEDORA_IMAGE"
          cp --reflink=auto "$RUNNER_TEMP/$FEDORA_IMAGE" "$RUNNER_TEMP/fedora-rustd.qcow2"
          qemu-img resize "$RUNNER_TEMP/fedora-rustd.qcow2" +4G

      - name: Create ephemeral cloud-init access
        shell: bash
        run: |
          set -euo pipefail
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/rustd-ci-key"
          pubkey="$(cat "$RUNNER_TEMP/rustd-ci-key.pub")"
          cat > "$RUNNER_TEMP/user-data" <<EOF
          #cloud-config
          users:
            - name: rustdci
              groups: [wheel]
              shell: /bin/bash
              sudo: ['ALL=(ALL) NOPASSWD:ALL']
              ssh_authorized_keys:
                - ${pubkey}
          ssh_pwauth: false
          disable_root: true
          growpart:
            mode: auto
            devices: ['/']
          resize_rootfs: true
          runcmd:
            - [sh, -c, 'touch /var/tmp/rustd-cloud-ready']
          EOF
          cat > "$RUNNER_TEMP/meta-data" <<'EOF'
          instance-id: rustd-fedora-44-ci
          local-hostname: rustd-fedora-ci
          EOF
          cloud-localds "$RUNNER_TEMP/seed.img" "$RUNNER_TEMP/user-data" "$RUNNER_TEMP/meta-data"

      - name: Stage destructive cutover in a real Fedora guest
        shell: bash
        run: |
          set -euo pipefail
          serial="$RUNNER_TEMP/fedora-precutover-serial.log"
          monitor="$RUNNER_TEMP/fedora-precutover-monitor.sock"
          rm -f "$monitor"
          if [[ -c /dev/kvm && -r /dev/kvm && -w /dev/kvm ]]; then
            accel=kvm
            cpu=host
          else
            accel=tcg
            cpu=max
          fi
          qemu-system-x86_64 \
            -machine "q35,accel=$accel" \
            -cpu "$cpu" \
            -smp 2 \
            -m 4096 \
            -drive "file=$RUNNER_TEMP/fedora-rustd.qcow2,if=virtio,format=qcow2,cache=writeback" \
            -drive "file=$RUNNER_TEMP/seed.img,if=virtio,format=raw,readonly=on" \
            -netdev "user,id=net0,hostfwd=tcp:127.0.0.1:${SSH_PORT}-:22" \
            -device virtio-net-pci,netdev=net0 \
            -display none \
            -serial "file:$serial" \
            -monitor "unix:$monitor,server,nowait" &
          qemu_pid=$!

          ssh_cmd=(ssh -i "$RUNNER_TEMP/rustd-ci-key" -p "$SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=5 rustdci@127.0.0.1)
          ready=0
          for _ in $(seq 1 180); do
            if "${ssh_cmd[@]}" 'test -e /var/tmp/rustd-cloud-ready' >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              echo 'Fedora guest exited before SSH became ready' >&2
              tail -n 240 "$serial" >&2 || true
              exit 1
            fi
            sleep 2
          done
          [[ $ready == 1 ]] || { tail -n 240 "$serial" >&2 || true; exit 1; }

          "${ssh_cmd[@]}" 'set -e; cat /etc/fedora-release; test "$(cat /proc/1/comm)" = systemd; test "$(getenforce)" = Enforcing; dnf --version | head -n1; df -h /'
          "${ssh_cmd[@]}" 'sudo mkdir -p /var/tmp/rustd-rpms && sudo chown rustdci:rustdci /var/tmp/rustd-rpms'
          tar -C target/fedora-rpms -cf - . | "${ssh_cmd[@]}" 'tar -C /var/tmp/rustd-rpms -xf -'
          tar -cf - scripts/audit-systemd-elf-consumers.py scripts/check-compat-closure.py \
            | "${ssh_cmd[@]}" 'sudo tar -C /var/tmp -xf -'
          tar -cf - libs/compat/systemd.c libs/compat/journal_send_impl.c \
            libs/compat/sd_bus_impl.c libs/compat/sd_json_varlink_impl.c \
            libs/compat/sd_varlink_idl_impl.c libs/compat/udev.c \
            | "${ssh_cmd[@]}" 'sudo mkdir -p /var/tmp/rustd-source && sudo tar -C /var/tmp/rustd-source -xf -'
          cat scripts/fedora-vm-guest-cutover.sh | "${ssh_cmd[@]}" 'sudo bash -s'
          "${ssh_cmd[@]}" 'cat /var/tmp/rustd-initrd-modules.txt' > "$RUNNER_TEMP/rustd-initrd-modules.txt"
          "${ssh_cmd[@]}" 'grep -E "systemd-udevd|usr/lib/rustd/rustd-udevd" /var/tmp/rustd-lsinitrd.txt || true' > "$RUNNER_TEMP/rustd-initrd-udev.txt"
          "${ssh_cmd[@]}" 'sudo sync'

          # The old PID 1 is still resident from the pre-cutover boot, but its
          # package tree has intentionally been erased. Terminate QEMU only
          # after sync so the next launch is a genuine cold boot of the new
          # RustD-only filesystem rather than relying on removed shutdown code.
          printf 'quit\n' | socat - "UNIX-CONNECT:$monitor"
          for _ in $(seq 1 30); do
            kill -0 "$qemu_pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$qemu_pid" 2>/dev/null; then
            echo 'QEMU did not stop after monitor quit' >&2
            kill "$qemu_pid" || true
            exit 1
          fi
          wait "$qemu_pid" || true

      - name: Cold boot converted Fedora three times
        shell: bash
        run: |
          set -euo pipefail
          if [[ -c /dev/kvm && -r /dev/kvm && -w /dev/kvm ]]; then
            accel=kvm
            cpu=host
          else
            accel=tcg
            cpu=max
          fi
          ssh_cmd=(ssh -i "$RUNNER_TEMP/rustd-ci-key" -p "$SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=5 rustdci@127.0.0.1)

          for attempt in 1 2 3; do
            serial="$RUNNER_TEMP/fedora-rustd-boot-${attempt}.log"
            monitor="$RUNNER_TEMP/fedora-rustd-monitor-${attempt}.sock"
            rm -f "$monitor"
            qemu-system-x86_64 \
              -machine "q35,accel=$accel" \
              -cpu "$cpu" \
              -smp 2 \
              -m 4096 \
              -drive "file=$RUNNER_TEMP/fedora-rustd.qcow2,if=virtio,format=qcow2,cache=writeback" \
              -drive "file=$RUNNER_TEMP/seed.img,if=virtio,format=raw,readonly=on" \
              -netdev "user,id=net0,hostfwd=tcp:127.0.0.1:${SSH_PORT}-:22" \
              -device virtio-net-pci,netdev=net0 \
              -display none \
              -serial "file:$serial" \
              -monitor "unix:$monitor,server,nowait" &
            qemu_pid=$!

            ready=0
            for _ in $(seq 1 180); do
              if "${ssh_cmd[@]}" 'true' >/dev/null 2>&1; then
                ready=1
                break
              fi
              if ! kill -0 "$qemu_pid" 2>/dev/null; then
                echo "converted Fedora boot $attempt exited before SSH" >&2
                tail -n 300 "$serial" >&2 || true
                exit 1
              fi
              sleep 2
            done
            [[ $ready == 1 ]] || { tail -n 300 "$serial" >&2 || true; kill "$qemu_pid" || true; exit 1; }

            "${ssh_cmd[@]}" 'set -euo pipefail; test "$(sudo readlink -f /proc/1/exe)" = /usr/lib/rustd/rustd; test "$(getenforce)" = Enforcing; sudo dnf -q check; authselect check >/dev/null; if rpm -qa --qf "%{NAME}\n" | grep -Eq "^systemd($|-)"; then exit 1; fi; ! grep -Eq "^[[:alpha:]_][[:alnum:]_-]*:.*[[:space:]](myhostname|resolve|systemd)([[:space:]]|$)" /etc/nsswitch.conf; ! grep -R -E -q "pam_systemd(_home|_loadkey)?\\.so" /etc/pam.d; rustctl --quiet is-active dbus.service; rustctl --quiet is-active NetworkManager.service; rustctl --quiet is-active sshd.service; rustctl --quiet is-active rustd-resolved.service; rustctl --quiet is-active multi-user.target; sudo /usr/lib/rustd/rustd-boot-check-no-failures; getent hosts localhost >/dev/null; getent ahosts fedoraproject.org >/dev/null; rustd-resolvectl status >/dev/null; sudo dnf -q makecache'

            if [[ $attempt -eq 1 ]]; then
              "${ssh_cmd[@]}" 'set -euo pipefail; test "$(rpm -qf --qf "%{NAME}\n" /usr/bin/systemctl)" = rustd-fedora-compat; test "$(rpm -qf --qf "%{NAME}\n" /usr/lib/udev/rules.d/50-rustd-default.rules)" = rustd-fedora-compat; test "$(readlink -f /usr/lib/systemd/systemd-udevd)" = /usr/lib/rustd/rustd-udevd; systemctl is-active sshd.service >/dev/null; udevadm settle --timeout=30; test "$(stat -c %a /dev/null)" = 666; test "$(stat -c %a /dev/zero)" = 666; test "$(stat -c %a /dev/random)" = 666; rustctl list-units >/dev/null; ! ps -eo exe= | grep -E "^/usr/lib/systemd/(systemd|systemd-journald|systemd-resolved)$"'
            fi

            "${ssh_cmd[@]}" 'sudo rustctl poweroff'
            for _ in $(seq 1 120); do
              kill -0 "$qemu_pid" 2>/dev/null || break
              sleep 1
            done
            if kill -0 "$qemu_pid" 2>/dev/null; then
              echo "RustD poweroff failed on Fedora boot $attempt" >&2
              tail -n 300 "$serial" >&2 || true
              kill "$qemu_pid" || true
              exit 1
            fi
            wait "$qemu_pid" || true
          done

      - name: Require complete source ABI closure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.abi.outputs.closed }}' = true

      - name: Upload Fedora VM certificate logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fedora-44-full-vm-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fedora-precutover-serial.log
            ${{ runner.temp }}/fedora-rustd-boot-*.log
            ${{ runner.temp }}/rustd-initrd-modules.txt
            ${{ runner.temp }}/rustd-initrd-udev.txt
            target/fedora-rpms/manifest.txt
          if-no-files-found: warn
          retention-days: 14
