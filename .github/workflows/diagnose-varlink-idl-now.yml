name: Diagnose Varlink IDL compatibility

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-varlink-idl-now.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Compile and test parser
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          from pathlib import Path
          h=Path('libs/compat/sd_json_varlink_abi.h')
          s=h.read_text()
          anchor='''int sd_varlink_collect(sd_varlink *v, const char *method, sd_json_variant *parameters,\n                       sd_json_variant **ret_parameters, const char **ret_error_id);\n'''
          addition=anchor+'''int sd_varlink_idl_parse(const char *text, unsigned *reterr_line,\n                         unsigned *reterr_column, sd_varlink_interface **ret);\nsd_varlink_interface *sd_varlink_interface_free(sd_varlink_interface *interface);\n'''
          if 'int sd_varlink_idl_parse(' not in s:
              if anchor not in s: raise SystemExit('ABI insertion anchor missing')
              s=s.replace(anchor,addition,1)
          h.write_text(s)
          PY
          set +e
          {
            cc -std=c17 -Wall -Wextra -Werror -Ilibs/compat \
              libs/tests/test_sd_varlink_idl_impl.c libs/compat/sd_varlink_idl_impl.c \
              -o /tmp/test-varlink-idl && /tmp/test-varlink-idl
          } > /tmp/varlink-idl.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            mkdir -p certification
            printf 'schema=rustd-varlink-idl-v1\nstatus=pass\ntested_sha=%s\nbehavior_outcome=success\ngrammar=varlink-official\n' "$GITHUB_SHA" > certification/varlink-idl-latest.txt
            rm -f certification/varlink-idl-diagnostic.txt
            git add libs/compat/sd_json_varlink_abi.h certification/varlink-idl-latest.txt certification/varlink-idl-diagnostic.txt
            git config user.name 'Kenny Glowner'
            git config user.email 'SisyphusAeolides@pm.me'
            git commit -m 'Certify Varlink IDL compatibility parser'
            git push origin HEAD:main
            exit 0
          fi
          git checkout -- libs/compat/sd_json_varlink_abi.h
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p certification
          { printf 'schema=rustd-varlink-idl-diagnostic-v1\nstatus=failure\ntested_sha=%s\nrc=%s\n--- tail ---\n' "$GITHUB_SHA" "$rc"; tail -n 200 /tmp/varlink-idl.log; } > certification/varlink-idl-diagnostic.txt
          git add certification/varlink-idl-diagnostic.txt
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Record Varlink IDL diagnostic'
          git push origin HEAD:main
          exit "$rc"
