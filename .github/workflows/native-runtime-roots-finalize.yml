name: RustD native runtime roots validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustd-native-runtime-roots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install validation toolchains
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gfortran
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.75.0 --profile minimal --component clippy

      - name: Validate finalized source
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable fmt --all -- --check
          git diff --check
          cargo +1.75.0 test --test rustd_runtime_identity --locked

      - name: Validate native ABI and packaging
        shell: bash
        run: |
          set -euo pipefail
          make check-native
          make check-packaging

      - name: Validate Rust 1.75 tree
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.75.0 check --all-targets --all-features --locked

      - name: Validate stable correctness
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable clippy --all-targets --all-features --locked -- \
            -D clippy::correctness -D clippy::suspicious -D clippy::perf
          cargo +stable test --all-targets --all-features --locked -- --test-threads=1
