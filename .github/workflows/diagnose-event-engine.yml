name: Diagnose event compatibility engine
# trigger

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-event-engine.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install runner dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gfortran libsystemd-dev libudev-dev python3-yaml
      - name: Execute canonical event landing transaction
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          data=yaml.safe_load(Path('.github/workflows/land-compat-event-engine-v2.yml').read_text())
          step=next(x for x in data['jobs']['land']['steps'] if x.get('name') == 'Apply and verify event compatibility engine')
          Path('/tmp/event-step.sh').write_text(step['run'])
          PY
          set +e
          bash /tmp/event-step.sh > /tmp/event-engine.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then exit 0; fi
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p certification
          {
            printf 'schema=rustd-event-engine-diagnostic-v1\nstatus=failure\ntested_sha=%s\nrc=%s\n' "$GITHUB_SHA" "$rc"
            printf '%s\n' '--- tail ---'
            tail -n 180 /tmp/event-engine.log
          } > certification/event-engine-diagnostic.txt
          git add certification/event-engine-diagnostic.txt
          git config user.name 'Kenny Glauner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Record event engine diagnostic'
          git push origin HEAD:main
          exit "$rc"
