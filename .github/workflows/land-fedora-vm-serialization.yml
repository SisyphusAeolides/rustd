name: Serialize Fedora VM certification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/land-fedora-vm-serialization.yml

permissions:
  contents: write

concurrency:
  group: land-fedora-vm-serialization-v2
  cancel-in-progress: true

jobs:
  land:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Make destructive certification non-cancelling
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/fedora-full-vm-certification.yml')
          text = path.read_text()
          old = '''concurrency:
            group: fedora-44-full-vm-cutover
            cancel-in-progress: true
          '''
          new = '''concurrency:
            group: fedora-44-full-vm-cutover
            cancel-in-progress: false
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Fedora VM concurrency block is missing')
          path.write_text(text)
          PY
          rm -f .github/workflows/land-fedora-vm-serialization.yml
          git fetch origin main
          git rebase --autostash origin/main
          git add -A .github/workflows/fedora-full-vm-certification.yml \
            .github/workflows/land-fedora-vm-serialization.yml
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Keep Fedora VM certification running'
          git push origin HEAD:main
