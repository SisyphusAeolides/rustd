name: Land production compatibility ABI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/land-production-abi.yml

permissions:
  contents: write

concurrency:
  group: land-production-compatibility-abi
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install native dependencies
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential gfortran pkg-config libdbus-1-dev libjson-c-dev \
            libpam0g-dev libssl-dev liburing-dev dbus python3
      - name: Integrate and certify production ABI
        id: verify
        continue-on-error: true
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          exec > >(tee /tmp/rustd-production-abi.log) 2>&1
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          base_sha="$(git rev-parse HEAD)"
          export BASE_SHA="$base_sha"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f"expected one source fragment in {path}: {old!r}")
                  file.write_text(text.replace(old, new, 1))
              elif new not in text:
                  raise SystemExit(f"source fragment missing in {path}: {old!r}")

          def remove_function(path: str, signature: str) -> None:
              file = Path(path)
              text = file.read_text()
              position = text.find(signature)
              if position < 0:
                  return
              start = text.rfind("\n", 0, position) + 1
              brace = text.find("{", position)
              if brace < 0:
                  raise SystemExit(f"opening brace missing for {signature}")
              depth = 1
              cursor = brace + 1
              while cursor < len(text) and depth:
                  if text[cursor] == "{":
                      depth += 1
                  elif text[cursor] == "}":
                      depth -= 1
                  cursor += 1
              if depth:
                  raise SystemExit(f"unbalanced body for {signature}")
              while cursor < len(text) and text[cursor] in " \t\r\n":
                  cursor += 1
              file.write_text(text[:start] + text[cursor:])

          replace_once(
              "libs/compat/sd_json_varlink_impl.c",
              "#include <systemd/sd-json.h>\n#include <systemd/sd-varlink.h>\n",
              "#include \"sd_json_varlink_abi.h\"\n",
          )

          for signature in (
              "int sd_journal_send(",
              "int sd_journal_send_with_location(",
              "int sd_journal_print_with_location(",
          ):
              remove_function("libs/compat/systemd.c", signature)

          makefile = Path("Makefile")
          text = makefile.read_text()
          start = text.index("$(LIBS_DIR)/libsystemd.so.0:")
          end = text.index("\n$(LIBS_DIR)/librustd_service.so.1:", start)
          target = '''$(LIBS_DIR)/libsystemd.so.0: libs/compat/systemd.c libs/compat/sd_bus_impl.c \\
\t\tlibs/compat/journal_send_impl.c libs/compat/sd_json_varlink_impl.c libs/compat/sd_varlink_idl_impl.c \\
\t\tlibs/compat/sd_bus_abi.h libs/compat/sd_json_varlink_abi.h libs/compat/sd_core_abi.h \\
\t\tlibs/maps/libsystemd.map include/rustd/service.h include/rustd/journal.h include/rustd/login.h include/rustd/device.h \\
\t\t$(LIBS_DIR)/librustd_service.so.1 $(LIBS_DIR)/librustd_journal.so.1 \\
\t\t$(LIBS_DIR)/librustd_login.so.1 $(LIBS_DIR)/librustd_device.so.1
\tmkdir -p $(LIBS_DIR)
\t$(CC) $(CFLAGS) -fPIC $(LIB_CPPFLAGS) $$(pkg-config --cflags dbus-1 json-c) -shared \\
\t\tlibs/compat/systemd.c libs/compat/sd_bus_impl.c libs/compat/journal_send_impl.c \\
\t\tlibs/compat/sd_json_varlink_impl.c libs/compat/sd_varlink_idl_impl.c \\
\t\t-Wl,--version-script=libs/maps/libsystemd.map \\
\t\t-Wl,-soname,libsystemd.so.0 $(LIB_LDFLAGS) \\
\t\t-Wl,-rpath,'$$ORIGIN' -L$(LIBS_DIR) \\
\t\t-l:librustd_service.so.1 -l:librustd_journal.so.1 -l:librustd_login.so.1 -l:librustd_device.so.1 \\
\t\t$$(pkg-config --libs dbus-1 json-c) -o $@
'''
          makefile.write_text(text[:start] + target + text[end:])

          closure = Path("scripts/check-compat-closure.py")
          text = closure.read_text()
          text = text.replace(
              'UNSUPPORTED_DATA_SYMBOLS = {"sd_bus_object_vtable_format"}',
              'UNSUPPORTED_DATA_SYMBOLS = set()',
          )
          begin = text.index("SEMANTIC_PLACEHOLDERS = {")
          finish = text.index("}\n\n", begin) + 2
          text = text[:begin] + "SEMANTIC_PLACEHOLDERS = set()\n" + text[finish:]
          old_loop = '''    for relative in (
        Path("libs/compat/systemd.c"),
        STUB_SOURCE,
        Path("libs/compat/udev.c"),
    ):'''
          new_loop = '''    for relative in (
        Path("libs/compat/systemd.c"),
        Path("libs/compat/sd_bus_impl.c"),
        Path("libs/compat/journal_send_impl.c"),
        Path("libs/compat/sd_json_varlink_impl.c"),
        Path("libs/compat/sd_varlink_idl_impl.c"),
        Path("libs/compat/udev.c"),
    ):'''
          if old_loop not in text:
              raise SystemExit("compatibility closure source loop preimage missing")
          text = text.replace(old_loop, new_loop, 1)
          text = text.replace(
              '''            if relative == STUB_SOURCE and name not in SUPPORTED_STUB_FUNCTIONS:
                unsupported.add(name)
                continue
''',
              "",
          )
          closure.write_text(text)

          readiness = Path("scripts/check-compat-source-readiness.py")
          text = readiness.read_text()
          old_loop = '''    for relative in (
        Path("libs/compat/systemd.c"),
        Path("libs/compat/sd_bus_stubs.c"),
        Path("libs/compat/udev.c"),
    ):'''
          new_loop = '''    for relative in (
        Path("libs/compat/systemd.c"),
        Path("libs/compat/sd_bus_impl.c"),
        Path("libs/compat/journal_send_impl.c"),
        Path("libs/compat/sd_json_varlink_impl.c"),
        Path("libs/compat/sd_varlink_idl_impl.c"),
        Path("libs/compat/udev.c"),
    ):'''
          if old_loop not in text:
              raise SystemExit("compatibility readiness source loop preimage missing")
          readiness.write_text(text.replace(old_loop, new_loop, 1))
          PY

          git diff --check
          cc -std=c17 -Wall -Wextra -Werror -Ilibs/compat -Iinclude \
            $(pkg-config --cflags dbus-1) libs/tests/test_sd_bus_impl.c \
            libs/compat/sd_bus_impl.c $(pkg-config --libs dbus-1) -o /tmp/test-sd-bus
          dbus-run-session -- /tmp/test-sd-bus
          cc -std=c17 -Wall -Wextra -Werror -Ilibs/compat \
            $(pkg-config --cflags json-c) libs/tests/test_sd_json_varlink_impl.c \
            libs/compat/sd_json_varlink_impl.c $(pkg-config --libs json-c) -o /tmp/test-json-varlink
          /tmp/test-json-varlink
          cc -std=c17 -Wall -Wextra -Werror -Ilibs/compat \
            libs/tests/test_sd_varlink_idl_impl.c libs/compat/sd_varlink_idl_impl.c \
            -o /tmp/test-varlink-idl
          /tmp/test-varlink-idl
          cc -std=c17 -Wall -Wextra -Werror -Iinclude \
            libs/tests/test_journal_send_impl.c libs/compat/journal_send_impl.c \
            -o /tmp/test-journal-send
          /tmp/test-journal-send
          cc -std=c17 -Wall -Wextra -Werror -Iinclude \
            libs/tests/test_journal_filters.c libs/journal/journal.c \
            -o /tmp/test-journal-filters
          /tmp/test-journal-filters

          make clean
          make check-compat
          make check-native
          make check-packaging
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --all-features --locked -- --test-threads=1
          python3 scripts/check-compat-source-readiness.py \
            --report target/compat-readiness.json --require-complete
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("target/compat-readiness.json").read_text())
          expected = {
              "required": 184,
              "supported": 184,
              "unsupported": 0,
              "missing_source_definition": 0,
          }
          for key, value in expected.items():
              if report.get(key) != value:
                  raise SystemExit(f"{key}={report.get(key)!r}, expected {value!r}")
          production = (
              "libs/compat/systemd.c",
              "libs/compat/sd_bus_impl.c",
              "libs/compat/journal_send_impl.c",
              "libs/compat/sd_json_varlink_impl.c",
              "libs/compat/sd_varlink_idl_impl.c",
              "libs/compat/udev.c",
          )
          for name in production:
              if "<systemd/" in Path(name).read_text():
                  raise SystemExit(f"systemd development header remains in {name}")
          PY
          ! readelf -d build/libs/libsystemd.so.0 | grep -F 'Shared library: [libsystemd'
          ! grep -R -n --include='*.c' --include='*.h' '#include <systemd/' \
            libs/compat include/rustd

          mkdir -p certification
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("target/compat-readiness.json").read_text())
          report.update({
              "schema": "rustd-release-closure-v2",
              "status": "pass",
              "tested_base_sha": os.environ["BASE_SHA"],
              "no_libsystemd_dependency": True,
              "no_systemd_headers": True,
          })
          Path("certification/release-closure-latest.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          Path("certification/final-abi-closure-latest.txt").write_text(
              "schema=rustd-final-abi-closure-v2\n"
              "status=pass\n"
              "required=184\n"
              "supported=184\n"
              "unsupported=0\n"
              "missing=0\n"
              "systemd_headers=none\n"
              "systemd_runtime_link=none\n"
          )
          PY
          rm -f \
            .github/workflows/final-abi-closure.yml \
            .github/workflows/land-production-abi.yml \
            certification/final-abi-closure-diagnostic.txt
          git add -A
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Close production compatibility ABI'
          git pull --rebase origin main
          make clean
          make check-compat
          git push origin HEAD:main
      - name: Publish ABI diagnostic
        if: steps.verify.outcome != 'success'
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          git reset --hard HEAD
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p certification
          {
            printf 'schema=rustd-production-abi-diagnostic-v1\n'
            printf 'status=failure\n'
            printf 'tested_sha=%s\n' "$GITHUB_SHA"
            printf '%s\n' '--- tail ---'
            tail -n 1200 /tmp/rustd-production-abi.log || true
          } > certification/final-abi-closure-diagnostic.txt
          git add certification/final-abi-closure-diagnostic.txt
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Record production ABI diagnostic'
          git push origin HEAD:main
          exit 1
