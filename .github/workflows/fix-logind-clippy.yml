name: Fix logind Clippy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-logind-clippy.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply exact login manager cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/bin/rustd-logind.rs")
          source = path.read_text()
          replacements = [
              ("use std::collections::HashMap;", "use std::collections::{HashMap, HashSet};", 1),
              ("""        let mut seats = HashMap::new();\n        for session in logind::sessions() {\n            seats.entry(session.seat.clone()).or_insert(());\n        }\n        seats\n            .into_keys()\n""", """        let mut seats = HashSet::new();\n        for session in logind::sessions() {\n            seats.insert(session.seat.clone());\n        }\n        seats\n            .into_iter()\n""", 1),
              ("""    async fn power_off(&self, _interactive: bool) -> zbus::fdo::Result<()> {\n        self.manager\n""", """    async fn power_off(&self, interactive: bool) -> zbus::fdo::Result<()> {\n        let _ = interactive;\n        self.manager\n""", 1),
              ("""    async fn reboot(&self, _interactive: bool) -> zbus::fdo::Result<()> {\n        self.manager\n""", """    async fn reboot(&self, interactive: bool) -> zbus::fdo::Result<()> {\n        let _ = interactive;\n        self.manager\n""", 1),
              ("""    fn kill(&self, _signal: i32) -> zbus::fdo::Result<()> {\n        let pid = self\n""", """    fn kill(&self, signal: i32) -> zbus::fdo::Result<()> {\n        let _ = signal;\n        let pid = self\n""", 1),
              ("fn state<'a>(&'a self) -> &'static str", "fn state(&self) -> &'static str", 2),
          ]
          for old, new, expected in replacements:
              actual = source.count(old)
              if actual != expected:
                  raise SystemExit(
                      f"expected {expected} occurrence(s) of {old!r}, found {actual}"
                  )
              source = source.replace(old, new, expected)
          path.write_text(source)
          PY
          cargo fmt --all -- --check
          cargo clippy --bin rustd-logind --all-features --locked -- -D warnings -A clippy::doc_markdown -A clippy::default_trait_access -A clippy::borrow_as_ptr -A clippy::needless_borrows_for_generic_args -A clippy::map_unwrap_or -A clippy::bool_to_int_with_if
          git rm -- .github/workflows/fix-logind-clippy.yml
          expected=$'.github/workflows/fix-logind-clippy.yml\nsrc/bin/rustd-logind.rs'
          changed="$(git diff HEAD --name-only | sort)"
          if [[ "$changed" != "$expected" ]]; then
            printf 'Unexpected source changes:\n%s\n' "$changed" >&2
            exit 1
          fi
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git add -- src/bin/rustd-logind.rs
          git commit -m 'Clean up login manager collections'
          git push origin HEAD:main
