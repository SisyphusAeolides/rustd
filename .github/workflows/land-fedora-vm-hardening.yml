name: Land Fedora VM campaign hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/land-fedora-vm-hardening.yml

permissions:
  contents: write

concurrency:
  group: land-fedora-vm-hardening
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Serialize destructive cutover campaigns
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/fedora-full-vm-certification.yml')
          text = path.read_text()
          old = '''concurrency:
  group: fedora-44-full-vm-cutover
  cancel-in-progress: true
'''
          new = '''concurrency:
  group: fedora-44-full-vm-cutover
  cancel-in-progress: false
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Fedora VM concurrency block missing')

          marker = '''      - name: Install VM host tools
'''
          preflight = '''      - name: Verify release source prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -s LICENSE.LGPL-2.1
          test -s rustd-resolved/LICENSE.LGPL-2.1
          test -x scripts/build-fedora-rpms.sh
          grep -Fxq 'status=pass' certification/fedora-transaction-latest.txt

'''
          if preflight not in text:
              if marker not in text:
                  raise SystemExit('Fedora VM host-tool step missing')
              text = text.replace(marker, preflight + marker, 1)
          path.write_text(text)
          PY
          grep -A2 -F 'group: fedora-44-full-vm-cutover' \
            .github/workflows/fedora-full-vm-certification.yml | grep -Fxq '  cancel-in-progress: false'
          grep -Fq 'test -s LICENSE.LGPL-2.1' \
            .github/workflows/fedora-full-vm-certification.yml
          grep -Fq 'test -s rustd-resolved/LICENSE.LGPL-2.1' \
            .github/workflows/fedora-full-vm-certification.yml
          rm -f .github/workflows/land-fedora-vm-hardening.yml
          git add .github/workflows/fedora-full-vm-certification.yml \
            .github/workflows/land-fedora-vm-hardening.yml
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Harden Fedora VM cutover campaign'
          git pull --rebase origin main
          git push origin HEAD:main
